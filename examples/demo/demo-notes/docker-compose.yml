services:
  notes:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes: ["./server.mjs:/app/server.mjs:ro"]
    environment:
      SERVICE: demo-notes
      PORT: "8080"
    ports: ["127.0.0.1:18083:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 15
