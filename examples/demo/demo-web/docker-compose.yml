services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["node", "server.mjs"]
    volumes: ["./server.mjs:/app/server.mjs:ro"]
    environment:
      SERVICE: demo-web
      PORT: "8080"
      # Standalone default: demo-api's own `make up` on the host.
      UPSTREAM_URL: ${DEMO_API_URL:-http://host.docker.internal:18081/}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:18082:8080"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      retries: 15
