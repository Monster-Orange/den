<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/kit/fonts.css" />
    <link rel="stylesheet" href="/kit/tokens.css" />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <link rel="stylesheet" href="/vendor/xterm.css" />
    <title>__DEN_TITLE__ · Server agent</title>
    <style>
      /* The server agent's page (ON-6): the prototype's page header (.ph,
         R20), then the agent's terminal as the page, the Agents tab's pane
         look (.pane .term) without its list. --r is --radius. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      html body.den-has-shell > #den-content {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
        overflow: auto;
        padding: 20px 24px 14px 24px;
        font: 14px/1.45 var(--sans);
        color: var(--text);
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent-text);
      }
      .ph {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }
      .ph h1 {
        font: 600 22px/1.2 var(--display);
        margin: 0;
        text-wrap: balance;
      }
      .ph .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      .ph .acts {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .ph label {
        font-size: 13px;
        color: var(--muted);
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .ph select {
        font: inherit;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-button);
        padding: 4px 8px;
      }
      .note {
        color: var(--muted);
        font-size: 13px;
        margin: 0 0 10px;
      }
      .note.bad {
        color: var(--bad);
      }
      h2.sec {
        font: 600 13px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      section {
        margin-bottom: 22px;
      }
      code {
        font: 12.5px var(--mono);
      }
      .sa-steps li,
      .sa-install li {
        margin-bottom: 6px;
      }
      .sa-idle {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .sa-idle p {
        margin: 0;
      }
      /* The terminal is the page: it takes what is left. */
      #sa-pane {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
      }
      #sa-pane:empty {
        display: none;
      }
      .sa-term {
        flex: 1 1 auto;
        min-height: 240px;
        min-width: 0;
        display: grid;
        grid-template: auto minmax(0, 1fr) / minmax(0, 1fr);
        padding: 6px 4px 4px 8px;
        background: var(--sunken);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        overflow: hidden;
      }
      /* 0.4.46: reconnecting on its own (a quiet line), or the button. */
      .sa-term .sa-recon {
        grid-row: 1;
        margin: 0 0 4px;
        font-size: 12px;
        color: var(--muted);
      }
      .sa-term .sa-recon:empty {
        display: none;
      }
      .sa-term .tbox {
        grid-row: 2;
        min-height: 0;
        min-width: 0;
        overflow: hidden;
      }
      .sa-term .xterm {
        height: 100%;
      }
      .sa-term .xterm .xterm-viewport {
        background-color: var(--sunken);
      }
      /* 0.4.46 Start fresh: its button (the confirm is the kit's, issue 669). */
      .sa-acts {
        display: flex;
        justify-content: flex-end;
        margin: 4px 0;
      }
      /* Issue 52: the agent's views and the Coach tab (mock v2). */
      .sa-tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--border);
        margin: 0 0 14px;
      }
      .sa-tabs [role="tab"] {
        padding: 8px 14px;
        min-height: 36px;
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
      }
      .sa-tabs [role="tab"].on {
        color: var(--text);
        border-color: var(--accent);
        font-weight: 600;
      }
      #sa-coach[hidden],
      #sa-body[hidden],
      #sa-pane[hidden] {
        display: none;
      }
      .co-runbar {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        margin-bottom: 12px;
      }
      .co-st {
        flex: 1;
        min-width: 220px;
      }
      .co-st b {
        font-weight: 600;
      }
      .co-st small {
        display: block;
        color: var(--muted);
        font-size: 13px;
      }
      .co-bad {
        color: var(--bad);
      }
      .co-prog {
        height: 6px;
        border-radius: 3px;
        background: var(--sunken);
        overflow: hidden;
        margin-top: 6px;
      }
      .co-prog i {
        display: block;
        height: 100%;
        background: var(--accent-fill, var(--accent));
      }
      .co-emp {
        border: 1px dashed var(--border-strong, var(--border));
        border-radius: 10px;
        padding: 28px 18px;
        text-align: center;
        background: var(--surface);
      }
      .co-emp h3 {
        margin: 0 0 6px;
      }
      .co-emp p {
        margin: 0 auto 12px;
        max-width: 52ch;
        color: var(--muted);
      }
      .co-tiles {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-bottom: 12px;
      }
      .co-tl {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 8px 12px;
      }
      .co-tl small {
        display: block;
        color: var(--muted);
        font-size: 12.5px;
      }
      .co-tl b {
        font-size: 19px;
        font-weight: 600;
      }
      .co-tl i {
        font-style: normal;
        color: var(--faint, var(--muted));
        font-size: 12.5px;
        margin-left: 6px;
      }
      .co-tt {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin: 2px 0 8px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .co-seg {
        display: inline-flex;
        border: 1px solid var(--border-strong, var(--border));
        border-radius: 6px;
        overflow: hidden;
      }
      .co-seg button {
        padding: 4px 10px;
        min-height: 28px;
        background: none;
        border: 0;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }
      .co-seg button.on {
        background: var(--accent-fill, var(--accent));
        color: var(--on-accent, #fff);
      }
      .co-tw {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
      }
      .co-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
        background: var(--surface);
      }
      .co-table th {
        font-weight: 600;
        text-align: right;
        padding: 0;
        background: var(--raised, var(--surface));
        border-bottom: 1px solid var(--border);
        font-size: 12px;
        line-height: 1.25;
        vertical-align: bottom;
      }
      .co-table th button {
        all: unset;
        display: block;
        box-sizing: border-box;
        width: 100%;
        padding: 8px 6px;
        color: var(--muted);
        cursor: pointer;
        text-align: inherit;
      }
      .co-table td {
        text-align: right;
        padding: 9px 6px;
        border-bottom: 1px solid var(--border);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .co-table th:first-child,
      .co-table td:first-child {
        text-align: left;
        padding-left: 12px;
        position: sticky;
        left: 0;
        background: var(--surface);
      }
      .co-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .co-r {
        cursor: pointer;
      }
      .co-r.sel td {
        background: color-mix(in srgb, var(--accent) 10%, var(--surface));
      }
      .co-hi {
        color: var(--warn);
        font-weight: 600;
      }
      .co-why,
      .co-muted,
      .co-foot {
        color: var(--muted);
      }
      .co-foot {
        font-size: 12.5px;
        margin: 6px 0 0;
      }
      .co-cards {
        display: none;
      }
      .co-ac {
        display: block;
        width: 100%;
        text-align: left;
        font: inherit;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px 12px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      .co-ac .h {
        display: flex;
        justify-content: space-between;
        font-weight: 600;
      }
      .co-ac .g {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 12px;
        margin-top: 6px;
        font-size: 13.5px;
        color: var(--muted);
      }
      .co-ac .g b {
        color: var(--text);
        font-weight: 600;
      }
      .co-det {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        margin-top: 12px;
      }
      .co-det h4 {
        margin: 0;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        font-size: 15px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .co-det .co-sp {
        margin-left: auto;
        color: var(--muted);
        font-weight: 400;
        font-size: 13px;
      }
      .co-back {
        display: none;
      }
      .co-cols {
        display: grid;
        grid-template-columns: 1.4fr 1fr;
      }
      .co-cols > div {
        padding: 10px 14px;
        min-width: 0;
      }
      .co-cols > div + div {
        border-left: 1px solid var(--border);
      }
      .co-det h5 {
        margin: 0 0 6px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 600;
      }
      .co-cv {
        display: grid;
        grid-template-columns: 128px 96px 1fr;
        gap: 8px;
        padding: 5px 0;
        border-bottom: 1px solid var(--border);
        font-size: 13.5px;
      }
      .co-cv:last-child {
        border: 0;
      }
      .co-cv small {
        color: var(--muted);
      }
      .co-kd {
        display: inline-block;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 12px;
        border: 1px solid var(--border-strong, var(--border));
        color: var(--muted);
      }
      .co-kd.rot {
        color: var(--warn);
        border-color: var(--warn);
      }
      .co-mix {
        margin-bottom: 10px;
      }
      .co-bar {
        display: flex;
        height: 14px;
        border-radius: 4px;
        overflow: hidden;
        margin: 4px 0;
        border: 1px solid var(--border);
      }
      .co-bar i {
        display: block;
      }
      .co-bar .m-opus {
        background: #a371f7;
      }
      .co-bar .m-sonnet {
        background: #388bfd;
      }
      .co-bar .m-haiku {
        background: #3fb950;
      }
      .co-bar .m-other {
        background: var(--faint, var(--muted));
      }
      .co-mix small {
        color: var(--muted);
        font-size: 12.5px;
      }
      /* Mock v6: findings under the table, each with Dismiss. */
      .co-findings {
        margin-top: 16px;
      }
      .co-fh {
        margin: 0 0 8px;
        font-size: 15px;
      }
      .co-fh .co-muted {
        font-weight: 400;
        font-size: 13px;
        margin-left: 6px;
      }
      .co-ftable td,
      .co-ftable th {
        text-align: left;
        white-space: normal;
        vertical-align: top;
      }
      .co-ftable td:first-child,
      .co-ftable th:first-child {
        position: static;
      }
      .co-ftable td:last-child {
        text-align: right;
        white-space: nowrap;
      }
      .co-ftable th {
        padding: 8px 6px;
        color: var(--muted);
      }
      .co-fwhy {
        color: var(--muted);
        max-width: 520px;
      }
      .co-fcards {
        display: none;
      }
      .co-fc {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px 12px;
        margin-bottom: 8px;
      }
      .co-fc b,
      .co-fc small {
        display: block;
      }
      .co-fc small {
        color: var(--muted);
        margin: 2px 0 8px;
      }
      .co-fdis-wide {
        width: 100%;
        justify-content: center;
        min-height: 44px;
      }
      /* Issue 110 (mock v3): the change in words, Apply's states. */
      .co-fchg {
        margin: 4px 0 0;
        color: var(--text);
      }
      .co-apl {
        margin: 6px 0 0;
        font-size: 13px;
        color: var(--muted);
      }
      .co-fact > * + * {
        margin-left: 6px;
      }
      .co-chip {
        display: inline-flex;
        align-items: center;
        border: 1px solid var(--border-strong, var(--border));
        border-radius: 999px;
        padding: 2px 10px;
        font-size: 12.5px;
        white-space: nowrap;
      }
      .co-chip.wait {
        color: var(--warn);
        border-color: var(--warn);
      }
      .co-chip.ok {
        color: var(--ok);
      }
      .co-chip.bad {
        color: var(--bad);
        border-color: var(--bad);
      }
      .co-fc .co-fdis-wide + .co-fdis-wide {
        margin-top: 8px;
      }
      .co-fc .co-chip {
        margin-top: 8px;
      }
      .co-fnone {
        border: 1px dashed var(--border-strong, var(--border));
        border-radius: var(--radius);
        padding: 14px;
        color: var(--muted);
        background: var(--surface);
      }
      .co-toast {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        margin-bottom: 8px;
        border: 1px solid var(--border-strong, var(--border));
        border-radius: 999px;
        background: var(--raised, var(--surface));
        color: var(--text);
      }
      .co-link {
        all: unset;
        color: var(--accent-text, var(--accent));
        cursor: pointer;
        font-weight: 600;
      }
      .co-link:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .co-fail {
        color: var(--bad);
        margin: 8px 0 0;
      }
      .co-fdn {
        color: var(--muted);
        margin: 10px 0 4px;
      }
      .co-fdl {
        list-style: none;
        margin: 0;
        padding: 0;
        opacity: 0.75;
      }
      .co-fdl li {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
        padding: 6px 0;
        border-bottom: 1px solid var(--border);
      }
      .co-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      /* Phone: one card per agent; the detail is its own view. */
      @media (max-width: 600px) {
        .co-tiles,
        .co-tw,
        .co-foot,
        .co-tt-l {
          display: none;
        }
        .co-cards,
        .co-fcards {
          display: block;
        }
        .co-ftw {
          display: none;
        }
        .co-runbar .den-btn {
          width: 100%;
          justify-content: center;
          min-height: 44px;
        }
        .co-report.co-has-detail {
          display: none;
        }
        .co-det {
          border: 0;
          background: none;
          margin: 0;
        }
        .co-det h4 {
          padding: 0 0 8px;
          border: 0;
        }
        .co-back {
          display: inline-flex;
          all: unset;
          font-weight: 600;
          cursor: pointer;
          min-height: 44px;
          align-items: center;
        }
        .co-dname,
        .co-close {
          display: none;
        }
        .co-det .co-sp {
          margin-left: 0;
          flex-basis: 100%;
        }
        .co-cols {
          grid-template-columns: 1fr;
        }
        .co-cols > div {
          padding: 0 0 10px;
        }
        .co-cols > div + div {
          border-left: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="server-agent"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div class="ph">
        <div>
          <h1 id="sa-title">__DEN_TITLE__ agent</h1>
          <div class="sub" id="sa-sub"></div>
        </div>
        <div class="acts">
          <label id="sa-runtime" hidden
            ><span>Runs on</span>
            <select></select
          ></label>
          <label id="sa-model" hidden
            ><span>Model</span>
            <select></select
          ></label>
          <a class="den-btn" id="sa-open" href="/agents" hidden
            >Open in Agents</a
          >
        </div>
      </div>
      <!-- Issue 52: the agent's views, Terminal (as it was) and Coach. -->
      <div
        class="sa-tabs"
        id="sa-tabs"
        role="tablist"
        aria-label="Agent views"
        data-t-attr="aria-label:co.tabs"
      >
        <button
          type="button"
          role="tab"
          id="sa-tab-terminal"
          data-tab="terminal"
          aria-controls="sa-body"
          aria-selected="true"
          class="on"
          data-t="co.tab.terminal"
        >
          Terminal
        </button>
        <button
          type="button"
          role="tab"
          id="sa-tab-coach"
          data-tab="coach"
          aria-controls="sa-coach"
          aria-selected="false"
          tabindex="-1"
          data-t="co.tab.coach"
        >
          Coach
        </button>
      </div>
      <div id="sa-body" aria-busy="true" aria-live="polite"></div>
      <div id="sa-pane"></div>
      <div
        id="sa-coach"
        role="tabpanel"
        aria-labelledby="sa-tab-coach"
        aria-busy="true"
        hidden
      ></div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import { mountServerAgentPage } from "/server-agent-page.js";
        import { mountTabs } from "/coach-tab.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        void mountServerAgentPage(document.getElementById("den-content"));
        mountTabs(document);
      </script>
    </main>
  </body>
</html>
