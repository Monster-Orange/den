            ? `<span class="tbl-mode"><span class="badge ${escHtml(mode)}">${escHtml(mode)}</span><button type="button" class="tbl-switch" data-action="tbl-mode" data-repo="${escHtml(repo)}" data-mode="${switchTo}" aria-label="${escHtml(repo)}: use ${mode === "managed" ? "local" : "managed"}" data-k="mode:${escHtml(repo)}">use ${mode === "managed" ? "local" : "managed"}</button></span>`
            : "";
          const head = `<tr class="repo${r.problem ? " prob" : ""}" data-repo="${escHtml(repo)}">
              <th scope="row">${exp}<span class="repo-name">${escHtml(repo)}</span>${badges}</th>
              <td>${repoHealth(r)}</td>
              <td class="tbl-mono tbl-muted">${escHtml(primary?.branch ?? "")}</td>
              <td>${modeCell}</td>
              <td class="tbl-muted${run.cls ? " " + run.cls : ""}" data-last="${escHtml(repo)}">${escHtml(run.text)}</td>
              <td><div class="tbl-acts">${actBtns(repo, { up: !!startOf(repo).length, restart: !!startOf(repo).length })}${repoMenu(r)}</div></td>
            </tr>`;
          const fixes = r.fixes
            .map(
              ({ c, fix }) => `<tr class="fix" data-repo="${escHtml(repo)}">
              <td colspan="${TBL_COLS}"><span class="den-dot bad" aria-hidden="true"></span> <span class="fix-t"><span class="tbl-mono">${escHtml(c.id)}</span> · ${escHtml(fix.text)}</span>
              ${fix.actions
                .map(
                  (a) =>
                    `<button type="button" class="den-btn sm tbl-btn${a.primary ? " primary" : ""}" data-action="tbl-fix-${a.act}" data-id="${escHtml(c.id)}" aria-label="${escHtml(a.name)}" data-k="fix-${a.act}:${escHtml(c.id)}">${escHtml(a.label)}</button>`,
                )
                .join(" ")}</td>
            </tr>`,
            )
            .join("");
          const subs = many
            ? svcs
                .map(
                  (
                    s,
                    i,
                  ) => `<tr class="sub" id="${subIds[i]}" data-repo="${escHtml(repo)}" data-id="${escHtml(s.id)}"${shown(s) ? "" : " hidden"}>
              <th scope="row"><span class="repo-name">${escHtml(s.name)}</span>${s.entry ? ' <span class="badge">entry</span>' : ""}</th>
              <td>${!_lastHealthAt ? CHECKING() : healthCell(status(s), s.health.ok === false ? checkLineOf(s) : healthLine(s))}</td>
              <td></td><td></td><td></td>
              <td><div class="tbl-acts">${actBtns(s.id, { up: s.commands.includes("up"), restart: s.commands.includes("up") || s.commands.includes("restart") })}<span class="tbl-more-sp" aria-hidden="true"></span></div></td>
            </tr>`,
                )
                .join("")
            : "";
          const deps = missing
            .map(
              (dep) => `<tr class="dep-missing-row">
              <td colspan="${TBL_COLS - 1}"><span class="dep-label">⚠ missing dep: <strong>${escHtml(dep)}</strong></span></td>
              <td><button class="add-btn" data-action="add-dep" data-dep="${escHtml(dep)}">Add</button></td>
            </tr>`,
            )
            .join("");
          return head + fixes + subs + deps;
        }
        /** What a down service's check said (the drawer's line). */
        function checkLineOf(s) {
          const h = (_lastHealthResults || []).find(
            (x) =>
              x.repo === s.repo &&
              (x.service === s.name || `${x.repo}/${x.service}` === s.id),
          );
          return h ? checkLine(h) : "down";
        }

        /** Draw (or redraw) the table's body; focus stays where it was. */
        function renderTable() {
          const table = document.getElementById("repo-table");
          if (!table || !_tbl) return;
          const keep = table.contains(document.activeElement)
            ? document.activeElement.dataset?.k
            : null;
          const q = _tblQuery;
          const rows = tableModel()
            .filter(
              (r) =>
                !q.trim() ||
                findHit(r.repo, q) ||
                r.svcs.some((s) => findHit(s.id, q)),
            )
            .sort(byProblemThenOrder);
          table.querySelectorAll("tbody").forEach((b) => b.remove());
          const groups = tableGroups(rows);
          const html = rows.length
            ? groups
                .map((g) => {
                  const appBtns =
                    g.app && (g.app.addresses || []).length
                      ? `<span class="g-acts">
                    <button type="button" class="den-btn sm tbl-btn" data-action="tbl-app" data-cmd="up" data-app="${escHtml(g.app.name)}" aria-label="Up ${escHtml(g.title)}">▶ Up</button>
                    <button type="button" class="den-btn sm tbl-btn" data-action="tbl-app" data-cmd="restart" data-app="${escHtml(g.app.name)}" aria-label="Restart ${escHtml(g.title)}">↻ Restart</button>
                    <button type="button" class="den-btn sm tbl-btn" data-action="tbl-app" data-cmd="down" data-app="${escHtml(g.app.name)}" aria-label="Down ${escHtml(g.title)}">⏹ Down</button>
                  </span>`
                      : "";
                  const meta = g.app
                    ? [
                        g.app.title !== g.app.name ? g.app.name : "",
                        g.app.owner || "",
                        (g.app.contributors || []).length
                          ? `contributes: ${g.app.contributors.map((c) => c.repo).join(", ")}`
                          : "",
                        (g.app.absent || []).length
                          ? `not in this workspace: ${g.app.absent.join(", ")}`
                          : "",
                      ]
                        .filter(Boolean)
                        .join(" · ")
                    : "";
                  const head = g.title
                    ? `<tr class="g"><th scope="rowgroup" colspan="${TBL_COLS}">${escHtml(g.title)}${meta ? `<span class="g-meta">${escHtml(meta)}</span>` : ""}${appBtns}</th></tr>`
                    : "";
                  return `<tbody data-group="${escHtml(g.key)}">${head}${g.rows.map(repoRows).join("")}</tbody>`;
                })
                .join("")
            : `<tbody><tr class="tbl-none"><td colspan="${TBL_COLS}">No repo matches “${escHtml(q)}”</td></tr></tbody>`;
          table.insertAdjacentHTML("beforeend", html);
          if (keep)
            table.querySelector(`[data-k="${CSS.escape(keep)}"]`)?.focus();
        }
        /** Only the Last run cells (the dock changed). */
        function paintLastRuns() {
          document.querySelectorAll("#repo-table [data-last]").forEach((td) => {
            const run = lastRunText(td.dataset.last);
            td.textContent = run.text;
            td.className = "tbl-muted" + (run.cls ? " " + run.cls : "");
          });
        }

        /**
         * What starting `repo` runs: the server's `upTargets`, the decision
         * `__DEN_CLI__ up <repo>` makes (its own up, its compose stack's, else
         * its services'); [] when it has no up. An older server without the
         * field: its services that declare up.
         */
        function startOf(repo) {
          const svcs = (_tbl?.svcList ?? []).filter((s) => s.repo === repo);
          const t = svcs.find((s) => Array.isArray(s.upTargets))?.upTargets;
          return (
            t ??
            svcs.filter((s) => s.commands.includes("up")).map((s) => s.address)
          );
        }
        /** The repo's addresses that can run `cmd` (all for down). */
        function repoAddresses(repo, cmd) {
          // Start and Restart run what `up <repo>` starts.
          if (cmd === "up" || cmd === "restart") return startOf(repo);
          const svcs = (_tbl?.svcList ?? []).filter((s) => s.repo === repo);
          const can = svcs.filter(
            (s) =>
              cmd === "down" ||
              s.commands.includes(cmd) ||
              (cmd === "restart" && s.commands.includes("up")),
          );
          return (can.length ? can : svcs).map((s) => s.address);
        }
        /** Start/Stop/Restart a repo (each of its services) or one service. */
        function runTableCmd(id, cmd) {
          const svc = (_tbl?.svcList ?? []).find((s) => s.address === id);
          if (svc) {
            window.runCmd(svc.address, svc.repo, svc.service, cmd);
            return;
          }
          const addrs = repoAddresses(id, cmd);
          if (addrs.length) window.runWorkspaceCmd(cmd, addrs);
        }
        function logsOf(id) {
          const svc =
            (_tbl?.svcList ?? []).find((s) => s.address === id) ??
            (_tbl?.svcList ?? []).find((s) => s.repo === id);
          if (svc) openSystemLogs(svc.address, svc.repo, svc.service);
        }

        // The table's own controls: Find, Group by, expand, actions.
        document.getElementById("content").addEventListener("input", (e) => {
          if (e.target.id !== "tbl-find") return;
          _tblQuery = e.target.value;
          renderTable();
        });
        document.getElementById("content").addEventListener("click", (e) => {
          const g = e.target.closest("#tbl-group [data-group]");
          if (g) {
            setTableGroup(g.dataset.group);
            return;
          }
          const b = e.target.closest("[data-action^='tbl-']");
          if (!b || b.disabled) return;
          const a = b.dataset.action;
          if (a === "tbl-exp") {
            const repo = b.dataset.repo;
            if (_tblOpen.has(repo)) _tblOpen.delete(repo);
            else _tblOpen.add(repo);
            renderTable();
          } else if (
            a === "tbl-up" ||
            a === "tbl-down" ||
            a === "tbl-restart"
          ) {
            runTableCmd(b.dataset.id, a.slice(4));
          } else if (a === "tbl-logs" || a === "tbl-fix-logs") {
            logsOf(b.dataset.id);
          } else if (a === "tbl-fix-start") {
            const [repo, ...rest] = b.dataset.id.split("/");
            window.runCmd(b.dataset.id, repo, rest.join("/"), "up");
          } else if (a === "tbl-mode") {
            window.switchMode(b.dataset.repo, b.dataset.mode);
          } else if (a === "tbl-app") {
            const app = (_tbl?.appTree.applications || []).find(
              (x) => x.name === b.dataset.app,
            );
            if (app?.addresses?.length)
              window.runWorkspaceCmd(b.dataset.cmd, app.addresses);
          }
        });

        // Group by: a user pref (graph.groupBy), mirrored for the first paint.
        const LS_GROUP = "__DEN_CLI__-ws-group";
        function paintGroup() {
          document
            .querySelectorAll("#tbl-group [data-group]")
            .forEach((b) =>
              b.setAttribute(
                "aria-pressed",
                String(b.dataset.group === _tblGroup),
              ),
            );
          renderTable();
        }
        function setTableGroup(v) {
          if (!["none", "app", "org"].includes(v) || v === _tblGroup) return;
          _tblGroup = v;
          paintGroup();
          try {
            localStorage.setItem(LS_GROUP, v);
          } catch {}
          fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ graph: { groupBy: v } }),
          }).catch(() => {});
        }
        try {
          const v = localStorage.getItem(LS_GROUP);
          if (["none", "app", "org"].includes(v)) _tblGroup = v;
        } catch {}
        // The Last run column follows the dock.
        window.denShell?.runs?.onChange?.(paintLastRuns);

        // ── Tab management (one persistent tab per service address) ───────────────
        //
        // Tab ID = service address ("shop/api", "tasks-runner").
        // Running multiple commands on the same service reuses the same tab;
        // each command gets a section header inside the output.

        //
        // The tabs are drawn by the shell's runs dock (R16, denShell.runs):
        // this map keeps what this page needs to drive them (the stream, its
        // kind, the tail to re-attach); the dock keeps the lines (the last
        // MAX_TAB_LINES), batches the DOM, auto-scrolls, copies and clears.
        // A tab pulses while a command runs in it (busy); a red dot marks a
        // failed last command, as before.
        const _tabs = new Map(); // address → { address, es, live, errored, busy }
        let _activeTabId = null;
        const runs = () => window.denShell.runs;
        const MAX_TAB_LINES = 1000;
        /**
         * The workspaces a tab's runs belong to (R24e): every one whose
         * services include its repo. A tab that is no repo's ("⟳ sync")
         * belongs to none, and the dock always shows it.
         */
        function wsOfAddress(address) {
          const repo = String(address).split("/")[0];
          return Object.entries(wsData?.workspaces ?? {})
            .filter(([, w]) => Object.hasOwn(w?.services ?? {}, repo))
            .map(([n]) => n);
        }
        /** The dock's tab for an address (no change of selection). */
        function dockTab(address) {
          const t = _tabs.get(address);
          runs().add(address, address, {
            ws: wsOfAddress(address),
            max: MAX_TAB_LINES,
            doneLine: false,
            onClose: closeTab,
            onSelect: (id) => activateTab(id),
            running: !!t?.busy,
            error: !!t?.errored,
          });
        }
        /** A command runs (or ended) in this tab: its dot pulses while busy. */
        function setBusy(address, on) {
          const t = _tabs.get(address);
          if (!t) return;
          t.busy = on;
          renderTabBar();
        }

        // ── Primary-service tab routing ───────────────────────────────────────────
        // Log tabs exist per SYSTEM, keyed by the repo's primary service address
        // (entrypoint, or the sole/root service) — not one tab per subsystem.
        // Workspace-wide fan-out output for sidecars routes into the repo's primary
        // tab. Populated from /api/services in renderContent.
        let _primaryByRepo = new Map();
        function setPrimaryRouting(svcList) {
          // Shared precedence (entrypoint > root-named > first seen) — same helper
          // the /logs toolbar uses, so "one thing per system" matches everywhere.
          _primaryByRepo = computePrimaryByRepo(svcList);
        }
        function tabRouteFor(address) {
          const repo = address.includes("/")
            ? address.slice(0, address.indexOf("/"))
            : address;
          return _primaryByRepo.get(repo) ?? address;
        }
        function isPrimaryAddr(address) {
          return tabRouteFor(address) === address;
        }

        // Open a system's logs in the output panel below the graph — stays in Local
        // Dev, never navigates to /logs. Routes to the system's primary tab (a
        // collapsed group card's address is the bare repo, which is not a real
        // service, so the caller passes the entrypoint's address).
        //
        // tailMeta/esKind are set BEFORE activating so ensureActiveTail owns the
        // attach: its `!tab.es` guard means clicking an already-live card re-focuses
        // the tab instead of stacking a second EventSource on it.
        function openSystemLogs(address, fallbackRepo, fallbackService) {
          const route = tabRouteFor(address);
          const slash = route.indexOf("/");
          const repo =
            slash === -1 ? (fallbackRepo ?? route) : route.slice(0, slash);
          const service =
            slash === -1 ? (fallbackService ?? route) : route.slice(slash + 1);
          clearDismissed(route); // explicit action — undo an earlier close
          if (!_tabs.has(route)) {
            _tabs.set(route, {
              address: route,
              lines: [],
              es: null,
              live: false,
              errored: false,
              autoScroll: true,
            });
          }
          const tab = _tabs.get(route);
          tab.tailMeta = { repo, service };
          tab.esKind = "tail";
          // Its whole point is output: the dock opens (R16a).
          ensureTab(route, { open: true });
        }

        // ── Dismissed tabs (per workspace) ────────────────────────────────────────
        // A tab is any output pane — a running daemon, a command's output, a validate
        // or sync pane. Closing ANY tab records it as dismissed for the current
        // workspace (localStorage) so it stays closed across reloads and workspace-
        // wide commands (Setup, Up/Down/Restart, workspace switch). AUTO re-openers
        // (reload re-seed + workspace-wide fan-out) subtract this set; EXPLICIT
        // single-service actions (a card's up/restart/down/setup, validate, sync)
        // clear the dismissal so the pane comes back on purpose.
        function _dismissKey() {
          const ws =
            activeWs ||
            new URLSearchParams(location.search).get("ws") ||
            "default";
          return `__DEN_CLI__:dismissedTabs:${ws}`;
        }
        function _readDismissed() {
          try {
            return new Set(
              JSON.parse(localStorage.getItem(_dismissKey()) || "[]"),
            );
          } catch {
            return new Set();
          }
        }
        function _writeDismissed(set) {
          try {
            localStorage.setItem(_dismissKey(), JSON.stringify([...set]));
          } catch {}
        }
        function isDismissed(address) {
          return _readDismissed().has(address);
        }
        function addDismissed(address) {
          const s = _readDismissed();
          s.add(address);
          _writeDismissed(s);
        }
        function clearDismissed(address) {
          const s = _readDismissed();
          if (s.delete(address)) _writeDismissed(s);
        }

        /**
         * Create tab if absent, always activate. The dock stays as it is
         * (R16a: a run starting never opens it) unless open: true.
         */
        function ensureTab(address, opts = {}) {
          if (!_tabs.has(address)) {
            _tabs.set(address, {
              address,
              lines: [],
              es: null,
              live: false,
              errored: false,
              autoScroll: true,
            });
          }
          renderTabBar();
          activateTab(address, { open: opts.open === true });
          return address;
        }

        function closeTab(address) {
          const tab = _tabs.get(address);
          if (!tab) return;
          addDismissed(address); // stays closed across reloads + workspace-wide commands
          if (tab.es) {
            try {
              tab.es.close();
            } catch {}
            tab.es = null;
          }
          _tabs.delete(address);
          runs().remove(address);
          if (_activeTabId === address) {
            const ids = [..._tabs.keys()];
            _activeTabId = ids[ids.length - 1] ?? null;
          }
          if (_activeTabId)
            activateTab(_activeTabId, { open: runs().isOpen() });
          else renderTabBar();
        }

        /** Select a tab (its tail attaches); the dock opens only with open: true. */
        function activateTab(address, opts = {}) {
          _activeTabId = address;
          ensureActiveTail();
          runs().select(address, { open: opts.open === true });
        }

        // Keep at most ONE live log (tail) stream open — the active tab's — so the
        // browser's per-host socket pool (~6) is never exhausted by many concurrent
        // tails. Active command (exec) streams are left untouched so their output
        // still completes when you switch away.
        function ensureActiveTail() {
          for (const [addr, t] of _tabs) {
            if (addr !== _activeTabId && t.esKind === "tail" && t.es) {
              try {
                t.es.close();
              } catch {}
              t.es = null;
              t.live = false;
            }
          }
          const tab = _tabs.get(_activeTabId);
          if (
            tab &&
            tab.tailMeta &&
            !tab.es &&
            tab.esKind === "tail" &&
            !document.hidden
          ) {
            startTailLog(_activeTabId, tab.tailMeta.repo, tab.tailMeta.service);
          }
          renderTabBar();
        }

        // A running daemon's tail stream can flood thousands of lines/sec (a
        // service stuck in a log loop). The dock caps the lines kept per tab
        // (max: MAX_TAB_LINES) and batches DOM appends into one
        // requestAnimationFrame flush, so a flood can't lock the page.
        function appendToTab(address, text, cls) {
          if (!_tabs.has(address)) return;
          if (!runs().has(address)) dockTab(address);
          runs().append(address, text, cls);
        }

        function setTabStatus(address, opts) {
          const tab = _tabs.get(address);
          if (!tab) return;
          if (opts.live !== undefined) tab.live = opts.live;
          if (opts.errored !== undefined) tab.errored = opts.errored;
          if (opts.es !== undefined) {
            if (tab.es && tab.es !== opts.es) {
              try {
                tab.es.close();
              } catch {}
            }
            tab.es = opts.es;
          }
          renderTabBar();
        }

        /** The dock's tabs from this map: their dots (busy, errored). */
        function renderTabBar() {
          for (const address of _tabs.keys()) dockTab(address);
        }

        // Release SSE sockets when the page is navigated away / reloaded / enters the
        // bfcache, and suspend passive log tails while the tab is hidden. Both keep
        // the per-host socket pool from staying saturated across reloads and tabs,
        // which is what left the document request "Pending forever". Command (exec)
        // streams are only closed on actual page unload, never on tab-hide, so a
        // running command isn't truncated when you switch tabs.
        window.addEventListener("pagehide", () => {
          for (const t of _tabs.values()) {
            if (t.es) {
              try {
                t.es.close();
              } catch {}
              t.es = null;
              t.live = false;
            }
          }
        });
        window.addEventListener("pageshow", (e) => {
          if (e.persisted) ensureActiveTail();
        });
        document.addEventListener("visibilitychange", () => {
          if (document.hidden) {
            for (const t of _tabs.values()) {
              if (t.esKind === "tail" && t.es) {
                try {
                  t.es.close();
                } catch {}
                t.es = null;
                t.live = false;
              }
            }
            renderTabBar();
          } else {
            ensureActiveTail();
          }
        });

        // (Auto-scroll pauses when you scroll up, and resumes at the bottom:
        // the dock does it per tab.)

        // ── Tail-log attachment ───────────────────────────────────────────────────
        function startTailLog(address, repo, service) {
          const tab = _tabs.get(address);
          if (tab) {
            tab.tailMeta = { repo, service };
            tab.esKind = "tail";
          }
          // Only the visible, active tab holds a live log stream. Each SSE pins one
          // of the browser's ~6 per-host sockets, so tailing every running daemon at
          // once (loadRunningDaemons) would exhaust the pool and wedge the whole UI
          // (the document/API requests can't get a socket). Background or hidden
          // tabs defer to tailMeta and re-attach when activated.
          if (address !== _activeTabId || document.hidden) {
            setTabStatus(address, { live: false, es: null });
            return;
          }
          const params = new URLSearchParams({ repo, service });
          const esTail = new EventSource(`/api/service/taillog?${params}`);
          setTabStatus(address, { live: true, errored: false, es: esTail });

          esTail.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            if (msg.type === "line") {
              const t = _tabs.get(address);
              if (t) t._tailRetries = 0; // healthy stream — reset backoff
              appendToTab(address, msg.text, "");
            }
          };
          esTail.onerror = () => {
            esTail.close();
            const t = _tabs.get(address);
            setTabStatus(address, { live: false, errored: false, es: null });
            if (!t) return;
            // The underlying log command can exit mid-flight (e.g. `docker logs -f`
            // ends when its container restarts and gets a new id) — dead-ending the
            // tab made logs "just stop". Re-attach with backoff while this tab is
            // active; each attempt re-resolves the log source, so a restarted
            // container's fresh id is picked up.
            t._tailRetries = (t._tailRetries || 0) + 1;
            const delay = Math.min(3000 * t._tailRetries, 30000);
            if (t._tailRetries === 1) {
              appendToTab(
                address,
                "── log stream interrupted — re-attaching… ──",
                "cmd",
              );
            }
            setTimeout(() => {
              const tab = _tabs.get(address);
              if (!tab || tab.es || tab.esKind !== "tail") return;
              if (_activeTabId !== address || document.hidden) return; // re-attaches on activate via ensureActiveTail
              startTailLog(address, repo, service);
            }, delay);
          };
        }

        // ── Load existing daemons on page load ────────────────────────────────────
        async function loadRunningDaemons() {
          const daemons = await fetch("/api/service/daemons")
            .then((r) => r.json())
            .catch(() => []);
          // Primary routing may not be built yet (this runs in parallel with the
          // first renderContent) — build it from /api/services so subsystem daemons
          // don't each open a tab.
          if (_primaryByRepo.size === 0 && daemons.length > 0) {
            const svcs = await fetch("/api/services?env=local")
              .then((r) => r.json())
              .catch(() => []);
            setPrimaryRouting(svcs);
          }
          for (const d of daemons) {
            if (!isPrimaryAddr(d.address)) continue; // one tab per SYSTEM (primary only)
            if (isDismissed(d.address)) continue; // user closed it — don't re-seed
            if (!_tabs.has(d.address)) {
              _tabs.set(d.address, {
                address: d.address,
                lines: [],
                es: null,
                live: false,
                errored: false,
                autoScroll: true,
                tailMeta: { repo: d.repoName, service: d.subsystem },
                esKind: "tail",
              });
            } else {
              const t = _tabs.get(d.address);
              t.tailMeta = { repo: d.repoName, service: d.subsystem };
              t.esKind = "tail";
            }
            appendToTab(
              d.address,
              `── reconnected (running since ${new Date(d.startedAt).toLocaleTimeString()}) ──`,
              "cmd",
            );
          }
          renderTabBar();
          // Attach a live stream to ONE tab only; the rest tail lazily when selected.
          // This bounds concurrent SSE to the socket budget no matter how many
          // daemons are running (the bug: 12 daemons → 12 tails → pool exhausted).
          const firstShown = daemons.find(
            (d) => isPrimaryAddr(d.address) && !isDismissed(d.address),
          );
          // On load the dock keeps its open/closed state.
          if (firstShown && !_activeTabId)
            activateTab(firstShown.address, { open: false });
        }

        // Re-read the workspace + service list after a sync and re-render the
        // current view. A sync can clone a repo for the first time, which flips a
        // card from "not cloned" (no commands, no manifest) to a fully populated
        // one — the card menus are built from that payload, so without this they
        // stay stale until a manual page refresh. Same idiom the other mutations
        // use (add service, mode switch, autostart toggle).
        async function refreshAfterSync() {
          const ws = activeWs || focusName();
          if (!ws) return;
          try {
            await loadWorkspaces();
            await refreshView(ws);
          } catch {
            /* a failed refresh must never mask the sync's own result */
          }
        }

        // ── Workspace-level command (SSE) ─────────────────────────────────────────
        // Routes output to each service's own tab as `label` events arrive.
        window.runWorkspaceSync = async function () {
          setAllButtons(true);
          setWsStatus("syncing…");
          const sudo = sudoRun();
          const es = new EventSource("/api/workspace/sync");
          // Clear previous sync output then open/activate the tab (explicit action).
          clearDismissed("⟳ sync");
          if (_tabs.has("⟳ sync")) runs().clear("⟳ sync");
          ensureTab("⟳ sync");
          setBusy("⟳ sync", true);
          es.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            sudo.see(msg);
            if (msg.type === "line") appendToTab("⟳ sync", msg.text);
            if (msg.type === "error")
              appendToTab("⟳ sync", "Error: " + msg.text, "err");
            if (msg.type === "done") {
              es.close();
              setBusy("⟳ sync", false);
              setAllButtons(false);
              setWsStatus("sync complete");
              setTimeout(() => setWsStatus(""), 3000);
              // See refreshAfterSync — a sync that clones brings new commands with it.
              refreshAfterSync();
              void sudo.done(() => window.runWorkspaceSync());
            }
          };
          es.onerror = () => {
            es.close();
            setBusy("⟳ sync", false);
            setAllButtons(false);
            setWsStatus("sync error");
          };
        };

        // ── Per-repo sync (SSE) ───────────────────────────────────────────────────
        // __DEN_TITLE__ runs each managed service from its OWN clone under
        // __DEN_SERVICES_DIR__/, not from a sibling checkout — so pulling the sibling
        // does nothing for __DEN_CLI__, and its clone can sit many commits behind
        // (measured: files-api 86, links-api 19). This pulls the clone
        // __DEN_CLI__ actually uses.
        //
        // When there is anything to pull (or a previous chain didn't finish), the
        // server runs the chain: down → pull → setup. Down FIRST, so the
        // service never hot-reloads into code its venv can't satisfy — a pull
        // moves pyproject/lock files but not the installed environment. Setup's
        // interactive prompts are auto-answered "n" and surfaced in the log.
        // These clones are __DEN_CLI__'s, not the user's, so __DEN_CLI__ owns keeping them
        // working; up-to-date repos are left completely untouched.
        //
        // Unlike the workspace-wide Sync, output goes to the SYSTEM's own log tab
        // rather than a shared pane, so it sits with everything else for that
        // system. Buttons are not globally disabled: it is one repo.
        const _syncing = new Set();
        window.runRepoSync = async function (repo) {
          if (_syncing.has(repo)) return; // already in flight — ignore re-entry
          _syncing.add(repo);
          const sudo = sudoRun();

          const route = tabRouteFor(repo);
          clearDismissed(route); // explicit action — undo any prior dismissal
          ensureTab(route);
          appendToTab(
            route,
            `\n─── ⟳ sync ${repo} (down → pull → setup) ───`,
            "cmd",
          );
          setWsStatus(`syncing ${repo}…`);

          setBusy(route, true);
          const finish = (status) => {
            _syncing.delete(repo);
            setBusy(route, false);
            setWsStatus(status);
            setTimeout(() => setWsStatus(""), 3000);
          };

          const es = new EventSource(
            "/api/workspace/sync?repo=" + encodeURIComponent(repo),
          );
          es.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            sudo.see(msg);
            if (msg.type === "line") appendToTab(route, msg.text);
            if (msg.type === "error")
              appendToTab(route, "Error: " + msg.text, "err");
            if (msg.type === "done") {
              es.close();
              finish("sync complete");
              void sudo.done(() => window.runRepoSync(repo));
              // A pull can replace this repo's health probes on disk. The health
              // response is cached ~8s, so force a fresh poll rather than leaving
              // dots that reflect the code we just replaced.
              const env = healthEnv();
              refreshHealth(env, { force: true });
              // Sync can CHANGE what a service offers — a first clone turns an
              // uncloned card (no commands, no manifest) into a full one. Re-render
              // from the server rather than leaving stale card menus until a manual
              // page refresh.
              refreshAfterSync();
            }
          };
          es.onerror = () => {
            es.close();
            appendToTab(route, "sync stream closed", "err");
            finish("sync error");
          };
        };

        window.runWorkspaceCmd = async function (cmd, addresses) {
          const sudo = sudoRun();
          const only =
            Array.isArray(addresses) && addresses.length
              ? `&addresses=${encodeURIComponent(addresses.join(","))}`
              : "";
          setAllButtons(true);
          setWsStatus(`${cmd}…`);
          const startTime = Date.now();
          let currentAddress = null; // tracks which service's tab to route lines to
          const busyRoutes = new Set(); // tabs this run made busy
          const idle = () => busyRoutes.forEach((r) => setBusy(r, false));

          const esWs = new EventSource(
            `/api/workspace/exec?cmd=${encodeURIComponent(cmd)}&workspace=${encodeURIComponent(activeWs || focusName())}${only}`,
          );

          esWs.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            sudo.see(msg);
            if (msg.type === "label") {
              // New service section — route to the SYSTEM's primary tab (one tab
              // per system; sidecar output lands in its repo's tab with a header).
              // Skip panes dismissed for this workspace (workspace-wide command).
              currentAddress = msg.text;
              const route = tabRouteFor(currentAddress);
              if (!isDismissed(route)) {
                ensureTab(route);
                const hdr =
                  route === currentAddress
                    ? `\n─── ${cmd} ───`
                    : `\n─── ${cmd}: ${currentAddress} ───`;
                appendToTab(route, hdr, "cmd");
                busyRoutes.add(route);
                setBusy(route, true);
              }
            } else if (msg.type === "line") {
              const dest = currentAddress
                ? tabRouteFor(currentAddress)
                : "── info ──";
              if (!currentAddress) ensureTab(dest);
              appendToTab(dest, msg.text, "");
            } else if (msg.type === "error") {
              const dest = currentAddress
                ? tabRouteFor(currentAddress)
                : "── info ──";
              if (!currentAddress) ensureTab(dest);
              appendToTab(dest, msg.text, "err");
            } else if (msg.type === "svc-done" && msg.address) {
              const addr = msg.address;
              const route = tabRouteFor(addr);
              const ok = msg.exitCode === 0;
              if (isPrimaryAddr(addr)) setBusy(route, false);
              if (msg.detached) {
                if (isPrimaryAddr(addr)) {
                  // Primary daemon spawned — auto-attach its live log stream.
                  appendToTab(route, "── live log ──", "cmd");
                  // Use server-provided repoName/subsystem so log path is correct even
                  // when the manifest key differs from the address (e.g. tasks-runner).
                  const repo = msg.repoName ?? addr;
                  const service = msg.subsystem ?? addr;
                  startTailLog(route, repo, service);
                } else {
                  // Sidecar daemon — don't hijack the primary tab's tail.
                  appendToTab(
                    route,
                    `── ${addr} running (logs on the /logs page) ──`,
                    "cmd",
                  );
                }
              } else {
                const suffix = ok ? " ✓" : ` ✗ exit ${msg.exitCode}`;
                appendToTab(route, suffix, ok ? "done-ok" : "done-fail");
                if (isPrimaryAddr(addr))
                  setTabStatus(route, { live: false, errored: !ok });
              }
            } else if (msg.type === "done") {
              const ok = msg.exitCode === 0;
              setWsStatus(ok ? "✓ done" : "✗ failed");
              setTimeout(() => setWsStatus(""), 3000);
              setAllButtons(false);
              esWs.close();
              idle();
              // Lifecycle changed run-state — sync dots now, don't wait for the poll.
              syncHealthNow();
              void sudo.done(() => window.runWorkspaceCmd(cmd, addresses));
            }
          };
          esWs.onerror = () => {
            idle();
            if (currentAddress)
              appendToTab(currentAddress, "Connection lost", "err");
            setWsStatus("");
            setAllButtons(false);
            esWs.close();
          };
        };

        function setWsStatus(text) {
          const el = document.getElementById("ws-cmd-status");
          if (el) el.textContent = text;
        }

        function setAllButtons(disabled) {
          document
            .querySelectorAll(".master-btn, .cmd-btn, .tbl-btn")
            .forEach((b) => {
              if (!b.hasAttribute("title") || disabled) b.disabled = disabled;
            });
        }

        // ── Per-service command (SSE) ──────────────────────────────────────────────
        // Start a system together with its dependency closure. The closure itself
        // is derived on the SERVER (see the `seed` param in /api/workspace/exec):
        // its rules are load-bearing, and the already-healthy skip it relies on is
        // suppressed whenever an explicit address list is sent.
        window.runUpWithDeps = async function (repo) {
          void runWorkspaceCmdAsync("up", null, {
            seed: repo,
            undismiss: true,
          });
        };

        // Stop a system together with the dependencies it was started with — the
        // same closure as "up with deps", reversed. Derived server-side for the
        // same reason as its counterpart: the already-stopped skip is suppressed
        // when an explicit address list is sent.
        window.runDownWithDeps = async function (repo) {
          void runWorkspaceCmdAsync("down", null, {
            seed: repo,
            undismiss: true,
          });
        };

        window.runCmd = async function (address, repo, service, cmd) {
          // Explicit single-service action — undo any prior dismissal so its pane returns.
          clearDismissed(address);
          // up/restart/down go through the workspace-exec runner: it uses the full
          // service runner (opctl-conventional down works even with no manifest
          // down command; readiness gating for up) instead of the raw manifest-
          // command endpoint.
          if (cmd === "up" || cmd === "restart" || cmd === "down") {
            void runWorkspaceCmdAsync(cmd, [address]);
            return;
          }
          ensureTab(address);
          appendToTab(address, `\n─── ${cmd} ───`, "cmd");
          document
            .querySelectorAll(".cmd-btn")
            .forEach((b) => (b.disabled = true));
          setTabStatus(address, { live: true, errored: false });
          setBusy(address, true);

          const params = new URLSearchParams({
            repo,
            service,
            cmd,
            env: "local",
          });
          const esCmd = new EventSource(`/api/service/exec?${params}`);
          setTabStatus(address, { es: esCmd });
          const _cmdTab = _tabs.get(address);
          if (_cmdTab) _cmdTab.esKind = "exec";
          const sudo = sudoRun();
          const again = () => window.runCmd(address, repo, service, cmd);

          esCmd.onmessage = (e) => {
            const msg = JSON.parse(e.data);
            sudo.see(msg);
            if (msg.type === "cmd") {
              appendToTab(address, msg.text, "cmd");
            } else if (msg.type === "started") {
              // Daemon spawned — re-enable buttons, keep streaming startup output.
              document
                .querySelectorAll(".cmd-btn")
                .forEach((b) => (b.disabled = false));
            } else if (msg.type === "service-exited") {
              // The launch script (make up) finished — service handed off to container
              // runtime. Close the startup-output SSE and switch to the manifest log
              // source (docker logs -f, etc.) for ongoing live output.
              esCmd.close();
              setBusy(address, false);
              if (msg.exitCode === 0) {
                appendToTab(address, "── live log ──", "cmd");
                startTailLog(
                  address,
                  msg.repoName ?? repo,
                  msg.subsystem ?? service,
                );
              } else {
                appendToTab(
                  address,
                  `✗ launch failed (exit ${msg.exitCode})`,
                  "done-fail",
                );
                setTabStatus(address, { live: false, errored: true, es: null });
                void sudo.done(again);
              }
            } else if (msg.type === "line") {
              appendToTab(address, msg.text, "");
            } else if (msg.type === "error") {
              appendToTab(address, msg.text, "err");
            } else if (msg.type === "done") {
              // Non-detachable command (down, setup) finished.
              esCmd.close();
              document
                .querySelectorAll(".cmd-btn")
                .forEach((b) => (b.disabled = false));
              const ok = msg.exitCode === 0;
              if (msg.duration > 0)
                appendToTab(
                  address,
                  `${ok ? "✓ done" : "✗ failed"} in ${fmtMs(msg.duration)}`,
                  ok ? "done-ok" : "done-fail",
                );
              _tabs.get(address) && (_tabs.get(address).busy = false);
              setTabStatus(address, { live: false, errored: !ok, es: null });
              void sudo.done(again);
            }
          };
          esCmd.onerror = () => {
            appendToTab(address, "Connection closed", "err");
            _tabs.get(address) && (_tabs.get(address).busy = false);
            setTabStatus(address, { live: false, errored: true, es: null });
            document
              .querySelectorAll(".cmd-btn")
              .forEach((b) => (b.disabled = false));
            esCmd.close();
          };
        };

        // ── Add Service modal ─────────────────────────────────────────────────────

        window.openAddSvcModal = function (wsName) {
          _addSvcWsName = wsName;
          _addSvcSelectedGh = null;
          _addSvcSelectedLocal = null;
          document.getElementById("add-svc-title").textContent =
            "Add Service — " + wsName;
          document.getElementById("add-svc-msg").textContent = "";
          document.getElementById("add-svc-gh-config").style.display = "none";
          document.getElementById("add-svc-submit").disabled = true;
          document.getElementById("add-svc-global-search").value = "";
          _renderAddSvcLocalList();
          _renderAddSvcGhList();
          const hasLocal = [..._addSvcLocalRepos, ..._addSvcManagedRepos].some(
            (r) => !r.alreadyAdded,
          );
          _switchAddSvcTab(hasLocal ? "local" : "gh");
          document.getElementById("add-svc-backdrop").style.display = "flex";
        };

        window.closeAddSvcModal = function (evt) {
          if (evt && evt.target !== document.getElementById("add-svc-backdrop"))
            return;
          document.getElementById("add-svc-backdrop").style.display = "none";
          _addSvcSelectedGh = null;
          _addSvcSelectedLocal = null;
        };

        function _switchAddSvcTab(tab) {
          document
            .getElementById("add-svc-tab-local")
            .classList.toggle("active", tab === "local");
          document
            .getElementById("add-svc-tab-gh")
            .classList.toggle("active", tab === "gh");
          document.getElementById("add-svc-panel-local").style.display =
            tab === "local" ? "" : "none";
          document.getElementById("add-svc-panel-gh").style.display =
            tab === "gh" ? "" : "none";
          if (tab === "local") {
            _addSvcSelectedGh = null;
            document.getElementById("add-svc-gh-config").style.display = "none";
            document.getElementById("add-svc-submit").disabled =
              _addSvcSelectedLocal === null;
            _renderAddSvcGhList();
          } else {
            _addSvcSelectedLocal = null;
            _renderAddSvcLocalList();
            const hasSel = _addSvcSelectedGh !== null;
            document.getElementById("add-svc-gh-config").style.display = hasSel
              ? ""
              : "none";
            document.getElementById("add-svc-submit").disabled = !hasSel;
          }
        }
        window.switchAddSvcTab = _switchAddSvcTab;

        function _addSvcAddedSet() {
          const s = new Set();
          for (const key of Object.keys(_addSvcWsServices)) {
            s.add(key);
            const slash = key.indexOf("/");
            if (slash > 0) s.add(key.slice(0, slash));
          }
          return s;
        }

        function _wsFromRelPath(relPath) {
          // __DEN_WORKSPACES_DIR__/<name>/... → <name>
          const m = relPath.match(/^__DEN_WORKSPACES_DIR__\/([^/]+)\//);
          return m ? m[1] : null;
        }

        function _renderAddSvcLocalList() {
          const added = _addSvcAddedSet();
          const all = [..._addSvcLocalRepos, ..._addSvcManagedRepos];
          const query = (
            document.getElementById("add-svc-global-search")?.value || ""
          ).toLowerCase();

          if (!all.length) {
            document.getElementById("add-svc-local-list").innerHTML =
              '<div class="add-svc-empty">No local repos found</div>';
            return;
          }

          const makeRow = (r) => {
            const isAdded = added.has(r.relPath);
            const isSel = _addSvcSelectedLocal?.relPath === r.relPath;
            const isManaged = r.source === "managed";
            const wsName = _wsFromRelPath(r.relPath);
            const wsLabel = wsName || "None";
            const branchLabel = r.currentBranch ? " @ " + r.currentBranch : "";
            const wsBadge = wsName
              ? '<span class="add-svc-ws-badge">' + escHtml(wsName) + "</span>"
              : "";
            const addedBadge = isAdded
              ? '<span class="add-svc-pill added">added</span>'
              : "";
            const cls =
              "add-svc-row" +
              (isAdded ? " already" : " selectable") +
              (isSel ? " selected" : "");
            const onclick = isAdded
              ? ""
              : ' onclick="_selectAddSvcLocal(' +
                escHtml(JSON.stringify(r)) +
                ')"';
            return (
              '<div class="' +

        // ── Switch active workspace ───────────────────────────────────────────────
        // Promise-based wrapper — resolves when the SSE 'done' event arrives.
        function runWorkspaceCmdAsync(cmd, addresses, opts = {}) {
          return new Promise((resolve) => {
            setAllButtons(true);
            setWsStatus(`${cmd}…`);
            let currentAddress = null;
            const busyRoutes = new Set(); // tabs this run made busy
            const idle = () => busyRoutes.forEach((r) => setBusy(r, false));
            const params = new URLSearchParams({
              cmd,
              workspace: activeWs || focusName(),
            });
            if (addresses?.length) params.set("addresses", addresses.join(","));
            // `seed` and `addresses` are alternatives: seed asks the SERVER to
            // derive the dependency closure. It must not be sent alongside an
            // address filter — the filter suppresses the already-healthy skip and
            // the auto-start-off handling that make "with deps" behave.
            if (opts.seed) params.set("seed", opts.seed);
            const sudo = sudoRun();
            const es = new EventSource(`/api/workspace/exec?${params}`);
            es.onmessage = (e) => {
              const msg = JSON.parse(e.data);
              sudo.see(msg);
              if (msg.type === "label") {
                currentAddress = msg.text;
                // Route to the system's primary tab; skip dismissed panes on
                // workspace-wide fan-out. Explicit single-service callers clear
                // the dismissal before calling in.
                const route = tabRouteFor(currentAddress);
                // "up with deps" asked for these systems explicitly, so bring their
                // panes back rather than honouring an older dismissal. The closure
                // is only known server-side, so undismiss as each label arrives.
                if (opts.undismiss) clearDismissed(route);
                if (!isDismissed(route)) {
                  ensureTab(route);
                  const hdr =
                    route === currentAddress
                      ? `\n─── ${cmd} ───`
                      : `\n─── ${cmd}: ${currentAddress} ───`;
                  appendToTab(route, hdr, "cmd");
                  busyRoutes.add(route);
                  setBusy(route, true);
                }
              } else if (msg.type === "line") {
                const dest = currentAddress
                  ? tabRouteFor(currentAddress)
                  : "── info ──";
                if (!currentAddress) ensureTab(dest);
                appendToTab(dest, msg.text, "");
              } else if (msg.type === "error") {
                const dest = currentAddress
                  ? tabRouteFor(currentAddress)
                  : "── info ──";
                if (!currentAddress) ensureTab(dest);
                appendToTab(dest, msg.text, "err");
              } else if (msg.type === "svc-done" && msg.address) {
                const addr = msg.address;
                const route = tabRouteFor(addr);
                const ok = msg.exitCode === 0;
                if (isPrimaryAddr(addr)) setBusy(route, false);
                if (msg.detached) {
                  if (isPrimaryAddr(addr)) {
                    appendToTab(route, "── live log ──", "cmd");
                    const repo = msg.repoName ?? addr,
                      service = msg.subsystem ?? addr;
                    startTailLog(route, repo, service);
                  } else {
                    appendToTab(
                      route,
                      `── ${addr} running (logs on the /logs page) ──`,
                      "cmd",
                    );
                  }
                } else {
                  appendToTab(
                    route,
                    ok ? " ✓" : ` ✗ exit ${msg.exitCode}`,
                    ok ? "done-ok" : "done-fail",
                  );
                  if (isPrimaryAddr(addr))
                    setTabStatus(route, { live: false, errored: !ok });
                }
              } else if (msg.type === "done") {
                const ok = msg.exitCode === 0;
                setWsStatus(ok ? "✓ done" : "✗ failed");
                setTimeout(() => setWsStatus(""), 3000);
                setAllButtons(false);
                es.close();
                idle();
                // Lifecycle changed run-state — sync dots now, don't wait for the poll.
                syncHealthNow();
                // LK-0: after the admin password, the same run again.
                void sudo
                  .done(() => runWorkspaceCmdAsync(cmd, addresses, opts))
                  .then((again) => resolve(again ?? ok));
              }
            };
            es.onerror = () => {
              es.close();
              idle();
              setAllButtons(false);
              setWsStatus("");
              resolve(false);
            };
          });
        }

        // Returns { same: [addr,...], toDown: [addr,...] }
        // "same" = identical across both workspaces (same branch + same path) → keep running
        // "toDown" = present in old workspace but different or missing in new workspace
        function computeSwitchDiff(oldName, newName) {
          const oldSvcs = wsData?.workspaces?.[oldName]?.services ?? {};
          const newSvcs = wsData?.workspaces?.[newName]?.services ?? {};
          const same = [],
            toDown = [];
          for (const [addr, old] of Object.entries(oldSvcs)) {
            const next = newSvcs[addr];
            const sameBranch =
              (old.branch ?? "main") === (next?.branch ?? "main");
            const samePath = (old.path ?? "") === (next?.path ?? "");
            if (next && sameBranch && samePath) same.push(addr);
            else toDown.push(addr);
          }
          return { same, toDown };
        }

        // ── Delete workspace ──────────────────────────────────────────────────────
        window.deleteWorkspace = async function (e, name) {
          e.stopPropagation();

          // Step 1: confirm workspace removal
          if (!confirm(`Delete workspace "${name}"?`)) return;

          // Fetch cleanup preview to know what qualifies for deletion
          const preview = await fetch(
            `/api/workspaces/cleanup-preview?name=${encodeURIComponent(name)}`,
          )
            .then((r) => r.json())
            .catch(() => ({ devManaged: [], denManaged: [] }));

          // Step 2: workspace directory (__DEN_WORKSPACES_DIR__/<name>)
          let cleanupDirectory = false;
          const wsDir = wsData?.resolvedDirs?.[name];
          if (wsDir) {
            cleanupDirectory = confirm(
              `Also delete workspace directory from your machine?\n\n${wsDir}\n\nThis removes all files in the directory. Any unpushed commits will be lost.`,
            );
          }

          // Step 3: dev-managed repos (only shown if any qualify)
          let cleanupDev = false;
          if (preview.devManaged?.length > 0) {
            const repoList = preview.devManaged
              .map((r) => `  • ${r.address}`)
              .join("\n");
            cleanupDev = confirm(
              `Also delete ${preview.devManaged.length} dev-managed repo${preview.devManaged.length > 1 ? "s" : ""} from your machine?\n\n${repoList}\n\nAny unpushed commits will be lost.`,
            );
          }

          // Step 4: managed repos exclusively owned by this workspace
          let cleanupDen = false;
          if (preview.denManaged?.length > 0) {
            const repoList = preview.denManaged
              .map((r) => `  • ${r.address}`)
              .join("\n");
            cleanupDen = confirm(
              `Also delete ${preview.denManaged.length} managed repo${preview.denManaged.length > 1 ? "s" : ""} only used by this workspace?\n\n${repoList}\n\nNo other workspace references these clones.`,
            );
          }

          let deleted = true;
          try {
            await window.denShell.api("DELETE", "/api/workspaces", {
              name,
              cleanupDirectory,
              cleanupDev,
              cleanupDen,
            });
          } catch (err) {
            deleted = false;
            window.denShell.errorToast(err);
          }
          if (deleted) {
            if (activeWs === name) {
              activeWs = null;
              document.getElementById("content").innerHTML =
                '<div class="empty-state">Select a workspace</div>';
              // Remove the ?ws= param so a reload doesn't try to open the deleted workspace
              const params = new URLSearchParams(location.search);
              params.delete("ws");
              const qs = params.toString();
              history.replaceState(null, "", qs ? "?" + qs : location.pathname);
            }
            await loadWorkspaces();
          }
        };
