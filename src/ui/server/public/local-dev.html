          appendToTab(
            tabName,
            "\n─── validate __DEN_MANIFEST_YML__ ───",
            "cmd",
          );
          if (pathVal) appendToTab(tabName, "path: " + pathVal, "cmd");
          try {
            let res;
            if (textVal) {
              res = await fetch("/api/manifest/validate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ content: textVal }),
              });
            } else {
              res = await fetch(
                "/api/manifest/validate?path=" + encodeURIComponent(pathVal),
              );
            }
            appendValidateToTab(tabName, await res.json());
          } catch (err) {
            appendToTab(tabName, "Request failed: " + err.message, "err");
            setTabStatus(tabName, { live: false, errored: true });
          }
        };

        function appendValidateToTab(tabName, data) {
          const vnum = "v" + (data.version ?? 1);
          if (data.valid && !data.errors?.length && !data.warnings?.length) {
            appendToTab(tabName, "✓ Valid (" + vnum + ")", "done-ok");
          } else if (data.valid) {
            appendToTab(
              tabName,
              "✓ Valid (" +
                vnum +
                ") — " +
                data.warnings.length +
                " warning" +
                (data.warnings.length !== 1 ? "s" : ""),
              "done-ok",
            );
          } else {
            const n = data.errors?.length ?? 0;
            appendToTab(
              tabName,
              "✗ Invalid (" +
                vnum +
                ") — " +
                n +
                " error" +
                (n !== 1 ? "s" : ""),
              "done-fail",
            );
          }
          for (const e of data.errors ?? []) {
            appendToTab(
              tabName,
              "  ✗ " + (e.path || "(root)") + ": " + e.message,
              "err",
            );
            if (e.suggestion) appendToTab(tabName, "    → " + e.suggestion, "");
          }
          for (const w of data.warnings ?? []) {
            appendToTab(
              tabName,
              "  ⚠ " + (w.path || "(root)") + ": " + w.message,
              "warn",
            );
            if (w.suggestion) appendToTab(tabName, "    → " + w.suggestion, "");
          }
          setTabStatus(tabName, { live: false, errored: !data.valid });
        }

        // ── Service ordering (graph cards) ────────────────────────────────────────
        // Sort by service name (leaf): e.g. "api", "db", "worker" — ignores repo path.
        function _sortByName(services) {
          return [...services].sort((a, b) => {
            const na = a.service || a.address,
              nb = b.service || b.address;
            return na.localeCompare(nb);
          });
        }

        // Repo → rank from the canonical startup order (infra-stack=0 … entry repo
        // highest). Cards sort by descending rank (entry repo first), matching the
        // graph's top-to-bottom flow and `__DEN_CLI__ up` order.
        function deriveRepoRank(graph) {
          const rank = new Map();
          if (graph?.order?.length) {
            graph.order.forEach((r, i) => rank.set(r, i));
            return rank;
          }
          // Fallback (no order from server): longest path over derived edges.
          for (const n of graph?.nodes || []) rank.set(n, 0);
          let changed = true,
            iters = 0;
          while (changed && iters++ < 100) {
            changed = false;
            for (const e of graph?.edges || []) {
              const needed = (rank.get(e.from) ?? 0) + 1;
              if (needed > (rank.get(e.to) ?? 0)) {
                rank.set(e.to, needed);
                changed = true;
              }
            }
          }
          return rank;
        }

        let _graphServices = null,
          _graphDepsMap = null,
          _graphDerived = null,
          _graphApps = []; // /api/applications for the viewed workspace
        // The most recent __DEN_CLI__:health-update payload; null until the
        // first round, so the graph's cards say "checking…" (0.3.0-dev.40).
        let _lastHealthResults = null;
        let _lastHealthAt = null; // when it landed (the table's "failed at")

        // Orgs (GitHub owners) for the graph's org frames: id → {label, color},
        // and repo → org. Loaded once; the graph redraws when it lands.
        let _orgData = null;
        fetch("/api/orgs?repos=1")
          .then((r) => r.json())
          .then((d) => {
            _orgData = d && d.orgs ? d : null;
            if (
              _orgData &&
              _graphServices &&
              document.getElementById("dep-graph-wrap")
            )
              renderDepGraph(_graphServices, _graphDepsMap);
          })
          .catch(() => {});

        // ── Dependency graph ─────────────────────────────────────────────────────
        // ELK-laid-out cards and the details panel live in graph.js / panel.js
        // (registries: ACTIONS, TABS, SECTIONS). The page hands them the data it
        // already loads and its own action functions, so every action runs the
        // same calls as before (runCmd, up/down with deps, sync, editor, …).
        // ── R23 (Ward QA 2026-11-05): room for the graph ──────────────────
        // The workspace list collapses to a 40px strip, remembered per user
        // (/api/settings graph.workspaces; mirrored locally for the first
        // paint, the server's copy wins). Maximize, on the Graph page (the
        // graph's button, or F outside a field), gives the graph the whole
        // content area; Esc restores. The graph re-fits to the larger area.
        const LS_WS_LIST = "__DEN_CLI__-ws-list";
        const pageMain = document.querySelector(".page-main");
        function paintWsList(collapsed) {
          pageMain.classList.toggle("ws-collapsed", collapsed);
          const b = document.getElementById("ws-toggle");
          b.setAttribute("aria-expanded", String(!collapsed));
          const what = collapsed
            ? "Expand the workspace list"
            : "Collapse the workspace list";
          b.setAttribute("aria-label", what);
          b.title = what;
          b.textContent = collapsed ? "»" : "«";
        }
        function setWsList(collapsed) {
          paintWsList(collapsed);
          try {
            localStorage.setItem(LS_WS_LIST, collapsed ? "collapsed" : "open");
          } catch {}
          fetch("/api/settings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              graph: { workspaces: collapsed ? "collapsed" : "open" },
            }),
          }).catch(() => {});
        }
        try {
          paintWsList(localStorage.getItem(LS_WS_LIST) === "collapsed");
        } catch {}
        fetch("/api/settings")
          .then((r) => (r.ok ? r.json() : null))
          .then((d) => {
            const g = d?.graph?.groupBy;
            if (["none", "app", "org"].includes(g) && g !== _tblGroup) {
              _tblGroup = g;
              paintGroup();
              try {
                localStorage.setItem(LS_GROUP, g);
              } catch {}
            }
            const w = d?.graph?.workspaces;
            if (w !== "open" && w !== "collapsed") return;
            paintWsList(w === "collapsed");
            try {
              localStorage.setItem(LS_WS_LIST, w);
            } catch {}
          })
          .catch(() => {});
        document.getElementById("ws-toggle").addEventListener("click", () => {
          setWsList(!pageMain.classList.contains("ws-collapsed"));
        });

        function graphMax() {
          return pageMain.classList.contains("graph-max");
        }
        function setGraphMax(on) {
          pageMain.classList.toggle("graph-max", on);
          document.body.classList.toggle("den-graph-max", on);
          graphMaximized(on);
          if (!on) document.querySelector('[data-z="max"]')?.focus();
        }
        /** F: only with the graph showing and focus outside a field. */
        function graphShowing() {
          return !!document.querySelector("#graph-panel .dg");
        }
        function inField(el) {
          return !!el?.closest?.(
            'input, textarea, select, [contenteditable=""], [contenteditable="true"]',
          );
        }
        document.addEventListener("keydown", (e) => {
          if (e.metaKey || e.ctrlKey || e.altKey) return;
          if (e.key === "Escape" && graphMax() && !e.defaultPrevented) {
            setGraphMax(false);
            return;
          }
          if (
            (e.key === "f" || e.key === "F") &&
            !inField(e.target) &&
            !document.querySelector("dialog[open], .modal.open") &&
            graphShowing()
          ) {
            e.preventDefault();
            setGraphMax(!graphMax());
          }
        });

        const GRAPH_HOOKS = {
          maximize: {
            isOn: () => graphMax(),
            toggle: () => setGraphMax(!graphMax()),
          },
          env: () => healthEnv(),
          // With "All active" each acts in the workspace owning the repo.
          runCmd: (s, cmd) =>
            asOwner(s.repo, () => window.runCmd(s.id, s.repo, s.name, cmd)),
          upWithDeps: (repo) => asOwner(repo, () => window.runUpWithDeps(repo)),
          downWithDeps: (repo) =>
            asOwner(repo, () => window.runDownWithDeps(repo)),
          sync: (repo) => asOwner(repo, () => window.runRepoSync(repo)),
          toggleAutostart: (repo, turnOn) =>
            asOwner(repo, () => window.toggleAutostart(repo, turnOn)),
          switchMode: (repo, mode) =>
            asOwner(repo, () => window.switchMode(repo, mode)),
          openEditor: (p) => openInEditor(p),
          openTerminal: (p) => openInTerminal(p),
          showOutput: (s) => openSystemLogs(s.id, s.repo, s.name),
          openLogsPage: (s) => {
            storeOpenLog(s.repo, s.name, "local");
            window.location.href =
              "/logs?open=" + encodeURIComponent(s.repo + "/" + s.name);
          },
          addMissing: (dep) => {
            if (!activeWs) return;
            openAddSvcModal(activeWs);
            // Pre-fill the search with the missing dep so it is easy to find.
            setTimeout(() => {
              const input = document.getElementById("add-svc-global-search");
              if (input) {
                input.value = dep;
                input.dispatchEvent(new Event("input"));
              }
            }, 0);
          },
        };

        function renderDepGraph(services, depsMap, derivedGraph) {
          _graphServices = services;
          _graphDepsMap = depsMap;
          _graphDerived = derivedGraph ??
            _graphDerived ?? { nodes: [], edges: [] };
          const wrap = document.getElementById("dep-graph-wrap");
          if (!wrap) return;
          if (!services || services.length === 0) {
            wrap.innerHTML =
              '<div class="graph-empty">No services in workspace</div>';
            return;
          }
          mountGraph(
            wrap,
            {
              services,
              health: _lastHealthResults,
              graph: _graphDerived,
              apps: _graphApps,
              orgs: _orgData,
              depsMap,
              workspace: document.getElementById("content")?.dataset.ws || "",
            },
            GRAPH_HOOKS,
          );
        }

        // ── Auto-start toggle ─────────────────────────────────────────────────────
        // Repo-level: skipped by workspace-wide Up/Restart when off; Down still
        // stops it; explicit card/CLI targeting always wins.
        async function postAutostart(
          repo,
          autostart,
          wsName = document.getElementById("content")?.dataset.ws || activeWs,
        ) {
          try {
            await window.denShell.api(
              "POST",
              "/api/workspaces/services/autostart",
              { workspace: wsName, repo, autostart },
            );
          } catch (err) {
            if (!err.denApi) throw err;
            err.message = `auto-start toggle failed: ${err.message}`;
            window.denShell.errorToast(err);
            return;
          }
          await refreshView(wsName); // refetch services → re-render graph + tables
        }

        // Switch a system between dev-managed (your local checkout) and
        // managed (a __DEN_CLI__-tracked clone) — web equivalent of the CLI's
        // use-local / use-__DEN_CLI__. The server validates a local checkout exists.
        window.switchMode = async function (repo, mode) {
          const wsName =
            document.getElementById("content")?.dataset.ws || activeWs;
          try {
            await window.denShell.api("POST", "/api/workspaces/services/mode", {
              workspace: wsName,
              repo,
              mode,
            });
          } catch (err) {
            if (!err.denApi) throw err;
            err.message = `mode switch failed: ${err.message}`;
            window.denShell.errorToast(err);
            return;
          }
          await refreshView(wsName);
        };

        window.toggleAutostart = function (repo, turnOn) {
          // The workspace now: the confirm below answers later.
          const ws = document.getElementById("content")?.dataset.ws || activeWs;
          if (turnOn) {
            void postAutostart(repo, true, ws);
            return;
          }
          // Turning OFF: warn when other systems hard-depend on this one.
          const dependents = [
            ...new Set(
              (_graphDerived?.edges || [])
                .filter(
                  (e) =>
                    e.to === repo && e.blocking === "hard" && e.from !== repo,
                )
                .map((e) => e.from),
            ),
          ];
          if (dependents.length === 0) {
            void postAutostart(repo, false, ws);
            return;
          }

          const overlay = document.createElement("div");
          overlay.id = "autostart-confirm-overlay";
          overlay.style.cssText =
            "position:fixed;inset:0;background:rgba(0,0,0,0.55);z-index:1000;" +
            "display:flex;align-items:center;justify-content:center;";
          const box = document.createElement("div");
          box.style.cssText =
            "background:var(--surface);border:1px solid var(--border);border-radius:8px;" +
            "padding:18px 20px;max-width:420px;font-size:13px;color:var(--text);";
          box.innerHTML =
            `<div style="font-weight:600;margin-bottom:8px">Turn off auto-start for ${escHtml(repo)}?</div>` +
            `<div style="color:var(--muted);line-height:1.5">It is a hard dependency of: ` +
            `<strong style="color:var(--text)">${dependents.map(escHtml).join(", ")}</strong>. ` +
            `Their workspace Up may fail readiness while it's off.</div>` +
            `<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">` +
            `<button id="as-cancel" class="cmd-btn">Cancel</button>` +
            `<button id="as-confirm" class="cmd-btn" style="border-color:var(--warn);color:var(--warn)">Turn off</button>` +
            `</div>`;
          overlay.appendChild(box);
          document.body.appendChild(overlay);
          overlay.addEventListener("click", (e) => {
            if (e.target === overlay) overlay.remove();
          });
          box
            .querySelector("#as-cancel")
            .addEventListener("click", () => overlay.remove());
          box.querySelector("#as-confirm").addEventListener("click", () => {
            overlay.remove();
            void postAutostart(repo, false, ws);
          });
        };

        // Close popup on any outside click
        document.addEventListener("click", (e) => {
          // Close service action dropdowns unless the click was inside one
          if (!e.target.closest(".action-menu-wrap")) {
            document
              .querySelectorAll(".action-dropdown")
              .forEach((d) => (d.style.display = "none"));
          }
        });

        // Keep graph health dots in sync with the header's poll / manual refresh
        document.addEventListener("__DEN_CLI__:health-update", (e) => {
          _lastHealthResults = e.detail || [];
          _lastHealthAt = new Date();
          graphHealth(_lastHealthResults);
          renderTable();
        });

        async function openInEditor(repoPath) {
          try {
            await window.denShell.api("POST", "/api/editor/open", {
              path: repoPath,
            });
          } catch (e) {
            if (!e.denApi) throw e;
            const err = e.data && typeof e.data === "object" ? e.data : {};
            if (e.message.includes("No editor")) {
              location.href = "/settings#editor";
            } else if (err.runCmd) {
              alert(
                `Could not open Terminal.app automatically.\n\nRun this in your terminal:\n\n  ${err.runCmd}\n\n${e.message}`,
              );
            } else {
              window.denShell.errorToast(e);
            }
          }
        }

        async function openInTerminal(repoPath) {
          try {
            await window.denShell.api("POST", "/api/terminal/open", {
              path: repoPath,
            });
          } catch (e) {
            if (!e.denApi) throw e;
            const err = e.data && typeof e.data === "object" ? e.data : {};
            if (e.message.includes("No terminal")) {
              location.href = "/settings#editor";
            } else if (err.runCmd) {
              alert(
                `Could not open the terminal automatically.\n\nRun this in your terminal:\n\n  ${err.runCmd}\n\n${e.message}`,
              );
            } else {
              window.denShell.errorToast(e);
            }
          }
        }

        init();
      </script>

      <!-- ── Add Service modal ──────────────────────────────────────────────────── -->
      <div
        class="add-svc-backdrop"
        id="add-svc-backdrop"
        style="display: none"
        onclick="closeAddSvcModal(event)"
      >
        <div class="add-svc-modal">
          <div class="add-svc-header">
            <h3 id="add-svc-title">Add Service</h3>
            <button class="add-svc-close" onclick="closeAddSvcModal()">
              ×
            </button>
          </div>

          <!-- Global search — filters whichever tab is active -->
          <div class="add-svc-global-search">
            <input
              class="add-svc-search"
              id="add-svc-global-search"
              type="text"
              placeholder="Filter repos…"
              oninput="
                renderAddSvcLocalList();
                renderAddSvcGhList();
              "
              autocomplete="off"
            />
          </div>

          <div class="add-svc-tabs">
            <button
              class="add-svc-tab active"
              id="add-svc-tab-local"
              onclick="switchAddSvcTab('local')"
            >
              Local
              <span class="add-svc-tab-count" id="add-svc-local-count"></span>
            </button>
            <button
              class="add-svc-tab"
              id="add-svc-tab-gh"
              onclick="switchAddSvcTab('gh')"
            >
              GitHub
              <span class="add-svc-tab-count" id="add-svc-gh-count"></span>
            </button>
          </div>

          <!-- Local tab -->
          <div class="add-svc-body" id="add-svc-panel-local">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 6px;
                margin-bottom: 4px;
              "
            >
              <span style="font-size: 10px; color: var(--muted)">Sort by</span>
              <div class="svc-sort-btns">
                <button
                  class="svc-sort-btn add-svc-sort-btn active"
                  data-sort="name"
                  onclick="setAddSvcLocalSort('name')"
                >
                  Name
                </button>
                <button
                  class="svc-sort-btn add-svc-sort-btn"
                  data-sort="workspace"
                  onclick="setAddSvcLocalSort('workspace')"
                >
                  Workspace
                </button>
              </div>
            </div>
            <div id="add-svc-local-list">
              <div class="add-svc-empty">Loading…</div>
            </div>
          </div>

          <!-- GitHub tab -->
          <div class="add-svc-body" id="add-svc-panel-gh" style="display: none">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: flex-end;
                margin-bottom: 2px;
              "
            >
              <button
                class="add-svc-refresh-btn"
                title="Refresh GitHub repo list"
                onclick="_refreshAddSvcGhRepos()"
              >
                ↻ refresh
              </button>
            </div>
            <div id="add-svc-gh-list"></div>
          </div>

          <!-- Stable footer — always visible -->
          <div class="add-svc-footer-panel">
            <div
              class="add-svc-gh-config"
              id="add-svc-gh-config"
              style="display: none"
            >
              <div class="add-svc-config-name" id="add-svc-config-name"></div>
              <div class="add-svc-config-row">
                <label>Manage</label>
                <div class="add-svc-radio">
                  <label
                    ><input
                      type="radio"
                      name="add-svc-mode"
                      value="dev-managed"
                      checked
                    />
                    Dev-managed</label
                  >
                  <label
                    ><input type="radio" name="add-svc-mode" value="managed" />
                    Managed</label
                  >
                </div>
              </div>
              <div class="add-svc-config-row">
                <label>Branch</label>
                <input
                  class="add-svc-inp"
                  id="add-svc-branch"
                  list="add-svc-branch-list"
                  placeholder="main"
                  autocomplete="off"
                />
                <datalist id="add-svc-branch-list"></datalist>
                <label>New branch</label>
                <input
                  class="add-svc-inp"
                  id="add-svc-newbranch"
                  placeholder="optional"
                  autocomplete="off"
                />
              </div>
            </div>
            <div class="add-svc-footer">
              <span class="add-svc-msg" id="add-svc-msg"></span>
              <button
                class="add-svc-submit"
                id="add-svc-submit"
                disabled
                onclick="submitAddSvc()"
              >
                Add
              </button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
