<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <title>__DEN_TITLE__ · Workspaces</title>
    <link rel="stylesheet" href="/graph.css" />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        font-size: 13px;
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* ── Header ───────────────────────────────────────────────────────────── */
      .h-spacer {
        flex: 1;
      }

      /* ── Health dots ──────────────────────────────────────────────────────── */
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
        flex-shrink: 0;
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.err {
        background: var(--bad);
      }
      .dot.running {
        background: var(--warn);
        animation: pulse 1s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.35;
        }
      }
      /* ── Layout ───────────────────────────────────────────────────────────── */
      .page-main {
        flex: 1;
        display: grid;
        grid-template-columns: 260px 1fr;
        overflow: hidden;
        min-height: 0;
      }

      /* R23 (Ward QA 2026-11-05): the workspace list collapses to a 40px
         strip (remembered: graph.workspaces). On the Graph page, Maximize
         (F; Esc restores) gives the graph the whole content area. */
      .page-main.ws-collapsed {
        grid-template-columns: 40px minmax(0, 1fr);
      }
      .ws-collapsed .sidebar > :not(.sidebar-header),
      .ws-collapsed .sidebar-title {
        display: none;
      }
      .ws-collapsed .sidebar-header {
        justify-content: center;
        padding: 10px 0;
      }
      .ws-toggle {
        background: transparent;
        border: 1px solid transparent;
        border-radius: 5px;
        color: var(--muted);
        cursor: pointer;
        font-size: 13px;
        line-height: 1;
        padding: 3px 6px;
      }
      .ws-toggle:hover {
        color: var(--text);
        border-color: var(--border);
      }
      .page-main.graph-max .content-body {
        padding: 8px;
      }
      /* Maximized, the page header goes too (R20 is the shell's). */
      body.den-graph-max #den-content > .den-ph {
        display: none;
      }

      /* The Graph page (R22, Ward 2026-11-05): the graph alone, full width,
         below the page header, from first paint. Workspaces keeps the
         workspace list, the workspace's header and actions, and its repo
         table (R24); the Graph page draws none of them. */
      body.den-page-graph .page-main,
      body.den-page-graph .page-main.ws-collapsed {
        grid-template-columns: minmax(0, 1fr);
      }
      body.den-page-graph .page-main > .sidebar {
        display: none;
      }
      body.den-page-graph .content-body {
        padding: 0 24px 16px;
      }

      /* A phone gets the workspace content only (the header's workspace pill
         still switches workspaces), so the graph has the width it needs. */
      @media (max-width: 760px) {
        .page-main {
          grid-template-columns: minmax(0, 1fr);
        }
        .page-main > .sidebar {
          display: none;
        }
        .content-body {
          padding: 10px 8px;
        }
        /* The page scrolls instead of squeezing the graph to a strip. */
        .graph-panel {
          overflow: visible;
          flex: none;
        }
        .graph-panel #dep-graph-wrap {
          flex: none;
          height: 70vh;
        }
      }

      /* ── Sidebar ──────────────────────────────────────────────────────────── */
      .sidebar {
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .sidebar-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .sidebar-title {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
      }
      .ws-list {
        flex: 1;
        overflow-y: auto;
        padding: 6px 0;
      }
      .ws-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 7px 14px;
        cursor: pointer;
        user-select: none;
        font-size: 12px;
        font-family: var(--mono);
        border-left: 3px solid transparent;
      }
      .ws-item:hover {
        background: var(--surface);
      }
      /* A calm, neutral ground in both modes under any theme: the accent
         is the edge, not the fill. */
      .ws-item.active {
        border-left-color: var(--accent);
        color: var(--text);
        font-weight: 600;
        background: color-mix(in srgb, var(--accent) 4%, var(--surface));
      }
      /* The CLI default (focus): a word, never a bare glyph. */
      .ws-cli-default {
        font-size: 10px;
        color: var(--accent-text);
        margin-left: 4px;
        cursor: help;
      }
      .ws-item-right {
        display: flex;
        align-items: center;
        gap: 2px;
        flex-shrink: 0;
      }
      .ws-open-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
        padding: 1px 5px;
        border-radius: 3px;
        line-height: 1;
      }
      .ws-open-btn:hover {
        color: var(--accent-text);
        background: color-mix(in srgb, var(--accent) 13%, transparent);
      }
      .ws-term-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 11px;
        font-family: var(--mono);
        cursor: pointer;
        padding: 1px 5px;
        border-radius: 3px;
        line-height: 1;
      }
      .ws-term-btn:hover {
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 13%, transparent);
      }
      .ws-menu-wrap {
        position: relative;
      }
      .ws-menu-btn {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 15px;
        cursor: pointer;
        padding: 1px 4px;
        border-radius: 3px;
        line-height: 1;
        opacity: 0;
      }
      .ws-item:hover .ws-menu-btn {
        opacity: 1;
      }
      .ws-menu-btn:hover {
        color: var(--text);
        background: var(--surface);
      }
      .ws-menu-dropdown {
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 2px;
        z-index: 300;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        min-width: 100px;
        box-shadow: var(--shadow);
        padding: 4px 0;
        display: none;
      }
      .ws-menu-dropdown.open {
        display: block;
      }
      .ws-menu-dropdown button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text);
        font-size: 12px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .ws-menu-dropdown button:hover {
        background: var(--bg);
      }
      .ws-menu-dropdown button.danger:hover {
        color: var(--bad);
      }
      .new-ws-form {
        padding: 8px 14px;
        border-top: 1px solid var(--border);
        flex-shrink: 0;
        display: flex;
        gap: 6px;
      }
      .new-ws-form input {
        flex: 1;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 4px 8px;
        border-radius: 5px;
        font-size: 12px;
        font-family: var(--mono);
        outline: none;
      }
      .new-ws-form input:focus {
        border-color: var(--accent);
      }
      .new-ws-form button {
        background: var(--accent-fill);
        border: none;
        color: var(--on-accent);
        padding: 4px 10px;
        border-radius: 5px;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
      }
      .new-ws-form button:hover {
        opacity: 0.85;
      }
      /* ── Content ──────────────────────────────────────────────────────────── */
      .content {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .content-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 18px;
        border-bottom: 1px solid var(--border);
        flex-shrink: 0;
      }
      .content-header h2 {
        font-family: var(--mono);
        font-size: 14px;
        font-weight: 600;
      }
      .switch-btn {
        font-size: 11px;
        padding: 2px 8px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--muted);
        background: none;
        cursor: pointer;
      }
      .switch-btn:hover {
        border-color: var(--accent);
        color: var(--accent-text);
      }

      /* ── Master command bar ───────────────────────────────────────────────── */
      .cmd-bar {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 9px 18px;
        border-bottom: 1px solid var(--border);
        background: var(--bg);
        flex-shrink: 0;
      }
      .cmd-bar-label {
        font-size: 11px;
        color: var(--muted);
        margin-right: 4px;
      }
      .master-btn {
        padding: 5px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        border: 1px solid var(--border);
        background: var(--surface);
        color: var(--text);
        transition:
          border-color 0.1s,
          color 0.1s,
          background 0.1s;
      }
      .master-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent-text);
        background: color-mix(in srgb, var(--accent) 5%, transparent);
      }
      .master-btn.up:hover:not(:disabled) {
        border-color: var(--ok);
        color: var(--ok);
        background: color-mix(in srgb, var(--ok) 5%, transparent);
      }
      .master-btn.down:hover:not(:disabled) {
        border-color: var(--bad);
        color: var(--bad);
        background: color-mix(in srgb, var(--bad) 5%, transparent);
      }
      .master-btn.restart:hover:not(:disabled) {
        border-color: var(--warn);
        color: var(--warn);
        background: color-mix(in srgb, var(--warn) 5%, transparent);
      }
      .master-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      .cmd-bar-spacer {
        flex: 1;
      }
      .cmd-bar-status {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
      }

      /* scrollable middle */
      .content-body {
        flex: 1;
        overflow-y: auto;
        min-height: 0;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      /* ── Section labels ───────────────────────────────────────────────────── */
      .section-label {
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin-bottom: 8px;
      }

      /* ── Badges ───────────────────────────────────────────────────────── */
      .badge {
        display: inline-block;
        font-size: 10px;
        padding: 1px 7px;
        border-radius: 10px;
        border: 1px solid var(--border);
        color: var(--muted);
      }
      .badge.dev-managed {
        border-color: color-mix(in srgb, var(--accent) 27%, transparent);
        color: var(--accent-text);
      }
      .badge.managed {
        border-color: var(--border-strong);
        color: var(--text);
      }
      .badge.active-ws {
        border-color: color-mix(in srgb, var(--ok) 27%, transparent);
        color: var(--ok);
      }
      .badge.uncloned {
        border-color: var(--warn);
        color: var(--warn);
      }

      /* command buttons */
      .cmd-row {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .cmd-btn {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 3px 9px;
        border-radius: 5px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        white-space: nowrap;
        transition:
          border-color 0.1s,
          color 0.1s;
      }
      .cmd-btn:hover:not(:disabled) {
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .cmd-btn.danger:hover:not(:disabled) {
        border-color: var(--bad);
        color: var(--bad);
      }
      .cmd-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      /* ── Add service (trigger button + dep rows) ─────────────────────────── */
      .form-sel,
      .form-inp {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 12px;
        outline: none;
      }
      .form-sel:focus,
      .form-inp:focus {
        border-color: var(--accent);
      }
      .form-inp {
        font-family: var(--mono);
      }
      .add-btn {
        background: var(--accent-fill);
        border: none;
        color: var(--on-accent);
        padding: 5px 14px;
        border-radius: 5px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      .add-btn:hover {
        opacity: 0.85;
      }
      .form-msg {
        font-size: 11px;
      }
      .form-msg.ok {
        color: var(--ok);
      }
      .form-msg.err {
        color: var(--bad);
      }
      .form-msg.warn {
        color: var(--warn);
      }
      .add-svc-open-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--text);
        padding: 6px 14px;
        border-radius: 6px;
        font-size: 12px;
        cursor: pointer;
      }
      .add-svc-open-btn:hover {
        border-color: var(--accent);
        color: var(--accent-text);
      }
      /* ── Add Service modal ────────────────────────────────────────────────── */
      .add-svc-backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 1000;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .add-svc-modal {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        width: 560px;
        max-width: 96vw;
        max-height: 80vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .add-svc-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 16px 0;
        flex-shrink: 0;
      }
      .add-svc-header h3 {
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      .add-svc-close {
        background: none;
        border: none;
        color: var(--muted);
        font-size: 20px;
        cursor: pointer;
        padding: 0 2px;
        line-height: 1;
      }
      .add-svc-close:hover {
        color: var(--text);
      }
      .add-svc-tabs {
        display: flex;
        gap: 0;
        padding: 10px 16px 0;
        flex-shrink: 0;
        border-bottom: 1px solid var(--border);
      }
      .add-svc-tab {
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        font-size: 13px;
        padding: 6px 14px 8px;
        cursor: pointer;
        margin-bottom: -1px;
      }
      .add-svc-tab.active {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .add-svc-tab:hover:not(.active) {
        color: var(--text);
      }
      .add-svc-tab-count {
        font-size: 11px;
        color: var(--muted);
        margin-left: 4px;
      }
      .add-svc-global-search {
        padding: 10px 16px 0;
        flex-shrink: 0;
      }
      .add-svc-body {
        flex: 1;
        overflow-y: auto;
        padding: 6px 16px 10px;
        min-height: 0;
      }
      .add-svc-section-label {
        font-size: 10px;
        font-weight: 700;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 8px 0 2px;
      }
      .add-svc-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 8px;
        border-radius: 6px;
      }
      .add-svc-row.selectable {
        cursor: pointer;
      }
      .add-svc-row.selectable:hover {
        background: color-mix(in srgb, var(--text) 5%, transparent);
      }
      .add-svc-row.selected {
        background: color-mix(in srgb, var(--accent) 9%, transparent);
      }
      .add-svc-row.already {
        opacity: 0.4;
      }
      .add-svc-row-info {
        flex: 1;
        min-width: 0;
      }
      .add-svc-name {
        font-size: 13px;
        font-weight: 500;
      }
      .add-svc-row-path {
        font-size: 11px;
        color: var(--muted);
        font-family: var(--mono);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-top: 2px;
      }
      .add-svc-ws-badge {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: 500;
        white-space: nowrap;
        flex-shrink: 0;
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        color: var(--accent-text);
        border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .add-svc-pill {
        font-size: 10px;
        padding: 2px 6px;
        border-radius: 3px;
        font-weight: 600;
        letter-spacing: 0.03em;
        white-space: nowrap;
      }
      .add-svc-pill.supported {
        background: color-mix(in srgb, var(--ok) 13%, transparent);
        color: var(--ok);
        border: 1px solid color-mix(in srgb, var(--ok) 27%, transparent);
      }
      .add-svc-pill.no-manifest {
        background: color-mix(in srgb, var(--muted) 8%, transparent);
        color: var(--muted);
        border: 1px solid var(--border);
      }
      .add-svc-pill.added {
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        color: var(--accent-text);
        border: 1px solid color-mix(in srgb, var(--accent) 20%, transparent);
      }
      .add-svc-row-btn {
        background: none;
        border: 1px solid var(--border);
        color: var(--text);
        font-size: 11px;
        padding: 3px 10px;
        border-radius: 4px;
        cursor: pointer;
        white-space: nowrap;
      }
      .add-svc-row-btn:hover {
        border-color: var(--accent);
        color: var(--accent-text);
      }
      .add-svc-search {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 7px 10px;
        border-radius: 6px;
        font-size: 13px;
        outline: none;
        margin-bottom: 2px;
      }
      .add-svc-search:focus {
        border-color: var(--accent);
      }
      .add-svc-footer-panel {
        border-top: 1px solid var(--border);
        padding: 12px 16px 14px;
        flex-shrink: 0;
      }
      .add-svc-gh-config {
        margin-bottom: 10px;
      }
      .add-svc-config-name {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      .add-svc-config-row {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 8px;
      }
      .add-svc-config-row > label {
        font-size: 11px;
        color: var(--muted);
        white-space: nowrap;
      }
      .add-svc-radio {
        display: flex;
        gap: 14px;
      }
      .add-svc-radio label {
        display: flex;
        align-items: center;
        gap: 4px;
        font-size: 12px;
        color: var(--text);
        cursor: pointer;
      }
      .add-svc-inp {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        padding: 5px 9px;
        border-radius: 5px;
        font-size: 12px;
        outline: none;
        font-family: var(--mono);
        width: 120px;
      }
      .add-svc-inp:focus {
        border-color: var(--accent);
      }
      .add-svc-footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 10px;
      }
      .add-svc-submit {
        background: var(--accent-fill);
        border: none;
        color: var(--on-accent);
        padding: 6px 20px;
        border-radius: 5px;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
      }
      .add-svc-submit:hover {
        opacity: 0.85;
      }
      .add-svc-submit:disabled {
        opacity: 0.45;
        cursor: default;
      }
      .add-svc-msg {
        font-size: 11px;
      }
      .add-svc-msg.ok {
        color: var(--ok);
      }
      .add-svc-msg.err {
        color: var(--bad);
      }
      .add-svc-msg.warn {
        color: var(--warn);
      }
      .add-svc-empty {
        font-size: 12px;
        color: var(--muted);
        padding: 20px 0;
        text-align: center;
      }
      .ws-empty-state {

      }

      .add-svc-refresh-btn {

      .add-svc-refresh-btn:hover {

      .svc-sort-btns {

      .svc-sort-btn:hover {
        color: var(--text);
        background: var(--border);
      }
      .svc-sort-btn.active {
        background: var(--border);
        color: var(--text);
      }
      .dep-warn {
        display: inline;
        font-size: 11px;
        color: var(--warn);
        margin-left: 6px;
      }
      .dep-missing-row td {
        background: color-mix(in srgb, var(--warn) 20%, transparent);
        border-top: none;
        padding-top: 2px;
        padding-bottom: 6px;
      }
      .dep-missing-row .dep-label {
        font-size: 11px;
        color: var(--warn);
        padding-left: 20px;
      }
      .dep-missing-row .dep-label strong {
        color: var(--text);
      }
      /* ── Service action menu ──────────────────────────────────────────────── */
      .action-menu-wrap {
        position: relative;
        display: inline-block;
      }
      .action-dropdown {
        position: absolute;
        right: 0;
        top: 100%;
        margin-top: 3px;
        z-index: 200;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 6px;
        min-width: 110px;
        box-shadow: var(--shadow);
        padding: 4px 0;
      }
      .action-dropdown button {
        display: block;
        width: 100%;
        text-align: left;
        background: none;
        border: none;
        color: var(--text);
        font-size: 12px;
        padding: 5px 12px;
        cursor: pointer;
      }
      .action-dropdown button:hover {
        background: var(--bg);
      }
      .action-dropdown button.danger:hover {
        color: var(--bad);
      }

      /* ── Manifest validation ──────────────────────────────────────────────── */
      .validate-form {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 14px 16px;
      }
      .validate-form textarea {
        width: 100%;
        box-sizing: border-box;
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--text);
        border-radius: 5px;
        padding: 8px 10px;
        font-family: var(--mono);
        font-size: 11px;
        resize: vertical;
        outline: none;
        min-height: 90px;
      }
      .validate-form textarea:focus {
        border-color: var(--accent);
      }
      .validate-result {
        margin-top: 10px;
        font-size: 11px;
        line-height: 1.6;
      }
      .validate-result .v-ok {
        color: var(--ok);
      }
      .validate-result .v-err {
        color: var(--bad);
      }
      .validate-result .v-warn {
        color: var(--warn);
      }
      .validate-result .v-path {
        color: var(--muted);
        font-family: var(--mono);
      }
      .validate-result .v-hint {
        color: var(--muted);
        padding-left: 16px;
        display: block;
      }
      .validate-inline {
        font-size: 10px;
        margin-left: 6px;
        vertical-align: middle;
      }
      .validate-inline.ok {
        color: var(--ok);
      }
      .validate-inline.err {
        color: var(--bad);
      }
      .validate-inline.warn {
        color: var(--warn);
      }
      .validate-inline.checking {
        color: var(--muted);
      }

      /* ── The Graph page's graph ───────────────────────────────────────── */
      .graph-panel {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }

      /* ── Graph view ───────────────────────────────────────────────────────── */
      #dep-graph-wrap {
        overflow: hidden;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        flex: 1;
        min-height: 0;
        position: relative;
      }

      .graph-empty {
        padding: 40px;
        text-align: center;
        color: var(--muted);
        font-size: 12px;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        white-space: nowrap;
      }
      .graph-loading {
        animation: graph-pulse 1.4s ease-in-out infinite;
      }
      @keyframes graph-pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      /* ── Workspaces: the selected workspace's header (R24c) ───────────── */
      .ws-head-link {
        font-size: 12px;
        color: var(--accent-text);
        text-decoration: underline;
        text-underline-offset: 0.2em;
        text-decoration-color: color-mix(
          in srgb,
          currentColor 40%,
          transparent
        );
        white-space: nowrap;
      }
      .ws-head-link:hover {
        text-decoration-color: currentColor;
      }
      .ws-more {
        position: relative;
      }
      .ws-more > .action-dropdown {
        min-width: 180px;
      }
      .ws-more .action-dropdown a {
        display: block;
        color: var(--text);
        font-size: 12px;
        padding: 5px 12px;
        text-decoration: none;
      }
      .ws-more .action-dropdown a:hover {
        background: var(--bg);
      }

      /* ── Workspaces: the repo table (R24d) ─────────────────────────────
         The prototype's Services table (table.svc, .tablewrap): 11px mono
         uppercase heads, 7px/12px cells, a sunken group row. */
      .tbl-tools {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .tbl-tools label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .tbl-find {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: var(--radius-button);
        padding: 6px 10px;
        width: 220px;
        min-width: 0;
        color: var(--text);
        font: inherit;
      }
      .tbl-seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: var(--radius-button);
        overflow: hidden;
      }
      .tbl-seg button {
        background: none;
        border: 0;
        padding: 5px 10px;
        cursor: pointer;
        color: var(--muted);
        font: inherit;
        font-size: 12px;
      }
      .tbl-seg button[aria-pressed="true"] {
        background: color-mix(in srgb, var(--accent) 16%, transparent);
        color: var(--text);
        font-weight: 500;
      }
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      table.svc {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      table.svc caption {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      table.svc thead th {
        text-align: left;
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 400;
      }
      table.svc td,
      table.svc tbody th {
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        font-weight: 400;
        vertical-align: middle;
      }
      table.svc tbody:last-child tr:last-child > * {
        border-bottom: 0;
      }
      table.svc tr.g > th {
        background: var(--sunken);
        font-weight: 600;
        font-size: 12.5px;
      }
      table.svc tr.g .g-meta {
        font-weight: 400;
        color: var(--muted);
        margin-left: 8px;
      }
      table.svc tr.g .g-acts {
        float: right;
        display: inline-flex;
        gap: 6px;
      }
      table.svc .repo-name {
        font-family: var(--mono);
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text);
      }
      table.svc tr.sub > th {
        padding-left: 40px;
      }
      table.svc tr.sub .repo-name {
        font-weight: 400;
      }
      table.svc tr.sub[hidden] {
        display: none;
      }
      table.svc tr.fix > td {
        background: color-mix(in srgb, var(--bad) 8%, transparent);
        padding-left: 40px;
      }
      table.svc tr.fix .fix-t {
        color: var(--bad);
        margin-right: 10px;
      }
      table.svc tr.prob > th {
        box-shadow: inset 3px 0 0 var(--bad);
      }
      .tbl-exp {
        background: none;
        border: 1px solid transparent;
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        width: 20px;
        padding: 0;
        margin-right: 4px;
        font-size: 11px;
      }
      .tbl-exp:hover {
        color: var(--text);
        border-color: var(--border);
      }
      .tbl-exp-sp {
        display: inline-block;
        width: 24px;
      }
      .tbl-health {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
        color: var(--muted);
      }
      /* A long check line truncates (its title has it whole). */
      .tbl-ht {
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 170px;
      }
      .tbl-health.bad {
        color: var(--bad);
      }
      .tbl-health.ok {
        color: var(--ok);
      }
      .tbl-muted {
        color: var(--muted);
        font-size: 12.5px;
        white-space: nowrap;
      }
      .tbl-mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .tbl-mode {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      .tbl-switch {
        background: none;
        border: 0;
        padding: 0;
        cursor: pointer;
        color: var(--accent-text);
        font: inherit;
        font-size: 12px;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }
      .tbl-acts {
        display: flex;
        gap: 4px;
        justify-content: flex-end;
        white-space: nowrap;
      }
      /* The ⋯ and, on a sub-row (no ⋯ of its own), a spacer as wide: the
         Start/Stop/Restart/Logs columns line up across repo and sub-rows. */
      .tbl-acts .tbl-more,
      .tbl-acts .tbl-more-sp {
        flex: none;
        width: 30px;
        padding-left: 0;
        padding-right: 0;
        text-align: center;
      }
      .tbl-acts .tbl-more-sp {
        display: inline-block;
      }
      .tbl-btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .tbl-none td {
        color: var(--muted);
        text-align: center;
        padding: 18px;
      }
      .tbl-foot {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      /* ── Workspaces: the Agents section (AG-4a, §5c) ─────────────────────
         The repo table's look (table.svc, .tbl-*) under the shell's section
         heading (.den-sec); the start form sits in the table's foot. */
      .agents .tbl-foot {
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .agents .ag-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .agents .ag-head a {
        font-size: 12.5px;
      }
      .agent-form {
        display: flex;
        align-items: center;
        gap: 10px;
        flex-wrap: wrap;
      }
      .agent-form[hidden] {
        display: none;
      }
      .agent-form label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        font-size: 12px;
      }
      .agent-form select {
        max-width: 320px;
        min-width: 0;
      }
      .agent-form-help {
        flex-basis: 100%;
        margin: 0;
        font-size: 12px;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .agent-form-help[hidden],
      .agent-form-ready[hidden] {
        display: none;
      }
      /* AG-0.2: the runtime it will run, or why it can't (the mock's .helpl). */
      .agent-form-ready {
        flex-basis: 100%;
        order: 1;
        margin: 0;
        font-size: 12px;
        line-height: 1.4;
        color: var(--faint);
        overflow-wrap: anywhere;
      }
      .agent-form-ready[data-tone="warn"] {
        color: var(--warn);
      }
      .agent-form-ready .mono {
        font-family: var(--mono);
      }
      .agent-cwd {
        max-width: 280px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ws-empty-state + .ws-agents-only {
        flex: none;
      }
      .validate-details > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 10px;
      }

      /* ── Empty state ──────────────────────────────────────────────────────── */
      .empty-state {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--muted);
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="local-dev" data-health-env="local"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div class="page-main">
        <!-- Sidebar: workspace list -->
        <aside class="sidebar">
          <div class="sidebar-header">
            <span class="sidebar-title" id="ws-title">Workspaces</span>
            <button
              type="button"
              class="ws-toggle"
              id="ws-toggle"
              aria-controls="ws-list"
              aria-expanded="true"
              aria-label="Collapse the workspace list"
              title="Collapse the workspace list"
            >
              «
            </button>
          </div>
          <div class="ws-list" id="ws-list">
            <div style="padding: 14px; color: var(--muted); font-size: 12px">
              Loading…
            </div>
          </div>
          <form class="new-ws-form" onsubmit="createWorkspace(event)">
            <input
              id="new-ws-name"
              placeholder="new-workspace"
              autocomplete="off"
            />
            <button type="submit">+</button>
          </form>
        </aside>

        <!-- Content pane -->
        <div class="content" id="content">
          <div class="empty-state">Select a workspace</div>
        </div>
      </div>

      <!-- Output: the shell's runs dock (R16), one tab per system; it lives
           outside renderContent, so it persists across workspace switches. -->

      <script type="module">
        import {
          initHealth,
          refreshHealth,
          initWorkspacePill,
          healthEnv,
          refreshWorkspacePill,
          applyDenConfig,
          initLogBadge,
          storeOpenLog,
          initChangelog,
          copyToClipboard,
          computePrimaryByRepo,
          setServiceRunner,
          sudoRun,
          takePendingAction,
          problemCards,
          problemFix,
          buildRow,
        } from "/header.js";
        import { checkLine } from "/topbar.js";
        import { agentsSectionHtml, mountAgents } from "/agents-section.js";
        import { mountGraph, graphHealth, graphMaximized } from "/graph.js";
        import {
          mergeWorkspaceViews,
          ownerOfRepos,
          buildModel,
          repoRollup,
          entryOf,
          status,
          healthLine,
          repoStatus,
          repoStatusWord,
          findHit,
        } from "/graph-model.js";

        // Re-ping all health dots (top nav + cards) NOW — used after lifecycle
        // commands so status doesn't wait out the 30s poll interval.
        function syncHealthNow() {
          const env = healthEnv();
          void refreshHealth(env);
        }

        let activeWs = null;
        /** The Graph page showing every workspace in view, or null. */
        let GRAPH_ALL = null;
        /**
         * The Graph page (R22): this page at /graph (the server swaps the
         * shell's page id; shell.js marks the body den-page-graph, so the
         * CSS has the graph alone from first paint).
         */
        const GRAPH_PAGE = document.body.classList.contains("den-page-graph");
        let wsData = null;

        // ── Add Service modal state ───────────────────────────────────────────────
        let _addSvcWsName = null;
        let _addSvcLocalRepos = [];
        let _addSvcManagedRepos = [];
        let _addSvcWsServices = {};
        let _addSvcGhRepos = null; // null = not yet loaded
        let _addSvcSelectedGh = null;
        let _addSvcSelectedLocal = null;
        let _addSvcLocalSort = "name"; // 'name' | 'workspace'

        const escHtml = (s) =>
          String(s)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        /** A shell string, with the English when the shell isn't up yet. */
        const wsT = (key, fallback) => {
          const v = window.denShell?.t?.(key);
          return v && v !== key ? v : fallback;
        };

        // ── The admin password (R8, LK-0) ─────────────────────────────────────────
        // It is for sudo, and nothing else: no action here asks for it up
        // front. A run whose command is about to run sudo without it gets a
        // needs-sudo event from the server (sudoRun().see); the shell's
        // prompt then says what needs it, and after the password the action
        // runs again (sudoRun().done).

        // ── Bootstrap ─────────────────────────────────────────────────────────────
        // Systems with auto-start toggled OFF in the viewed workspace (`autostart:
        // false` on the workspace entry) — skipped by workspace-wide Up/Restart,
        // still stopped by Down. Populated from /api/services in renderContent so
        // it always matches the rendered workspace; toggled via the card ⋮ menu.
        let _noAutostartRepos = new Set();

        async function init() {
          await Promise.all([
            loadWorkspaces(),
            initHealth(),
            initWorkspacePill(),
            loadRunningDaemons(),
            applyDenConfig(),
            initChangelog(),
          ]);
          initLogBadge();
          // Start and Restart from the status drawer and the ⌘K palette run
          // here, with this page's output (R15, R17).
          setServiceRunner((cmd, s) =>
            window.runCmd(s.address, s.repo, s.service, cmd),
          );
          // One handed over by another page (this tab, under a minute old).
          const pending = takePendingAction();
          if (pending) {
            const [repo, ...rest] = pending.address.split("/");
            window.runCmd(pending.address, repo, rest.join("/"), pending.cmd);
          }
          // (/local-dev?settings=1, the old settings link, is redirected to
          // /settings#editor by the server.)
        }

        // ── Workspace list ────────────────────────────────────────────────────────
        async function loadWorkspaces() {
          wsData = await fetch("/api/workspaces")
            .then((r) => r.json())
            .catch(() => null);
          if (!wsData) return;

          const names = Object.keys(wsData.workspaces ?? {});
          document.getElementById("ws-list").innerHTML = names
            .map((n) => {
              const dirPath = wsData.resolvedDirs?.[n] ?? "";
              const menuId = `ws-menu-${n.replace(/[^a-z0-9]/gi, "-")}`;
              const deleteItem =
                n !== "default"
                  ? `<button class="danger" data-action="delete">Delete</button>`
                  : "";
              return `<div class="ws-item ${n === activeWs ? "active" : ""}" data-name="${escHtml(n)}" data-action="select">
          <span>${escHtml(n)}${isWsActive(n) ? ' <span style="font-size:10px;color:var(--muted)">(active)</span>' : ""}${n === focusName() ? ` <span class="ws-cli-default" title="${escHtml(wsT("ws.focusTip", "CLI commands run here when you don't name a workspace. Picking a workspace in the top bar only changes what pages show."))}">${escHtml(wsT("ws.focus", "CLI default"))}</span>` : ""}</span>
          <span class="ws-item-right">
            <button class="ws-term-btn" title="Open in terminal" data-open-term="${escHtml(dirPath)}">&#62;_</button>
            <button class="ws-open-btn" title="Open in editor" data-open-path="${escHtml(wsData.codeWorkspacePaths?.[n] || dirPath)}">↗</button>
            <div class="ws-menu-wrap">
              <button class="ws-menu-btn" title="More actions" data-menu-id="${escHtml(menuId)}">⋮</button>
              <div class="ws-menu-dropdown" id="${escHtml(menuId)}">
                ${
                  isWsActive(n)
                    ? `<button data-action="deactivate">Deactivate</button>`
                    : `<button data-action="activate">Activate</button>`
                }
                <button data-action="rename">Rename</button>
                ${deleteItem}
              </div>
            </div>
          </span>
        </div>`;
            })
            .join("");

          // On first load, prefer URL ?ws= param, then the view scope when it
          // is one workspace (the top bar's View), then focus. This page edits
          // one workspace at a time; the logs and health cover the whole view.
          if (!activeWs && !GRAPH_ALL) {
            const urlWs = new URLSearchParams(location.search).get("ws");
            const view = await fetch("/api/scope")
              .then((r) => (r.ok ? r.json() : null))
              .catch(() => null);
            const scoped =
              view && view.scope !== "all" && wsData.workspaces?.[view.scope]
                ? view.scope
                : null;
            const named = urlWs && wsData.workspaces?.[urlWs] ? urlWs : null;
            // The Graph page follows the top bar's View (0.3.0-dev.33):
            // "All active" draws every workspace in view, one picked draws
            // that one, and ?ws= still wins. Workspaces keeps one workspace,
            // the list's selection: its actions and table are per workspace.
            const inView = Array.isArray(view?.inView) ? view.inView : [];
            if (
              GRAPH_PAGE &&
              !named &&
              view?.scope === "all" &&
              inView.length > 1
            ) {
              await renderGraphAll(inView, view.focus ?? focusName());
              return;
            }
            const target =
              named ??
              scoped ??
              (GRAPH_PAGE && inView.length === 1 ? inView[0] : focusName());
            if (target) selectWorkspace(target);
          }
        }

        /**
         * The Graph page with "All active" (0.3.0-dev.33): every workspace
         * in view in one graph, as the Services page lists them (one
         * /api/services list for the view; a service several define is
         * one card, its owners named). The page header's line names what
         * is shown: org / All active / local. A card's actions run in the
         * workspace that owns its repo (the first in view, focus first).
         */
        async function renderGraphAll(names, focus) {
          const content = document.getElementById("content");
          window.denShell?.pageHeader?.()?.setScope({ env: "local" });
          const enc = encodeURIComponent;
          const each = (u, empty) =>
            Promise.all(
              names.map((n) =>
                fetch(u + enc(n))
                  .then((r) => (r.ok ? r.json() : empty))
                  .catch(() => empty),
              ),
            );
          const [services, graphs, trees, deps] = await Promise.all([
            fetch("/api/services?env=local")
              .then((r) => (r.ok ? r.json() : []))
              .catch(() => []),
            each("/api/graph?workspace=", { nodes: [], edges: [] }),
            each("/api/applications?workspace=", { applications: [] }),
            each("/api/workspaces/deps-check?workspace=", []),
          ]);
          const merged = mergeWorkspaceViews({
            graphs,
            apps: trees.map((t) => t?.applications || []),
            deps,
          });
          GRAPH_ALL = {
            names,
            focus,
            ownerOf: ownerOfRepos(services),
          };
          _graphApps = merged.apps;
          const svcList = _sortByName(services);
          _noAutostartRepos = new Set(
            svcList.filter((s) => s.autostart === false).map((s) => s.repo),
          );
          setPrimaryRouting(svcList);
          content.dataset.ws = focus || names[0];
          content.dataset.all = names.join(",");
          content.innerHTML = `
        <div class="content-body">
          <div class="graph-panel" id="graph-panel">
            <div id="dep-graph-wrap"><div class="graph-empty graph-loading">Loading…</div></div>
          </div>
        </div>`;
          renderDepGraph(svcList, merged.depsMap, merged.graph);
        }
        /** The workspace a repo's card acts in (All active: its owner's). */
        function ownerWs(repo) {
          return GRAPH_ALL
            ? (GRAPH_ALL.ownerOf.get(repo) ?? GRAPH_ALL.focus)
            : null;
        }
        /** Run `fn` as if the repo's owning workspace were the one viewed. */
        function asOwner(repo, fn) {
          const ws = ownerWs(repo);
          if (!ws) return fn();
          const content = document.getElementById("content");
          const was = [activeWs, content?.dataset.ws];
          activeWs = ws;
          if (content) content.dataset.ws = ws;
          try {
            return fn();
          } finally {
            activeWs = was[0];
            if (content) content.dataset.ws = was[1];
          }
        }
        /** Re-render what is shown: every workspace in view, or the one. */
        function refreshView(wsName) {
          return GRAPH_ALL
            ? renderGraphAll(GRAPH_ALL.names, GRAPH_ALL.focus)
            : renderContent(wsName);
        }

        // Close workspace menus on outside click
        document.addEventListener("click", () => {
          document
            .querySelectorAll(".ws-menu-dropdown.open")
            .forEach((d) => d.classList.remove("open"));
        });

        // Event delegation for workspace list clicks (safe for names with any allowed chars).
        document.getElementById("ws-list").addEventListener("click", (e) => {
          // ⋮ menu toggle
          const menuBtn = e.target.closest(".ws-menu-btn");
          if (menuBtn) {
            e.stopPropagation();
            document
              .querySelectorAll(".ws-menu-dropdown.open")
              .forEach((d) => d.classList.remove("open"));
            const menu = document.getElementById(menuBtn.dataset.menuId);
            menu?.classList.toggle("open");
            return;
          }
          // ↗ open in editor
          const termBtn = e.target.closest("[data-open-term]");
          if (termBtn) {
            e.stopPropagation();
            openInTerminal(termBtn.dataset.openTerm);
            return;
          }
          const openBtn = e.target.closest("[data-open-path]");
          if (openBtn) {
            e.stopPropagation();
            openInEditor(openBtn.dataset.openPath);
            return;
          }
          const item = e.target.closest(".ws-item[data-name]");
          if (!item) return;
          const name = item.dataset.name;
          if (e.target.closest('[data-action="delete"]')) {
            document
              .querySelectorAll(".ws-menu-dropdown.open")
              .forEach((d) => d.classList.remove("open"));
            deleteWorkspace(e, name);
          } else if (e.target.closest('[data-action="rename"]')) {
            document
              .querySelectorAll(".ws-menu-dropdown.open")
              .forEach((d) => d.classList.remove("open"));
            renameWorkspace(name);
          } else if (e.target.closest('[data-action="activate"]')) {
            document
              .querySelectorAll(".ws-menu-dropdown.open")
              .forEach((d) => d.classList.remove("open"));
            activateWorkspaceUi(name);
          } else if (e.target.closest('[data-action="deactivate"]')) {
            document
              .querySelectorAll(".ws-menu-dropdown.open")
              .forEach((d) => d.classList.remove("open"));
            deactivateWorkspaceUi(name);
          } else if (!e.target.closest(".ws-item-right")) {
            selectWorkspace(name);
          }
        });

        // ── Select workspace ──────────────────────────────────────────────────────
        window.selectWorkspace = async function (
          name,
          { updateUrl = true } = {},
        ) {
          activeWs = name;
          if (updateUrl) {
            const params = new URLSearchParams(location.search);
            params.set("ws", name);
            history.replaceState(null, "", "?" + params.toString());
          }
          document
            .querySelectorAll(".ws-item")
            .forEach((el) =>
              el.classList.toggle("active", el.dataset.name === name),
            );
          await renderContent(name);
        };

        // Event delegation for content pane — reads workspace from content.dataset.ws
        // so workspace names are never interpolated into inline JS strings.
        document.getElementById("content").addEventListener("click", (e) => {
          const content = document.getElementById("content");
          const wsName = content?.dataset?.ws;
          if (!wsName) return;
          const termBtn = e.target.closest("[data-open-term]");
          if (termBtn) {
            openInTerminal(termBtn.dataset.openTerm);
            return;
          }
          // Open-in-editor buttons use data-open-path (not data-action)
          const openBtn = e.target.closest("[data-open-path]");
          if (openBtn) {
            openInEditor(openBtn.dataset.openPath);
            return;
          }
          const btn = e.target.closest("[data-action]");
          if (!btn) return;
          const action = btn.dataset.action;
          if (action === "toggle-svc-menu") {
            // Close any other open dropdown first
            document.querySelectorAll(".action-dropdown").forEach((d) => {
              if (d.id !== btn.dataset.menuId) d.style.display = "none";
            });
            const menu = document.getElementById(btn.dataset.menuId);
            if (menu)
              menu.style.display = menu.style.display === "none" ? "" : "none";
            e.stopPropagation();
            return;
          }
          if (action === "switch-ws") {
            switchWorkspace(wsName);
          } else if (action === "activate-ws") {
            activateWorkspaceUi(wsName);
          } else if (action === "deactivate-ws") {
            deactivateWorkspaceUi(wsName);
          } else if (action === "focus-ws") {
            focusWorkspaceUi(wsName);
          } else if (action === "rename-ws") {
            btn.closest(".action-dropdown").style.display = "none";
            renameWorkspace(wsName);
          } else if (action === "delete-ws") {
            btn.closest(".action-dropdown").style.display = "none";
            deleteWorkspace(e, wsName);
          } else if (action === "add-svc") {
            addService(wsName);
          } else if (action === "remove-svc") {
            removeService(wsName, btn.dataset.address);
          } else if (action === "add-dep") {
            openAddSvcModal(wsName);
            setTimeout(() => {
              const input = document.getElementById("add-svc-global-search");
              if (input) {
                input.value = btn.dataset.dep;
                input.dispatchEvent(new Event("input"));
              }
            }, 50);
          }
        });

        // ── Multi-active helpers ──────────────────────────────────────────────────
        function activeSet() {
          const a = wsData?.active;
          if (Array.isArray(a)) return a;
          if (typeof a === "string" && a) return [a];
          return [];
        }
        function focusName() {
          return wsData?.focus ?? activeSet()[0] ?? "default";
        }
        function isWsActive(name) {
          return activeSet().includes(name);
        }

        // ── Content pane ──────────────────────────────────────────────────────────
        // Workspaces (R24, 0.3.0-dev.35, Ward 2026-11-05): one job, run your
        // workspaces. The selected workspace's header (name, badges, its
        // actions, Open in Graph →, ⋯) and one repo table (R24d). The
        // Graph page (R22) is this file at /graph: the graph alone.
        async function renderContent(wsName) {
          const content = document.getElementById("content");
          const ws = wsData?.workspaces?.[wsName];
          if (!ws) {
            content.innerHTML =
              '<div class="empty-state">Workspace not found</div>';
            return;
          }

          // The page header's scope line names the workspace shown (R20).
          window.denShell?.pageHeader?.()?.setScope({
            ws: wsName,
            env: "local",
          });
          // R24e: the runs dock shows this workspace's runs ("All runs"
          // shows every one). The Graph page keeps every run.
          if (!GRAPH_PAGE) {
            // (Tabs docked before the workspaces loaded get their tags now.)
            for (const a of _tabs.keys())
              if (runs().has(a)) runs().add(a, null, { ws: wsOfAddress(a) });
            runs().scope({ ws: wsName });
          }

          const isActive = isWsActive(wsName);
          const isFocus = wsName === focusName();

          // Derived dependency graph (repo-level) — the SAME graph `__DEN_CLI__ graph` and
          // `__DEN_CLI__ up/down` use. The graph and the table's order key off this (not the
          // hand-written manifest depends_on), so display matches behavior.
          // Graph must be derived against the workspace being VIEWED: with several
          // workspaces active, a repo name points at a different checkout per
          // workspace, so a focus-derived graph has no edges for these nodes.
          // Applications draw the graph's boundaries and group the table.
          const [derivedGraph, appTree] = await Promise.all([
            fetch(`/api/graph?workspace=${encodeURIComponent(wsName)}`)
              .then((r) => r.json())
              .catch(() => ({ nodes: [], edges: [] })),
            fetch(`/api/applications?workspace=${encodeURIComponent(wsName)}`)
              .then((r) => (r.ok ? r.json() : { applications: [] }))
              .catch(() => ({ applications: [] })),
          ]);
          _graphApps = appTree.applications || [];
          _graphDerived = derivedGraph;
          const repoRank = deriveRepoRank(derivedGraph);

          // Expanded services (with available commands) for this workspace.
          const svcList = _sortByName(
            await fetch(
              `/api/services?env=local&workspace=${encodeURIComponent(wsName)}`,
            )
              .then((r) => r.json())
              .catch(() => []),
          );
          // Refresh the auto-start-off set from the same payload the rows render from.
          _noAutostartRepos = new Set(
            svcList.filter((s) => s.autostart === false).map((s) => s.repo),
          );
          // Refresh primary-service routing (one log tab per system).
          setPrimaryRouting(svcList);

          // Fetch available repos for the add modal and dep rows
          const repos = await fetch(
            `/api/workspaces/available-repos?workspace=${encodeURIComponent(wsName)}`,
          )
            .then((r) => r.json())
            .catch(() => []);
          const localRepos = repos.filter((r) => r.source === "local");
          const managedRepos = repos.filter((r) => r.source === "managed");
          // Cache for the modal (opened on demand)
          _addSvcLocalRepos = localRepos;
          _addSvcManagedRepos = managedRepos;
          _addSvcWsServices = ws.services ?? {};

          // Fetch missing deps for the viewed workspace (not limited to active)
          let depsMap = {};
          const depsCheck = await fetch(
            `/api/workspaces/deps-check?workspace=${encodeURIComponent(wsName)}`,
          )
            .then((r) => r.json())
            .catch(() => []);
          depsCheck.forEach(({ address, missingDeps }) => {
            depsMap[address] = missingDeps;
          });
          content.dataset.ws = wsName;

          if (GRAPH_PAGE) {
            content.innerHTML = `
        <div class="content-body">
          <div class="graph-panel" id="graph-panel">
            <div id="dep-graph-wrap"><div class="graph-empty graph-loading">Loading…</div></div>
          </div>
        </div>`;
            renderDepGraph(svcList, depsMap, derivedGraph);
            return;
          }

          const masterDisabled = isActive
            ? ""
            : 'disabled title="Activate this workspace first"';
          // Membership is config-driven, not disk-driven: a managed entry
          // whose clone doesn't exist yet must still ENABLE Sync — Sync is the
          // control that creates the clone. Deriving this from svcList alone
          // disabled the one button that fixes a fresh install.
          const hasManagedServices = Object.values(ws.services ?? {}).some(
            (e) => e?.mode === "managed",
          );
          const syncDisabled =
            !isActive || !hasManagedServices
              ? 'disabled title="No managed services in this workspace"'
              : "";
          const enc = encodeURIComponent(wsName);
          // "stacks: <ns>" only when this workspace's stacks run under a
          // namespace other than its default suffix (stack_namespace).
          const stackNs = wsData?.stackNamespaces?.[wsName];
          const stackNsChip = stackNs?.differs
            ? `<span class="badge stack-ns" id="ws-stack-ns" title="Compose projects run as &lt;stack&gt;-${escHtml(stackNs.stack_namespace)} (stack_namespace from ${escHtml(stackNs.source)}; default ${escHtml(stackNs.default)})">stacks: ${escHtml(stackNs.stack_namespace)}</span>`
            : "";
          content.innerHTML = `
        <div class="content-header">
          <h2>${escHtml(wsName)}</h2>
          ${
            isActive
              ? `<span class="badge active-ws"${isFocus ? ` title="${escHtml(wsT("ws.focusTip", ""))}"` : ""}>active${isFocus ? ` · ${escHtml(wsT("ws.focus", "CLI default"))}` : ""}</span>
               ${!isFocus ? `<button class="switch-btn" data-action="focus-ws" title="${escHtml(wsT("ws.setFocusTip", ""))}">Make CLI default</button>` : ""}
               <button class="switch-btn" data-action="deactivate-ws">deactivate</button>`
              : `<button class="switch-btn" data-action="activate-ws">activate</button>
               <button class="switch-btn" data-action="switch-ws">activate + make CLI default</button>`
          }
          ${stackNsChip}
          <span class="badge ws-agents" id="ws-agents-count" hidden></span>
          <a class="ws-head-link" id="ws-open-graph" href="/graph?ws=${enc}">Open in Graph →</a>
          <div class="action-menu-wrap ws-more">
            <button type="button" class="switch-btn" data-action="toggle-svc-menu" data-menu-id="ws-more-menu" aria-haspopup="menu" aria-expanded="false" aria-label="More for ${escHtml(wsName)}" title="More for this workspace">⋯</button>
            <div class="action-dropdown" id="ws-more-menu" role="menu" style="display:none">
              <a role="menuitem" href="/settings?ws=${enc}#workspace">Workspace settings</a>
              <button type="button" role="menuitem" data-action="rename-ws">Rename…</button>
              ${wsName !== "default" ? `<button type="button" role="menuitem" class="danger" data-action="delete-ws">Delete…</button>` : ""}
            </div>
          </div>
        </div>

        <div class="cmd-bar">
          <span class="cmd-bar-label">Workspace</span>
          <button class="master-btn up"      ${masterDisabled} onclick="runWorkspaceCmd('up')">▶ Up</button>
          <button class="master-btn down"    ${masterDisabled} onclick="runWorkspaceCmd('down')">⏹ Down</button>
          <button class="master-btn restart" ${masterDisabled} onclick="runWorkspaceCmd('restart')">↺ Restart</button>
          <button class="master-btn"         ${masterDisabled} onclick="runWorkspaceCmd('setup')">⚙ Setup</button>
          <button class="master-btn"         ${syncDisabled} onclick="runWorkspaceSync()">⟳ Sync</button>
          <div class="cmd-bar-spacer"></div>
          <span class="cmd-bar-status" id="ws-cmd-status"></span>
        </div>

        ${
          svcList.length === 0
            ? `
        <div class="ws-empty-state">
          <div class="ws-empty-msg">No services in this workspace yet</div>
          <button class="add-svc-open-btn ws-empty-add-btn" onclick="openAddSvcModal('${escHtml(wsName)}')">+ Add Service</button>
          <span class="form-msg" id="add-msg"></span>
        </div>
        <div class="content-body ws-agents-only">
          ${agentsSectionHtml(wsName)}
        </div>
        `
            : `
        <div class="content-body">
          <div class="tbl-tools">
            <label>Find <input type="search" class="tbl-find" id="tbl-find" placeholder="repo, service…" autocomplete="off" value="${escHtml(_tblQuery)}"></label>
            <span class="tbl-muted" id="tbl-group-l">Group by</span>
            <div class="tbl-seg" role="group" aria-labelledby="tbl-group-l" id="tbl-group">
              ${[
                ["none", "None"],
                ["app", "Application"],
                ["org", "Org"],
              ]
                .map(
                  ([v, l]) =>
                    `<button type="button" data-group="${v}" aria-pressed="${_tblGroup === v}">${l}</button>`,
                )
                .join("")}
            </div>
          </div>
          <div class="tablewrap">
            <table class="svc" id="repo-table">
              <caption>Repos in ${escHtml(wsName)}</caption>
              <thead><tr>
                <th scope="col">Repo</th>
                <th scope="col">Health</th>
                <th scope="col">Branch</th>
                <th scope="col">Mode</th>
                <th scope="col">Last run</th>
                <th scope="col"><span class="tbl-sr">Actions</span></th>
              </tr></thead>
            </table>
          </div>
          <div class="tbl-foot">
            <button class="add-svc-open-btn" onclick="openAddSvcModal('${escHtml(wsName)}')">+ Add repo</button>
            <span class="form-msg" id="add-msg"></span>
          </div>

          <!-- Agents (AG-4a, §5c): the workspace's agents, under its repos. -->
          ${agentsSectionHtml(wsName)}

          <!-- Validate a manifest (by path, or pasted) -->
          <details class="validate-details">
            <summary>Validate a manifest</summary>
            <div class="validate-form">
              <div class="row" style="margin-bottom:8px">
                <label style="white-space:nowrap">Path or dir</label>
                <input class="form-inp" id="validate-path-inp" placeholder="/absolute/path/to/repo  or  /path/to/__DEN_MANIFEST_YML__" style="flex:1">
                <button class="add-btn" onclick="validateManifestInput()">Validate</button>
              </div>
              <textarea id="validate-textarea" placeholder="…or paste __DEN_MANIFEST_YML__ content here"></textarea>
              <div id="validate-result-panel" style="font-size:11px;color:var(--muted);margin-top:6px"></div>
            </div>
          </details>
        </div>`
        }
`;
          _tbl = { wsName, ws, svcList, depsMap, repoRank, appTree };
          renderTable();
          mountAgents(wsName);

          // Pre-fetch GitHub org repos so the Add Service modal loads instantly
          fetch("/api/github/repos")
            .then((r) => r.json())
            .catch(() => [])
            .then((ghRepos) => {
              if (ghRepos.length) _addSvcGhRepos = ghRepos;
            });
        }

        // ── The repo table (R24d) ─────────────────────────────────────────────────
        // One row per repo: Config's address and mode merged with live state
        // (health and its rollup, branch, the last run, Start/Stop/Restart/
        // Logs and ⋯). A repo with several services expands to one sub-row
        // each. Problems sort first, with the status drawer's fix text and
        // buttons (topbar.js problemCards/problemFix: one source). Group by
        // none, Application (as `__DEN_CLI__ apps`) or Org; Find is the Graph
        // page's matcher (graph-model.js findHit).
        let _tbl = null;
        let _tblQuery = "";
        let _tblGroup = "none";
        const _tblOpen = new Set(); // repos whose sub-rows are shown
        const TBL_COLS = 6;
        const PROBLEM = new Set(["down", "degraded"]);

        /** The table's rows, from the last render's data and the health. */
        function tableModel() {
          const { svcList, depsMap, repoRank } = _tbl;
          const m = buildModel({
            services: svcList,
            health: _lastHealthResults,
            apps: _graphApps,
            orgs: _orgData,
            depsMap,
            workspace: _tbl.wsName,
          });
          const mine = new Set(m.byRepo.keys());
          const row = buildRow(
            (_lastHealthResults || []).filter((h) => mine.has(h.repo)),
            [],
          );
          const cards = problemCards(row);
          const at = _lastHealthAt
            ? new Intl.DateTimeFormat(undefined, {
                hour: "2-digit",
                minute: "2-digit",
              }).format(_lastHealthAt)
            : "";
          return [...m.byRepo.keys()].map((repo) => {
            const svcs = m.byRepo.get(repo);
            const raw = svcList.filter((s) => s.repo === repo);
            const primary = entryOf(m, repo);
            const rollup = repoRollup(m, repo);
            const missing = [
              ...new Set(
                raw
                  .flatMap((x) => depsMap[x.address] ?? [])
                  .concat(depsMap[repo] ?? []),
              ),
            ];
            return {
              repo,
              svcs,
              raw,
              primary,
              rollup,
              missing,
              fixes: cards
                .filter((c) => c.repo === repo)
                .map((c) => ({ c, fix: problemFix(c, at) })),
              problem: PROBLEM.has(rollup.state),
              rank: repoRank.get(repo) ?? Infinity,
              app: svcs[0]?.app ?? repo,
              org: svcs[0]?.org ?? "",
            };
          });
        }

        /** Problems first; then the startup order (foundations first), then name. */
        function byProblemThenOrder(a, b) {
          return (
            Number(b.problem) - Number(a.problem) ||
            a.rank - b.rank ||
            a.repo.localeCompare(b.repo)
          );
        }

        /** Groups of rows: one (no heading), or per application or org. */
        function tableGroups(rows) {
          if (_tblGroup === "app") {
            // `__DEN_CLI__ apps`: declared applications, then each remaining
            // repo as its own; an app with nothing here is left out.
            const apps = (_tbl.appTree.applications || []).filter(
              (a) => a.repos.length > 0,
            );
            const placed = new Set();
            const out = apps.map((a) => {
              const mine = rows.filter(
                (r) => a.repos.includes(r.repo) && !placed.has(r.repo),
              );
              mine.forEach((r) => placed.add(r.repo));
              return {
                key: "app:" + a.name,
                app: a,
                title: a.title,
                rows: mine,
              };
            });
            const rest = rows.filter((r) => !placed.has(r.repo));
            if (rest.length)
              out.push({
                key: "app:",
                title: "Not in an application",
                rows: rest,
              });
            return out.filter((g) => g.rows.length);
          }
          if (_tblGroup === "org") {
            const by = new Map();
            for (const r of rows) {
              if (!by.has(r.org)) by.set(r.org, []);
              by.get(r.org).push(r);
            }
            const label = (id) =>
              (_orgData?.orgs || []).find((o) => o.id === id)?.label ||
              id ||
              "No org";
            return [...by]
              .sort((a, b) => label(a[0]).localeCompare(label(b[0])))
              .map(([id, rs]) => ({
                key: "org:" + id,
                title: label(id),
                rows: rs,
              }));
          }
          return [{ key: "", title: null, rows }];
        }

        /** The last run (the runs dock's) of a repo's tab: "✓ 12:03", "running…", "—". */
        function lastRunText(repo) {
          const list = runs()?.list?.() ?? [];
          const mine = list.filter(
            (r) => r.id === repo || r.id.split("/")[0] === repo,
          );
          const r = mine.sort((a, b) => (b.ranAt ?? 0) - (a.ranAt ?? 0))[0];
          if (!r || (!r.ranAt && !r.running)) return { text: "—", cls: "" };
          if (r.running) return { text: "running…", cls: "" };
          const t = new Intl.DateTimeFormat(undefined, {
            hour: "2-digit",
            minute: "2-digit",
          }).format(new Date(r.endedAt ?? r.ranAt));
          return r.error
            ? { text: `✗ failed ${t}`, cls: "bad" }
            : { text: `✓ ${t}`, cls: "ok" };
        }

        /** A health cell: the dot and the rollup, or the failing check. */
        function healthCell(state, text, title = text) {
          const dot =
            { ok: "", bad: "bad", warn: "bad", unk: "off", pending: "pending" }[
              state
            ] ?? "off";
          const cls =
            state === "ok"
              ? " ok"
              : state === "bad" || state === "warn"
                ? " bad"
                : "";
          return `<span class="tbl-health${cls}" title="${escHtml(title)}"><span class="den-dot ${dot}" aria-hidden="true"></span><span class="tbl-ht">${escHtml(text)}</span></span>`;
        }
        /** Before the first health round lands, a cell says so (not down, not blank). */
        const CHECKING = () =>
          healthCell(
            "pending",
            "checking…",
            "waiting for the first health check",
          );
        function repoHealth(r) {
          if (!_lastHealthAt) return CHECKING();
          const { rollup } = r;
          const checked = rollup.checked;
          const ok = checked - rollup.down.length;
          // A repo of several services summarises ("1/2 healthy", in the
          // problem colour); what failed is on its problem row and its
          // sub-row, and in the tooltip. One service shows its own state.
          if (r.fixes.length)
            return r.svcs.length > 1
              ? healthCell(
                  "bad",
                  `${ok}/${checked} healthy`,
                  r.fixes.map(({ c }) => `${c.id}: ${c.line}`).join("\n"),
                )
              : healthCell("bad", r.fixes[0].c.line);
          if (rollup.state === "unknown")
            return healthCell("unk", repoStatusWord(rollup));
          return healthCell(
            repoStatus(rollup),
            `${ok}/${checked} healthy${rollup.unchecked ? `, ${rollup.unchecked} not checked` : ""}`,
          );
        }

        /** Action buttons; each one's name says what and on which repo or service. */
        function actBtns(id, o) {
          const b = (act, label, name, extra = "") =>
            `<button type="button" class="den-btn sm tbl-btn" data-action="tbl-${act}" data-id="${escHtml(id)}"${extra} aria-label="${escHtml(name)}" data-k="${act}:${escHtml(id)}">${label}</button>`;
          // (A title keeps setAllButtons from re-enabling it.)
          const off = (on) =>
            on ? "" : ` disabled title="${escHtml(id)} has no up command"`;
          return (
            b("up", "Start", `Start ${id}`, off(o.up)) +
            b("down", "Stop", `Stop ${id}`) +
            b("restart", "Restart", `Restart ${id}`, off(o.restart)) +
            b("logs", "Logs", `Logs of ${id}`)
          );
        }

        function repoMenu(r) {
          const { repo, primary, raw } = r;
          const safe = repo.replace(/[^a-z0-9]/gi, "-");
          const menuId = `svc-menu-${safe}`;
          const q = (v) => String(v).replace(/'/g, "\\'");
          const isAutoOff = _noAutostartRepos.has(repo);
          const isUncloned = raw.some((x) => x.cloned === false);
          const wsEntry =
            _tbl.ws.services?.[repo] ?? _tbl.ws.services?.[primary?.id] ?? {};
          const repoPath = wsEntry.path || primary?.path || "";
          const local = primary?.mode === "dev-managed" && primary?.path;
          return `<div class="action-menu-wrap">
              <button type="button" class="den-btn sm tbl-btn tbl-more" data-action="toggle-svc-menu" data-menu-id="${menuId}" aria-haspopup="menu" aria-expanded="false" aria-label="More for ${escHtml(repo)}" data-k="more:${escHtml(repo)}">⋯</button>
              <div class="action-dropdown" id="${menuId}" role="menu" style="display:none">
                ${local ? `<button role="menuitem" data-open-term="${escHtml(primary.path)}">&gt;_ open in terminal</button><button role="menuitem" data-open-path="${escHtml(primary.path)}">↗ open in editor</button>` : ""}
                <button role="menuitem" title="start / don't start with workspace" onclick="toggleAutostart('${q(repo)}', ${isAutoOff})">${isAutoOff ? "⏸ auto-start: off" : "▶ auto-start: on"}</button>
                ${isUncloned ? `<button role="menuitem" title="Clone this managed repo now" onclick="runRepoSync('${q(repo)}')">⬇ clone now</button>` : ""}
                <button role="menuitem" onclick="validateServiceManifest('${safe}','${q(repoPath)}','${q(repo)}')">validate<span class="validate-inline" id="vr-${safe}"></span></button>
                <button role="menuitem" class="danger" data-action="remove-svc" data-address="${escHtml(repo)}">remove</button>
              </div>
            </div>`;
        }

        function repoRows(r) {
          const { repo, svcs, primary, missing } = r;
          const many = svcs.length > 1;
          const finding = !!_tblQuery.trim();
          const open = many && (_tblOpen.has(repo) || finding);
          // Find shows only the sub-rows it matches, under their repo.
          const shown = (s) => open && (!finding || findHit(s.id, _tblQuery));
          const safe = repo.replace(/[^a-z0-9]/gi, "-");
          const subIds = svcs.map((s, i) => `sub-${safe}-${i}`);
          const isAutoOff = _noAutostartRepos.has(repo);
          const isUncloned = r.raw.some((x) => x.cloned === false);
          const mode = primary?.mode;
          const exp = many
            ? `<button type="button" class="tbl-exp" data-action="tbl-exp" data-repo="${escHtml(repo)}" aria-expanded="${open}" aria-controls="${subIds.join(" ")}" aria-label="${open ? "Hide" : "Show"} ${escHtml(repo)}'s ${svcs.length} services" data-k="exp:${escHtml(repo)}">${open ? "▾" : "▸"}</button>`
            : `<span class="tbl-exp-sp" aria-hidden="true"></span>`;
          const run = lastRunText(repo);
          const badges =
            (isAutoOff
              ? ` <span class="badge" title="start / don't start with workspace" style="border-color:var(--warn);color:var(--warn)">⏸ off</span>`
              : "") +
            (isUncloned
              ? ` <span class="badge uncloned" title="Not cloned yet — run Sync to clone it">⬇ not cloned</span>`
              : "") +
            (missing.length
              ? ` <span class="dep-warn" title="Missing deps: ${escHtml(missing.join(", "))}">⚠</span>`
              : "") +
            (many
              ? ` <span class="tbl-muted">${svcs.length} services</span>`
              : "");
          const switchTo = mode === "managed" ? "dev-managed" : "managed";
          const modeCell = mode
