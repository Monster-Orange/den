<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <title>__DEN_TITLE__ · Edge</title>
    <style>
      /* The Edge page (PL-SPEC §10): the prototype's (den-shell.html) page
         header (.ph, R20), summary tiles (.sum .tile), section headings
         (h2.sec) and table (.tablewrap table.svc), ported as they are; --r
         is --radius, --r-btn is --radius-button. Read-only. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* .main */
      html body.den-has-shell > #den-content {
        overflow: auto;
        min-width: 0;
        padding: 20px 24px 32px 24px;
        font: 14px/1.45 var(--sans);
        color: var(--text);
        display: block;
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent-text);
      }
      /* .ph: the page header */
      .ph {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .ph h1 {
        font: 600 22px/1.2 var(--display);
        margin: 0;
        text-wrap: balance;
      }
      .ph .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      /* .sum, .tile */
      .sum {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        margin-bottom: 22px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        min-width: 0;
      }
      .tile .k {
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
      }
      .tile .v {
        font: 600 22px var(--display);
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      .tile .s {
        color: var(--muted);
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }
      .tile.bad {
        border-color: color-mix(in srgb, var(--bad) 45%, var(--border));
      }
      .tile.bad .v {
        color: var(--bad);
      }
      section {
        margin-bottom: 22px;
      }
      h2.sec {
        font: 600 13px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      /* .tablewrap, table.svc */
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      table.svc {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      table.svc th {
        text-align: left;
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 400;
      }
      table.svc td {
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        vertical-align: top;
      }
      table.svc tr:last-child td {
        border-bottom: 0;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .rule {
        white-space: normal;
        overflow-wrap: anywhere;
        color: var(--muted);
      }
      /* The source tag: like the rail's distribution tag (.tagx). */
      .src {
        font: 11px var(--mono);
        color: var(--faint);
        border: 1px dashed var(--border-strong);
        border-radius: 4px;
        padding: 0 4px;
      }
      .names {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .names .sub {
        color: var(--faint);
      }
      .note,
      .none {
        color: var(--muted);
        font-size: 12.5px;
        margin: 8px 0 0;
      }
      .errs {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--warn);
        font-size: 12.5px;
      }
      .empty {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        padding: 28px;
        color: var(--muted);
        max-width: 640px;
      }
      .empty b {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="edge"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div class="ph">
        <div>
          <h1>Edge</h1>
          <div class="sub" id="edge-sub">Reading the edge…</div>
        </div>
      </div>
      <div id="edge-body" aria-busy="true" aria-live="polite"></div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import { mountEdge } from "/edge-page.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        void mountEdge(
          document.getElementById("edge-body"),
          document.getElementById("edge-sub"),
        );
      </script>
    </main>
  </body>
</html>
