<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/kit/fonts.css" />
    <link rel="stylesheet" href="/kit/tokens.css" />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <title>__DEN_TITLE__ · Edge</title>
    <style>
      /* The Edge page (PL-SPEC §10): the prototype's (den-shell.html) page
         header (.ph, R20), summary tiles (.sum .tile), section headings
         (h2.sec) and table (.tablewrap table.svc), ported as they are; --r
         is --radius, --r-btn is --radius-button. Read-only. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* .main */
      html body.den-has-shell > #den-content {
        overflow: auto;
        min-width: 0;
        padding: 20px 24px 32px 24px;
        font: 14px/1.45 var(--sans);
        color: var(--text);
        display: block;
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent-text);
      }
      /* .ph: the page header */
      .ph {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .ph h1 {
        font: 600 22px/1.2 var(--display);
        margin: 0;
        text-wrap: balance;
      }
      .ph .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      /* .sum, .tile */
      .sum {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
        gap: 10px;
        margin-bottom: 22px;
      }
      .tile {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 12px 14px;
        min-width: 0;
      }
      .tile .k {
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
      }
      .tile .v {
        font: 600 22px var(--display);
        font-variant-numeric: tabular-nums;
        margin-top: 2px;
      }
      .tile .s {
        color: var(--muted);
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }
      .tile.bad {
        border-color: color-mix(in srgb, var(--bad) 45%, var(--border));
      }
      .tile.bad .v {
        color: var(--bad);
      }
      section {
        margin-bottom: 22px;
      }
      h2.sec {
        font: 600 13px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        margin: 0 0 10px;
      }
      /* .tablewrap, table.svc */
      .tablewrap {
        overflow-x: auto;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
      }
      table.svc {
        width: 100%;
        border-collapse: collapse;
        font-size: 13.5px;
      }
      table.svc th {
        text-align: left;
        font: 11px var(--mono);
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--faint);
        padding: 8px 12px;
        border-bottom: 1px solid var(--border);
        font-weight: 400;
      }
      table.svc td {
        padding: 7px 12px;
        border-bottom: 1px solid var(--border);
        white-space: nowrap;
        vertical-align: top;
      }
      table.svc tr:last-child td {
        border-bottom: 0;
      }
      .mono {
        font-family: var(--mono);
        font-size: 12.5px;
      }
      .rule {
        white-space: normal;
        overflow-wrap: anywhere;
        color: var(--muted);
      }
      /* The source tag: like the rail's distribution tag (.tagx). */
      .src {
        font: 11px var(--mono);
        color: var(--faint);
        border: 1px dashed var(--border-strong);
        border-radius: 4px;
        padding: 0 4px;
      }
      .names {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 4px;
      }
      .names .sub {
        color: var(--faint);
      }
      .note,
      .none {
        color: var(--muted);
        font-size: 12.5px;
        margin: 8px 0 0;
      }
      .errs {
        margin: 8px 0 0;
        padding-left: 18px;
        color: var(--warn);
        font-size: 12.5px;
      }
      .empty {
        border: 1px dashed var(--border-strong);
        border-radius: var(--radius);
        padding: 28px;
        color: var(--muted);
        max-width: 640px;
      }
      .empty b {
        color: var(--text);
      }
      /* Issue 455 (mock v3): the address card, when another server holds
         the port Den's address needs. */
      .addr-card {
        display: grid;
        gap: 14px;
        margin-bottom: 22px;
        max-width: 880px;
      }
      .addr-card[hidden],
      #edge-address[hidden] {
        display: none;
      }
      .addr-status {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 14px 16px;
        border: 1px solid color-mix(in srgb, var(--warn) 70%, var(--border));
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--warn) 12%, var(--surface));
      }
      .addr-dot {
        flex: none;
        width: 10px;
        height: 10px;
        margin-top: 7px;
        border-radius: 50%;
        background: var(--warn);
      }
      .addr-title {
        font: 600 17px/1.3 var(--display);
        margin: 0 0 4px;
      }
      .addr-line {
        margin: 0;
        color: var(--muted);
        overflow-wrap: anywhere;
      }
      .addr-line b {
        color: var(--text);
      }
      .addr-card code,
      .addr-line code {
        font: 600 12.5px var(--mono);
        overflow-wrap: anywhere;
      }
      .addr-box {
        padding: 14px 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        min-width: 0;
      }
      .addr-box h3 {
        font: 600 15px var(--display);
        margin: 0 0 10px;
      }
      .addr-box p {
        margin: 10px 0;
        overflow-wrap: anywhere;
      }
      .addr-opts,
      .addr-kinds {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .addr-opt,
      .addr-chip,
      .addr-copy {
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--border-strong);
        border-radius: var(--radius-button, 8px);
        background: var(--surface);
        color: var(--text);
        font: 500 14px var(--sans);
        cursor: pointer;
      }
      /* The card's buttons are the kit's (issue 673), at the mock's 44px. */
      .addr-card .den-btn {
        min-height: 44px;
        padding: 0 16px;
      }
      .addr-opt[aria-pressed="true"],
      .addr-chip[aria-pressed="true"] {
        border-color: var(--accent);
        box-shadow: inset 0 0 0 1px var(--accent);
        font-weight: 600;
      }
      .addr-snip {
        position: relative;
        margin-top: 10px;
        min-width: 0;
      }
      .addr-snip pre {
        margin: 0;
        padding: 14px 16px;
        padding-right: 96px;
        max-width: 100%;
        overflow: auto;
        border-radius: var(--radius);
        border: 1px solid var(--border-strong);
        background: var(--bg);
        color: var(--text);
        font: 13px/1.55 var(--mono);
      }
      .addr-copy {
        position: absolute;
        top: 8px;
        right: 8px;
        background: var(--surface);
      }
      .addr-check-row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
        margin-top: 12px;
      }
      .addr-out {
        color: var(--muted);
      }
      .addr-now {
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .addr-row {
        display: grid;
        grid-template-columns: minmax(120px, 30%) 1fr;
        gap: 12px;
        align-items: baseline;
      }
      .addr-row dt {
        color: var(--muted);
      }
      .addr-row dd {
        margin: 0;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .addr-pill {
        display: inline-block;
        padding: 0 8px;
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        font: 12px var(--mono);
        white-space: nowrap;
      }
      .addr-pill.warn {
        color: var(--warn);
        border-color: color-mix(in srgb, var(--warn) 70%, var(--border));
      }
      .addr-done {
        margin: 0 0 22px;
        color: var(--ok, var(--accent-text));
      }
      @media (max-width: 520px) {
        .addr-opts {
          flex-direction: column;
        }
        .addr-opt {
          width: 100%;
        }
        .addr-row {
          grid-template-columns: 1fr;
          gap: 2px;
        }
        .addr-snip pre {
          padding-right: 16px;
          padding-top: 60px;
        }
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="edge"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div class="ph">
        <div>
          <h1 data-t="n.edge">Edge</h1>
          <div class="sub" id="edge-sub" data-t="edge.reading">
            Reading the edge…
          </div>
        </div>
      </div>
      <!-- Issue 455: when another server holds the port Den's address needs. -->
      <div id="edge-address" hidden></div>
      <div id="edge-body" aria-busy="true" aria-live="polite"></div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import { edgeSub, mountEdge } from "/edge-page.js";
        import { mountAddressCard } from "/address-card.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        // Issue 455: the sub line follows the address card's state (one
        // fetch of /api/edge/address feeds both), and Check again's too.
        const sub = document.getElementById("edge-sub");
        let edge = null;
        const onState = (s) => {
          if (edge && !edge.unreachable) sub.textContent = edgeSub(edge, s);
        };
        const card = mountAddressCard(
          document.getElementById("edge-address"),
          undefined,
          onState,
        );
        void mountEdge(
          document.getElementById("edge-body"),
          sub,
          fetch,
          card,
        ).then((st) => {
          edge = st;
        });
      </script>
    </main>
  </body>
</html>
