<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/kit/fonts.css" />
    <link rel="stylesheet" href="/kit/tokens.css" />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <link rel="stylesheet" href="/persona-ui.css" />
    <title>__DEN_TITLE__ · Settings</title>
    <style>
      /* The Settings page (R21): the prototype's (den-shell.html) page
         header, sections, rows, segmented buttons, swatches and navigation
         list, ported as they are; --r is --radius, --r-btn is
         --radius-button. The category list on the left has no prototype
         counterpart: it is drawn like the rail's items (.ni). */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      /* .main */
      html body.den-has-shell > #den-content {
        overflow: auto;
        min-width: 0;
        padding: 20px 24px 32px 24px;
        font: 14px/1.45 var(--sans);
        color: var(--text);
        display: block;
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      /* .ph: the page header */
      .ph {
        display: flex;
        align-items: flex-end;
        gap: 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .ph h1 {
        font: 600 22px/1.2 var(--display);
        margin: 0;
        text-wrap: balance;
      }
      .ph .sub {
        color: var(--muted);
        font-size: 13px;
        margin-top: 4px;
      }
      /* R21a (Ward QA 2026-11-05): the header with its search stays put
         while the rows scroll under it; so does the category list, below
         it (--set-top: the header's height, set by the page). */
      .ph {
        position: sticky;
        top: 0;
        z-index: 4;
        background: var(--bg);
        box-shadow:
          0 -20px 0 0 var(--bg),
          0 12px 0 0 var(--bg);
      }
      .ph .act {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .ph input[type="search"] {
        border: 1px solid var(--border);
        background: var(--surface);
        border-radius: var(--radius-button);
        padding: 6px 10px;
        min-width: 0;
        width: 220px;
        color: var(--text);
      }
      .set-count {
        margin: -8px 0 12px;
        min-height: 0;
        color: var(--muted);
        font-size: 13px;
      }
      .set-count:empty {
        display: none;
      }
      kbd {
        font: 11px var(--mono);
        border: 1px solid var(--border);
        border-bottom-width: 2px;
        border-radius: 4px;
        padding: 0 5px;
        color: var(--muted);
        background: var(--surface);
      }
      /* Categories | rows */
      .set-layout {
        display: grid;
        grid-template-columns: 180px minmax(0, 760px);
        gap: 24px;
        align-items: start;
      }
      #set-body section[data-cat],
      #set-body [data-setting] {
        /* Issue 268: a row's deep link lands below the sticky header too. */
        scroll-margin-top: var(--set-top, 0px);
      }
      /* Issue 163: where a link arrived, marked for a moment. */
      #set-body .set-arrived {
        outline: 2px solid var(--accent);
        outline-offset: 4px;
        border-radius: var(--radius-button);
        background: color-mix(in srgb, var(--accent) 8%, transparent);
        transition:
          background 0.4s,
          outline-color 0.4s;
      }
      .set-nav {
        position: sticky;
        top: var(--set-top, 0px);
        display: grid;
        gap: 2px;
      }
      /* drawn like the rail's .ni */
      .set-ni {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: var(--radius-button);
        color: var(--muted);
        text-decoration: none;
        position: relative;
      }
      .set-ni:hover {
        background: var(--sunken);
        color: var(--text);
      }
      .set-ni[aria-current="true"] {
        background: color-mix(in srgb, var(--accent) 13%, transparent);
        color: var(--text);
        font-weight: 500;
      }
      .set-ni-l {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .den-bdg {
        font: 11px var(--mono);
        padding: 0 6px;
        border-radius: 999px;
        background: var(--sunken);
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }
      /* .set: sections */
      .set {
        display: grid;
        gap: 22px;
        max-width: 760px;
        min-width: 0;
      }
      .set section {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 16px;
        scroll-margin-top: 8px;
      }
      /* A category's heading: h2 under the page's h1 (issue 297). */
      .set section > h2 {
        margin: 0 0 4px;
        font: 600 15px var(--display);
      }
      .set section > h2:focus {
        outline: none;
      }
      .set p {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 13px;
      }
      @media (max-width: 860px) {
        .set-layout {
          grid-template-columns: minmax(0, 1fr);
        }
        .set-nav {
          position: static;
          display: flex;
          overflow-x: auto;
        }
      }
      @media (max-width: 720px) {
        html body.den-has-shell > #den-content {
          padding: 16px;
        }
        .ph input[type="search"] {
          width: 100%;
        }
        .ph .act {
          margin-left: 0;
          flex: 1 1 100%;
        }
      }
    </style>
    <link rel="stylesheet" href="/settings-rows.css" />
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="settings"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div class="ph">
        <div>
          <h1 data-t="n.settings">Settings</h1>
          <div class="sub" data-t="set.ui.sub">
            Saved to your __DEN_TITLE__ preferences and remembered on every page
          </div>
        </div>
        <div class="act" role="search">
          <label class="den-sr" for="set-q" data-t="set.ui.search"
            >Search settings</label
          >
          <input
            type="search"
            id="set-q"
            data-t-attr="placeholder:set.ui.search"
            placeholder="Search settings"
            autocomplete="off"
            aria-keyshortcuts="/"
          />
          <kbd
            aria-hidden="true"
            title="Press / to search"
            data-t-attr="title:set.ui.slashTip"
            >/</kbd
          >
        </div>
      </div>
      <p class="set-count" id="set-count" aria-live="polite"></p>
      <div class="set-layout">
        <nav
          class="set-nav"
          id="set-nav"
          aria-label="Settings categories"
        ></nav>
        <div class="set" id="set-body"></div>
      </div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import {
          appearanceState,
          ensureAppearance,
          setAppearance,
        } from "/appearance.js";
        import { registerDenSettings } from "/settings-registry.js";
        import { mountSettings } from "/settings-page.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        // R21a: the category list sticks just below the sticky header.
        const ph = document.querySelector("#den-content > .ph");
        const setTop = () =>
          document
            .getElementById("den-content")
            .style.setProperty("--set-top", `${ph.offsetHeight + 16}px`);
        setTop();
        if (typeof ResizeObserver === "function")
          new ResizeObserver(setTop).observe(ph);
        registerDenSettings(window.denShell);
        void mountSettings({
          shell: window.denShell,
          appearance: { appearanceState, ensureAppearance, setAppearance },
        });
      </script>
    </main>
  </body>
</html>
