<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/kit/fonts.css" />
    <link rel="stylesheet" href="/kit/tokens.css" />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <title>__DEN_TITLE__ · Verify</title>
    <style>
      /* The Verify page (issue 209; VERIFY-SPEC section 12, direction C):
         the page frame is the Edge page's, the header (.ph) the shell's; the answer
         card (.vf-ans) is a card with a verdict sentence and its actions. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      html body.den-has-shell > #den-content {
        overflow: auto;
        min-width: 0;
        font: 14px/1.45 var(--sans);
        color: var(--text);
        display: block;
      }
      /* The shell's header carries its own 20px/24px inset. */
      #verify-body {
        padding: 0 24px 32px;
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent-text);
      }
      /* The page's h1 and scope line are the shell's header (R20); this
         is the first heading in the body. */
      .vf-head {
        display: flex;
        align-items: flex-end;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .vf-head > div {
        flex: 1 1 16em;
        min-width: 0;
      }
      .vf-head h2 {
        font: 600 18px/1.25 var(--display);
        margin: 0;
        text-wrap: balance;
        overflow-wrap: anywhere;
      }
      .vf-head h2:focus {
        outline: none;
      }
      .vf-lede {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .vf-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }
      @media (min-width: 1000px) {
        .vf-cols {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
      }
      .vf-main {
        min-width: 0;
      }
      .vf-ans,
      .vf-card {
        --c: var(--border-strong);
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin: 0 0 12px;
      }
      .vf-card {
        border-inline-start-width: 1px;
      }
      .vf-card h2,
      .vf-feed h2 {
        font: 600 14px/1.3 var(--sans);
        margin: 0 0 8px;
      }
      .vf-bad {
        --c: var(--bad);
      }
      .vf-ok {
        --c: var(--ok);
      }
      .vf-warn {
        --c: var(--warn);
      }
      .vf-neutral {
        --c: var(--faint);
      }
      .vf-env {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        margin-bottom: 6px;
      }
      .vf-env b {
        font-size: 15px;
      }
      .vf-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 12px var(--mono);
        color: var(--c);
        border: 1px solid var(--c);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .vf-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
      }
      .vf-say {
        font-size: 16px;
        line-height: 1.45;
        font-weight: 500;
        margin: 0 0 6px;
        max-width: 66ch;
      }
      .vf-meta,
      .vf-muted {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0;
      }
      .vf-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .vf-btns .den-btn,
      .vf-report,
      .vf-err .den-btn {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      .vf-st {
        --c: var(--faint);
        display: inline-flex;
        gap: 5px;
        align-items: center;
        font: 12px var(--mono);
        color: var(--c);
        white-space: nowrap;
      }
      .vf-mk {
        font-weight: 700;
      }
      .vf-all {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--sunken);
        margin: 14px 0 0;
      }
      .vf-all > summary {
        cursor: pointer;
        padding: 8px 12px;
        min-height: 36px;
        display: flex;
        align-items: center;
        color: var(--muted);
      }
      .vf-tablewrap {
        padding: 0 12px 10px;
      }
      .vf-checks {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .vf-checks th,
      .vf-checks td {
        text-align: start;
        padding: 6px 8px 6px 0;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }
      .vf-checks thead th {
        font: 11px var(--mono);
        color: var(--faint);
        border-top: 0;
      }
      .vf-checks code,
      .vf-why code,
      .vf-pre {
        font: 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .vf-dep {
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 700px) {
        .vf-checks thead {
          display: none;
        }
        .vf-checks,
        .vf-checks tbody,
        .vf-checks tr,
        .vf-checks th,
        .vf-checks td {
          display: block;
        }
        .vf-checks tr {
          border-top: 1px solid var(--border);
          padding: 6px 0;
        }
        .vf-checks th,
        .vf-checks td {
          border: 0;
          padding: 2px 0;
        }
        .vf-checks td::before {
          content: attr(data-l) ": ";
          color: var(--muted);
          font-size: 12px;
        }
      }
      .vf-old {
        color: var(--muted);
        font-size: 12.5px;
        margin: 16px 0 0;
      }
      .vf-feed {
        min-width: 0;
        border-inline-start: 1px solid var(--border);
        padding-inline-start: 16px;
      }
      @media (max-width: 999px) {
        .vf-feed {
          border-inline-start: 0;
          padding-inline-start: 0;
          border-top: 1px solid var(--border);
          padding-top: 12px;
        }
      }
      .vf-feed ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .vf-feed li {
        display: flex;
        gap: 10px;
        padding: 7px 0;
        font-size: 13px;
      }
      .vf-tx {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .vf-tx small {
        display: block;
        font: 11px var(--mono);
        color: var(--faint);
      }
      .vf-av {
        width: 26px;
        height: 26px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 11px var(--sans);
        background: var(--sunken);
        border: 1px solid var(--border-strong);
        border-radius: 50%;
      }
      .vf-av-agent {
        border-radius: 7px;
        background: var(--accent-fill);
        border-color: var(--accent-fill);
        color: var(--on-accent);
      }
      .vf-role {
        font: 10.5px var(--mono);
        color: var(--muted);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        padding: 0 4px;
        margin-inline: 4px;
      }
      .vf-back {
        margin: 0 0 8px;
      }
      .vf-back a {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
      }
      .vf-why {
        margin: 0;
        padding-inline-start: 20px;
      }
      .vf-why > li {
        margin: 6px 0;
        overflow-wrap: anywhere;
      }
      .vf-why ul {
        margin: 4px 0;
        padding-inline-start: 18px;
      }
      .vf-sub {
        margin: 6px 0 0;
      }
      .vf-pre {
        background: var(--sunken);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        white-space: pre-wrap;
        margin: 6px 0;
      }
      .vf-skel {
        height: 96px;
        border-radius: var(--radius);
        background: var(--sunken);
        margin: 0 0 12px;
      }
      .vf-err {
        border: 1px solid var(--bad);
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      /* Issue 210: S2 Plan and Allow, S3 Running and cancelled. */
      .vf-info {
        --c: var(--accent);
      }
      .vf-card h3 {
        font: 600 13px/1.3 var(--sans);
        margin: 0 0 8px;
      }
      .vf-seg {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 0;
        border: 1px solid var(--border);
        border-radius: var(--radius-button);
        overflow: hidden;
        margin: 0 0 4px;
      }
      .vf-segb {
        min-height: 36px;
        border: 0;
        border-radius: 0;
      }
      .vf-segb + .vf-segb {
        border-inline-start: 1px solid var(--border);
      }
      .vf-segb[aria-pressed="true"] {
        background: var(--accent-fill);
        color: var(--on-accent);
      }
      .vf-sch {
        margin: 0 0 12px;
      }
      .vf-plist,
      .vf-rlist {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .vf-prow,
      .vf-rrow {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 10px;
        padding: 7px 0;
        border-top: 1px solid var(--border);
        overflow-wrap: anywhere;
      }
      .vf-prow:first-child,
      .vf-rrow:first-child {
        border-top: 0;
      }
      .vf-pn {
        font: 12px var(--mono);
        color: var(--faint);
        min-width: 1.5em;
      }
      .vf-pm {
        flex: 1 1 12em;
        min-width: 0;
      }
      .vf-rrow code {
        flex: 1 1 12em;
        min-width: 0;
      }
      .vf-mark {
        font: 12px var(--mono);
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 1px 8px;
      }
      .vf-mark-enforced {
        color: var(--ok);
        border-color: var(--ok);
      }
      .vf-est,
      .vf-rnote {
        font-size: 12.5px;
        color: var(--muted);
      }
      .vf-rnote {
        flex-basis: 100%;
        padding-inline-start: 0;
      }
      .vf-cant {
        --c: var(--warn);
        border-inline-start-width: 4px;
      }
      .vf-cant ul {
        margin: 0;
        padding-inline-start: 18px;
      }
      .vf-dl {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        gap: 6px 14px;
        margin: 0;
      }
      .vf-dl dt {
        color: var(--muted);
        font-size: 12.5px;
      }
      .vf-dl dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .vf-pgs {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .vf-pg + .vf-pg {
        margin-top: 10px;
      }
      .vf-pgh {
        font-size: 12.5px;
        font-weight: 600;
        color: var(--muted);
        margin: 0 0 2px;
      }
      .vf-head .vf-cancel {
        margin-inline-start: auto;
        min-height: 36px;
      }
      .vf-head .vf-av {
        align-self: flex-start;
      }
      .vf-status {
        margin: 8px 0;
        font-weight: 500;
      }
      .vf-decide + .vf-muted {
        margin-top: 6px;
      }
      .vf-prog {
        width: 100%;
        height: 8px;
        margin: 0 0 10px;
        accent-color: var(--accent);
      }
      .vf-confirm {
        border: 1px solid var(--bad);
        border-radius: var(--radius);
        padding: 10px 12px;
        margin-top: 10px;
      }
      .vf-confirm p {
        margin: 0;
      }
      .vf-btns .den-btn.danger {
        border-color: var(--bad);
        color: var(--bad);
      }
      /* Issue 211: the tabs, and S1b the All environments board. */
      .vf-tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        border-bottom: 1px solid var(--border);
        margin: 0 0 14px;
      }
      .vf-tab {
        font: 500 13px var(--sans);
        background: none;
        border: 0;
        border-bottom: 2px solid transparent;
        color: var(--muted);
        padding: 8px 10px;
        min-height: 40px;
        cursor: pointer;
      }
      .vf-tab[aria-pressed="true"] {
        color: var(--accent-text);
        border-bottom-color: var(--accent);
      }
      .vf-stage {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 16px;
        align-items: start;
      }
      @media (min-width: 1000px) {
        .vf-stage.vf-open {
          grid-template-columns: minmax(0, 1fr) minmax(0, 420px);
        }
      }
      .vf-board {
        display: grid;
        grid-auto-flow: column;
        grid-template-rows: auto repeat(var(--rows, 3), minmax(68px, auto));
        grid-template-columns: max-content;
        grid-auto-columns: minmax(0, 1fr);
        gap: 8px;
      }
      .vf-bcol {
        display: contents;
      }
      .vf-beh {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
        min-width: 0;
        padding-bottom: 4px;
      }
      .vf-beh b {
        font: 600 14px var(--sans);
      }
      .vf-plan {
        font-size: 13px;
      }
      .vf-bl {
        align-self: center;
        font: 600 13px var(--mono);
        padding-inline-end: 4px;
      }
      .vf-cell {
        --c: var(--faint);
        font: inherit;
        text-align: start;
        display: flex;
        flex-direction: column;
        gap: 3px;
        min-width: 0;
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        border-radius: var(--radius);
        background: var(--surface);
        color: inherit;
        padding: 8px 10px;
        cursor: pointer;
      }
      .vf-cell:hover {
        border-color: var(--border-strong);
        border-inline-start-color: var(--c);
      }
      .vf-cell[aria-expanded="true"] {
        box-shadow: 0 0 0 2px var(--accent-text);
      }
      .vf-cell.vf-empty {
        border-style: dashed;
        cursor: default;
        --c: var(--border-strong);
      }
      .vf-t-ok {
        --c: var(--ok);
      }
      .vf-t-bad {
        --c: var(--bad);
      }
      .vf-t-warn {
        --c: var(--warn);
      }
      .vf-cell .vf-st,
      .vf-pmeta .vf-st {
        white-space: normal;
        overflow-wrap: anywhere;
        font: 500 14px var(--sans);
      }
      .vf-cn,
      .vf-k {
        font-size: 12px;
        color: var(--muted);
      }
      .vf-cl {
        display: none;
        font: 600 12px var(--mono);
        color: var(--muted);
      }
      .vf-panel {
        border: 1px solid var(--border-strong);
        border-radius: var(--radius);
        background: var(--surface);
        min-width: 0;
      }
      .vf-ph {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .vf-ph h2 {
        margin: 0;
        font: 600 14px var(--sans);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .vf-pmeta {
        margin: 0;
        padding: 10px 14px 0;
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .vf-plist {
        list-style: none;
        margin: 0;
        padding: 6px 14px 12px;
      }
      .vf-pr {
        display: grid;
        gap: 4px;
        padding: 8px 0;
        border-top: 1px solid var(--border);
      }
      .vf-pr:first-child {
        border-top: 0;
      }
      .vf-pra {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        justify-content: space-between;
        align-items: baseline;
      }
      .vf-pra code {
        overflow-wrap: anywhere;
      }
      .vf-strip {
        display: inline-flex;
        flex-wrap: wrap;
        gap: 3px;
        font-size: 12px;
      }
      .vf-strip i {
        font-style: normal;
        color: var(--c);
        min-width: 0.9em;
        text-align: center;
      }
      @media (max-width: 700px) {
        /* One block per environment, its layers as rows: no sideways scroll. */
        .vf-board {
          display: block;
        }
        .vf-bcol {
          display: grid;
          gap: 6px;
          margin-bottom: 16px;
        }
        .vf-blabels {
          display: none;
        }
        .vf-beh {
          flex-direction: row;
          flex-wrap: wrap;
          align-items: center;
        }
        .vf-cl {
          display: block;
        }
        .vf-panel {
          position: fixed;
          inset: 0;
          z-index: 50;
          border-radius: 0;
          border: 0;
          overflow: auto;
        }
      }
      /* Issue 212: S5 history and the flaky mark, S6 security findings. */
      .vf-plinks {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 14px;
        font-size: 13px;
      }
      .vf-hstrip {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        margin: 10px 0 6px;
      }
      .vf-hrun {
        --c: var(--faint);
        font: 600 14px var(--mono);
        min-width: 32px;
        min-height: 32px;
        border: 1px solid var(--border);
        border-bottom: 3px solid var(--c);
        border-radius: var(--radius);
        background: var(--surface);
        color: var(--c);
        cursor: pointer;
      }
      .vf-hrun:hover {
        border-color: var(--border-strong);
        border-bottom-color: var(--c);
      }
      .vf-commits {
        margin: 6px 0 10px;
        padding-inline-start: 18px;
        font-size: 13px;
      }
      .vf-commits li,
      .vf-finds li {
        overflow-wrap: anywhere;
        margin: 3px 0;
      }
      .vf-flaky h3 {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
      }
      .vf-tries summary {
        cursor: pointer;
        min-height: 32px;
        display: flex;
        align-items: center;
        color: var(--accent-text);
      }
      .vf-tries ul,
      .vf-tries ol {
        margin: 4px 0;
        padding-inline-start: 18px;
        font-size: 13px;
      }
      .vf-sevs {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 4px;
      }
      .vf-sev {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 4px 0;
        border-bottom: 1px solid var(--border);
      }
      .vf-sev span {
        text-transform: capitalize;
      }
      .vf-sev b {
        font: 600 14px var(--mono);
      }
      .vf-thr {
        font-size: 12px;
        color: var(--bad);
        border-top: 2px dashed var(--bad);
        padding-top: 4px;
      }
      .vf-finds {
        margin: 0;
        padding-inline-start: 18px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="verify"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div id="verify-body" aria-busy="true" aria-live="polite"></div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import { mountVerify } from "/verify-page.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        void mountVerify(document.getElementById("verify-body"));
      </script>
    </main>
  </body>
</html>
