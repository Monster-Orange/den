<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Mode before first paint: yours (the server fills it in below),
      // else the system's, else the theme's default, else dark.
      (function () {
        var m = "@@DEN_MODE@@";
        if (m !== "dark" && m !== "light") {
          var q = function (s) {
            return (
              window.matchMedia &&
              matchMedia("(prefers-color-scheme: " + s + ")").matches
            );
          };
          m = q("light")
            ? "light"
            : q("dark")
              ? "dark"
              : "@@DEN_DEFAULT_MODE@@";
        }
        document.documentElement.dataset.mode =
          m === "light" ? "light" : "dark";
      })();
    </script>
    <link rel="stylesheet" href="/kit/fonts.css" />
    <link rel="stylesheet" href="/kit/tokens.css" />
    <link rel="stylesheet" href="/kit/base.css" />
    <link rel="stylesheet" href="/theme.css" id="theme-css" />
    <title>__DEN_TITLE__ · Verify</title>
    <style>
      /* The Verify page (issue 209; VERIFY-SPEC section 12, direction C):
         the page frame is the Edge page's, the header (.ph) the shell's; the answer
         card (.vf-ans) is a card with a verdict sentence and its actions. */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
      }
      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      html body.den-has-shell > #den-content {
        overflow: auto;
        min-width: 0;
        font: 14px/1.45 var(--sans);
        color: var(--text);
        display: block;
      }
      /* The shell's header carries its own 20px/24px inset. */
      #verify-body {
        padding: 0 24px 32px;
      }
      #den-content :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      a {
        color: var(--accent-text);
      }
      /* The page's h1 and scope line are the shell's header (R20); this
         is the first heading in the body. */
      .vf-head {
        display: flex;
        align-items: flex-end;
        gap: 12px 16px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .vf-head h2 {
        font: 600 18px/1.25 var(--display);
        margin: 0;
        text-wrap: balance;
      }
      .vf-head h2:focus {
        outline: none;
      }
      .vf-lede {
        color: var(--muted);
        font-size: 13px;
        margin: 4px 0 0;
      }
      .vf-cols {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 20px;
      }
      @media (min-width: 1000px) {
        .vf-cols {
          grid-template-columns: minmax(0, 1fr) 300px;
        }
      }
      .vf-main {
        min-width: 0;
      }
      .vf-ans,
      .vf-card {
        --c: var(--border-strong);
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin: 0 0 12px;
      }
      .vf-card {
        border-inline-start-width: 1px;
      }
      .vf-card h2,
      .vf-feed h2 {
        font: 600 14px/1.3 var(--sans);
        margin: 0 0 8px;
      }
      .vf-bad {
        --c: var(--bad);
      }
      .vf-ok {
        --c: var(--ok);
      }
      .vf-warn {
        --c: var(--warn);
      }
      .vf-neutral {
        --c: var(--faint);
      }
      .vf-env {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: center;
        margin-bottom: 6px;
      }
      .vf-env b {
        font-size: 15px;
      }
      .vf-badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font: 12px var(--mono);
        color: var(--c);
        border: 1px solid var(--c);
        border-radius: 999px;
        padding: 1px 9px;
      }
      .vf-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--c);
      }
      .vf-say {
        font-size: 16px;
        line-height: 1.45;
        font-weight: 500;
        margin: 0 0 6px;
        max-width: 66ch;
      }
      .vf-meta,
      .vf-muted {
        color: var(--muted);
        font-size: 12.5px;
        margin: 0;
      }
      .vf-btns {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 10px;
      }
      .vf-btns .den-btn,
      .vf-report,
      .vf-err .den-btn {
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      .vf-st {
        --c: var(--faint);
        display: inline-flex;
        gap: 5px;
        align-items: center;
        font: 12px var(--mono);
        color: var(--c);
        white-space: nowrap;
      }
      .vf-mk {
        font-weight: 700;
      }
      .vf-all {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--sunken);
        margin: 14px 0 0;
      }
      .vf-all > summary {
        cursor: pointer;
        padding: 8px 12px;
        min-height: 36px;
        display: flex;
        align-items: center;
        color: var(--muted);
      }
      .vf-tablewrap {
        padding: 0 12px 10px;
      }
      .vf-checks {
        width: 100%;
        border-collapse: collapse;
        font-size: 13px;
      }
      .vf-checks th,
      .vf-checks td {
        text-align: start;
        padding: 6px 8px 6px 0;
        border-top: 1px solid var(--border);
        vertical-align: top;
      }
      .vf-checks thead th {
        font: 11px var(--mono);
        color: var(--faint);
        border-top: 0;
      }
      .vf-checks code,
      .vf-why code,
      .vf-pre {
        font: 12px var(--mono);
        overflow-wrap: anywhere;
      }
      .vf-dep {
        color: var(--muted);
        font-size: 12px;
      }
      @media (max-width: 700px) {
        .vf-checks thead {
          display: none;
        }
        .vf-checks,
        .vf-checks tbody,
        .vf-checks tr,
        .vf-checks th,
        .vf-checks td {
          display: block;
        }
        .vf-checks tr {
          border-top: 1px solid var(--border);
          padding: 6px 0;
        }
        .vf-checks th,
        .vf-checks td {
          border: 0;
          padding: 2px 0;
        }
        .vf-checks td::before {
          content: attr(data-l) ": ";
          color: var(--muted);
          font-size: 12px;
        }
      }
      /* Issue 441: an imported environment's card and why view: the
         clause counts, the three lists, a row per check (the whole row
         opens it) and each check's clauses. Tones colour a mark, never
         alone: each has its word beside it or for a screen reader. */
      .vf-counts {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 20px;
        list-style: none;
        margin: 10px 0 0;
        padding: 0;
        color: var(--muted);
      }
      .vf-counts b {
        color: var(--c);
        font-size: 18px;
        margin-inline-end: 4px;
      }
      .vf-clist {
        margin: 14px 0 0;
      }
      .vf-clist h3,
      .vf-gate h3 {
        font: 600 14px/1.3 var(--sans);
        margin: 0 0 6px;
        overflow-wrap: anywhere;
      }
      .vf-clist .vf-meta {
        margin-bottom: 6px;
      }
      .vf-rows {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .vf-rows li {
        display: flex;
        gap: 10px;
        align-items: baseline;
        padding: 7px 0;
        border-top: 1px solid var(--border);
      }
      .vf-rows li:first-child {
        border-top: 0;
      }
      .vf-rows .vf-mk,
      .vf-clauses td:first-child,
      b.vf-warn {
        color: var(--c);
      }
      .vf-rows .vf-mk {
        width: 18px;
        flex: none;
        text-align: center;
      }
      .vf-grow {
        flex: 1 1 auto;
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .vf-rows li:has(> .vf-row) {
        padding: 0;
      }
      .vf-row {
        display: flex;
        gap: 10px;
        align-items: baseline;
        flex: 1 1 auto;
        min-width: 0;
        min-height: 36px;
        padding: 8px 0;
        color: var(--text);
        text-decoration: none;
      }
      .vf-row:hover .vf-grow {
        text-decoration: underline;
      }
      .vf-gate .vf-head {
        align-items: baseline;
        margin-bottom: 8px;
      }
      .vf-gate:focus {
        outline: none;
      }
      .vf-gate .vf-tablewrap {
        padding: 0;
      }
      .vf-clauses td:first-child {
        white-space: nowrap;
      }
      .vf-clauses td {
        overflow-wrap: anywhere;
      }
      .vf-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      @media (max-width: 700px) {
        .vf-clauses .vf-sr {
          position: static;
          width: auto;
          height: auto;
          clip-path: none;
        }
        /* The result says "Needs you" on a phone: no second tag. */
        .vf-clauses b.vf-warn {
          display: none;
        }
      }
      .vf-old {
        color: var(--muted);
        font-size: 12.5px;
        margin: 16px 0 0;
      }
      .vf-feed {
        min-width: 0;
        border-inline-start: 1px solid var(--border);
        padding-inline-start: 16px;
      }
      @media (max-width: 999px) {
        .vf-feed {
          border-inline-start: 0;
          padding-inline-start: 0;
          border-top: 1px solid var(--border);
          padding-top: 12px;
        }
      }
      .vf-feed ol {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .vf-feed li {
        display: flex;
        gap: 10px;
        padding: 7px 0;
        font-size: 13px;
      }
      .vf-tx {
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .vf-tx small {
        display: block;
        font: 11px var(--mono);
        color: var(--faint);
      }
      .vf-av {
        width: 26px;
        height: 26px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 600 11px var(--sans);
        background: var(--sunken);
        border: 1px solid var(--border-strong);
        border-radius: 50%;
      }
      .vf-av-agent {
        border-radius: 7px;
        background: var(--accent-fill);
        border-color: var(--accent-fill);
        color: var(--on-accent);
      }
      .vf-role {
        font: 10.5px var(--mono);
        color: var(--muted);
        border: 1px solid var(--border-strong);
        border-radius: 4px;
        padding: 0 4px;
        margin-inline: 4px;
      }
      .vf-back {
        margin: 0 0 8px;
      }
      .vf-back a {
        display: inline-flex;
        align-items: center;
        min-height: 32px;
      }
      .vf-why {
        margin: 0;
        padding-inline-start: 20px;
      }
      .vf-why > li {
        margin: 6px 0;
        overflow-wrap: anywhere;
      }
      .vf-why ul {
        margin: 4px 0;
        padding-inline-start: 18px;
      }
      .vf-sub {
        margin: 6px 0 0;
      }
      .vf-pre {
        background: var(--sunken);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        padding: 8px 10px;
        white-space: pre-wrap;
        margin: 6px 0;
      }
      .vf-skel {
        height: 96px;
        border-radius: var(--radius);
        background: var(--sunken);
        margin: 0 0 12px;
      }
      .vf-err {
        border: 1px solid var(--bad);
        border-radius: var(--radius);
        padding: 10px 12px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px 12px;
        align-items: center;
      }
      /* Issue 214: Schedules (S11). A row's state is its edge colour, plus a
         symbol and a word (never colour alone). */
      .vf-head > .den-btn {
        margin-inline-start: auto;
        min-height: 36px;
        display: inline-flex;
        align-items: center;
        text-decoration: none;
      }
      .vf-sch-list {
        list-style: none;
        margin: 8px 0 12px;
        padding: 0;
      }
      .vf-sch {
        --c: var(--border-strong);
        border: 1px solid var(--border);
        border-inline-start: 4px solid var(--c);
        background: var(--surface);
        border-radius: var(--radius);
        padding: 14px 16px;
        margin: 0 0 12px;
      }
      .vf-sch:focus {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .vf-sch-h {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 10px;
        align-items: baseline;
      }
      .vf-sch-h h3 {
        font: 600 15px/1.3 var(--sans);
        margin: 0;
        overflow-wrap: anywhere;
      }
      .vf-pill {
        font: 11.5px var(--mono);
        color: var(--muted);
        border: 1px solid var(--border-strong);
        border-radius: 999px;
        padding: 0 8px;
      }
      .vf-sch-mods {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 8px;
        margin: 6px 0 8px;
        padding: 0;
        font-size: 12.5px;
        overflow-wrap: anywhere;
      }
      ol.vf-sch-mods {
        display: block;
        padding-inline-start: 20px;
      }
      .vf-sch-facts {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 8px 16px;
        margin: 0 0 8px;
      }
      .vf-sch-facts dt {
        color: var(--muted);
        font-size: 11.5px;
      }
      .vf-sch-facts dd {
        margin: 2px 0 0;
        font-size: 13px;
      }
      .vf-flag {
        margin: 8px 0 0;
        padding: 8px 10px;
        border: 1px solid color-mix(in srgb, var(--warn) 55%, var(--border));
        border-radius: var(--radius);
        background: var(--sunken);
        font-size: 13px;
      }
      .vf-sch-ask,
      .vf-sch-change {
        margin: 10px 0 0;
      }
      .vf-sch-ask h4,
      .vf-sch-change h4 {
        font: 600 13px/1.3 var(--sans);
        margin: 8px 0 4px;
      }
      .vf-sch-change ul {
        margin: 0;
        padding-inline-start: 20px;
        font-size: 13px;
      }
      @media (max-width: 700px) {
        .vf-sch-facts {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .vf-btns .den-btn {
          min-height: 44px;
        }
      }
    </style>
  </head>
  <body>
    <!-- The shell: top bar and rail, the same on every page (shell.js). -->
    <div id="den-shell" data-page="verify"></div>
    <script src="/shell.js"></script>

    <!-- The page's one main landmark: everything after the shell. -->
    <main id="den-content">
      <div id="verify-body" aria-busy="true" aria-live="polite"></div>

      <script type="module">
        import {
          applyDenConfig,
          initChangelog,
          initHealth,
          initLogBadge,
          initWorkspacePill,
        } from "/header.js";
        import { mountVerify } from "/verify-page.js";
        void Promise.all([
          initHealth(),
          initWorkspacePill(),
          applyDenConfig(),
          initChangelog(),
        ]).then(initLogBadge);
        void mountVerify(document.getElementById("verify-body"));
      </script>
    </main>
  </body>
</html>
