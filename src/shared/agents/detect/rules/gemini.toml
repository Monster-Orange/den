# Modified by Den: one rule added at the end (input_prompt_idle, marked).
# Den ships this file with each release and never fetches rules at run time.

id = "gemini"
version = "2026.06.10.1"
min_engine_version = 1
updated_at = "2026-06-10T00:00:00Z"

[[rules]]
id = "apply_or_allow_change"
state = "blocked"
priority = 300
region = "whole_recent"
visible_blocker = true
any = [
  { contains = ["│ Apply this change"] },
  { contains = ["│ Allow execution"] },
  { all = [{ contains = ["yes"] }, { any = [{ contains = ["waiting for user confirmation"] }, { contains = ["│ Do you want to proceed"] }, { contains = ["do you want to proceed?"] }] }] },
  { line_regex = ['(?i)^\s*❯.*(yes|allow)'] },
]

[[rules]]
id = "esc_cancel_working"
state = "working"
priority = 100
region = "whole_recent"
visible_working = true
contains = ["esc to cancel"]

# Added by Den (not in herdr's file): herdr calls a known agent that no
# rule matches "idle"; Den keeps its own bell and output signals then, so
# Gemini's empty input box needs a rule of its own. Its placeholder shows
# only while the box is empty, and working's "esc to cancel" outranks it.
[[rules]]
id = "input_prompt_idle"
state = "idle"
priority = 50
region = "bottom_non_empty_lines(8)"
visible_idle = true
contains = ["type your message"]
not = [{ contains = ["esc to cancel"] }]
