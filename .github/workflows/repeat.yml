# Runs chosen test files many times, to tell a flaky test from a broken one
# (issue 398; for example 20 runs of one file). Run by hand only
# (workflow_dispatch needs write access to this repo, so a fork can't start
# it). Each run's pass or fail goes to the job summary.
#
# Where it runs: the self-hosted runners only when the
# DEN_SELF_HOSTED_NIGHT repo variable is 'on' (the night switch, apart from
# ci.yml's day switch), DEN_SELF_HOSTED_NIGHT_LABELS names their labels (a
# JSON array; issue 1581: there's no default, and the switch on without them
# stops the run at its first step), and the run was started by hand here;
# otherwise GitHub-hosted. Issue 1492: the event check stays in the expression, so a
# trigger added later can't bring someone else's code to the box.
name: repeat
run-name: "Evidence for issue 1833: shard 15 of run 45876385372 with a process sampler (not a re-run of the carry)"

on:
  workflow_dispatch:
    inputs:
      files:
        description: "Test files, space-separated (paths under tests/)"
        required: true
        type: string
      count:
        description: "Runs per Node"
        required: false
        default: "20"
        type: string
      nodes:
        description: "Node versions"
        required: false
        default: "both"
        type: choice
        options: ["22", "24", "both"]
      browsers:
        description: "Playwright browsers to install"
        required: false
        default: "chromium webkit"
        type: choice
        options: ["none", "chromium", "webkit", "chromium webkit"]

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ${{ (github.event_name == 'workflow_dispatch' && vars.DEN_SELF_HOSTED_NIGHT == 'on' && vars.DEN_SELF_HOSTED_NIGHT_LABELS) && fromJSON(vars.DEN_SELF_HOSTED_NIGHT_LABELS) || 'ubuntu-latest' }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.nodes == 'both' && '["22.13.0","24.13.0"]' || inputs.nodes == '22' && '["22.13.0"]' || '["24.13.0"]') }}
    env:
      DEN_TEST_WORKERS: "2"
      DEN_TEST_QUARANTINE: exclude
      DEN_TEST_DOCKER: skip
      # Inputs reach the shell through the environment, never pasted into
      # the script.
      FILES: ${{ inputs.files }}
      COUNT: ${{ inputs.count }}
      BROWSERS: ${{ inputs.browsers }}
    steps:
      # Issue 1581: the switch alone sends nothing to a box.
      - name: The box's labels are set when its switch is on
        if: github.event_name == 'workflow_dispatch' && vars.DEN_SELF_HOSTED_NIGHT == 'on' && vars.DEN_SELF_HOSTED_NIGHT_LABELS == ''
        run: |
          echo "::error::DEN_SELF_HOSTED_NIGHT is on but DEN_SELF_HOSTED_NIGHT_LABELS is not set. Set it to the runners' labels as a JSON array, such as [\"self-hosted\",\"linux\"], or turn DEN_SELF_HOSTED_NIGHT off. Nothing was sent to a self-hosted runner."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Check the inputs
        run: |
          case "$COUNT" in ''|*[!0-9]*) echo "count must be a whole number"; exit 1;; esac
          [ "$COUNT" -ge 1 ] && [ "$COUNT" -le 100 ] || { echo "count must be 1 to 100"; exit 1; }
          for f in $FILES; do
            [[ "$f" =~ ^tests/[A-Za-z0-9_./-]+$ ]] && [[ "$f" != *..* ]] || { echo "not a test path: $f"; exit 1; }
            [ -f "$f" ] || { echo "no such file: $f"; exit 1; }
          done
      - run: npm ci
      # Issue 398: the install goes through scripts/ci-pw-install.sh (a time
      # limit and one retry per part; the browsers come from the cache).
      - if: ${{ inputs.browsers != 'none' }}
        id: pw
        run: bash scripts/ci-pw-install.sh version >> "$GITHUB_OUTPUT"
      - if: ${{ inputs.browsers != 'none' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/den-apt
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-apt
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Playwright's browsers and system packages (scripts/ci-pw-install.sh)
        if: ${{ inputs.browsers != 'none' }}
        timeout-minutes: 15
        # $BROWSERS unquoted on purpose: one argument per browser; the
        # script refuses any name that is not a browser.
        run: bash scripts/ci-pw-install.sh $BROWSERS
      - name: Sample the runner's processes every 5 s
        run: |
          (
            while :; do
              echo "=== $(date -u +%H:%M:%S) load $(cut -d' ' -f1-3 /proc/loadavg)"
              ps -eo pid,ppid,pgid,etimes,pcpu,rss,args --sort=-pcpu | head -40 | cut -c1-400
              sleep 5
            done
          ) > "$RUNNER_TEMP/samples.log" 2>&1 &
      - name: Run the files ${{ inputs.count }} times
        run: |
          fails=0
          {
            echo "### Node ${{ matrix.node }}: $COUNT runs"
            echo
            echo "Files: \`$FILES\`"
            echo
            echo "| Run | Result | Seconds |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 "$COUNT"); do
            start=$(date +%s)
            echo "=== run $i starts $(date -u +%H:%M:%S)" >> "$RUNNER_TEMP/samples.log"
            if npx jest --forceExit $FILES > "run-$i.log" 2>&1; then r=pass
            else r=FAIL; fails=$((fails + 1)); tail -n 60 "run-$i.log"; fi
            echo "| $i | $r | $(( $(date +%s) - start )) |" >> "$GITHUB_STEP_SUMMARY"
            echo "run $i: $r"
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "**$fails of $COUNT runs failed.**" >> "$GITHUB_STEP_SUMMARY"
          [ "$fails" -eq 0 ]
      - name: The samples and the run logs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-1833-node${{ matrix.node }}
          path: |
            ${{ runner.temp }}/samples.log
            run-*.log
          retention-days: 14
