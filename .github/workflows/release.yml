# Releases @monster-orange/den (CONTRIBUTING › Releasing). npm's trusted publishing only: no token anywhere, in CI or out. npm
# trusts this file by its name: never rename it.
# - A push to main whose package.json version isn't on npm yet IS the release: the gates, the tarball and SHA256SUMS,
#   the tag v<version> (made here, unless it already tags this commit or one before it), `npm publish` over OIDC with
#   provenance, and a GitHub release with the tarball and SHA256SUMS. A version already on npm: nothing runs past the
#   check. No human step, after the package's first publish (by hand, once: until then the check stops here too).
# - By hand (workflow_dispatch): a dry run. The same gates and the same tarball, kept with SHA256SUMS as an artifact:
#   the one-time first publish of a package (which trusted publishing can't do) is that tarball, from a maintainer's machine.
# A prerelease version (0.1.0-dev.0) never publishes: main can carry work toward a
# version without releasing it.
# There is no tag trigger: a version is released from main, once (npm refuses to publish a version twice).
# Only the npm tarball ships: no raw binaries.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# one run at a time, in order: a run that starts after a release finds its version on npm and stops
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the parent too: only the commit that set the version releases (below)
          fetch-depth: 2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
      - name: Is this version on npm yet?
        id: check
        env:
          NPM_SCOPE: ${{ vars.NPM_SCOPE }}
        run: |
          version=$(node -p 'require("./package.json").version')
          name=$(node -p 'require("./package.json").name')
          case "$name" in "$NPM_SCOPE"/*) ;; *) echo "::error::$name isn't under the repository variable NPM_SCOPE ($NPM_SCOPE)"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # on npm: it prints the version. Not on npm: nothing, or E404. Any other error (the registry down) fails the
          # run rather than guess.
          if found=$(npm view "$name@$version" version 2> npm-view.err); then
            if [ "$found" = "$version" ]; then release=false; else release=true; fi
          elif grep -q E404 npm-view.err; then
            release=true
          else
            cat npm-view.err; exit 1
          fi
          # trusted publishing can't create a package: until a maintainer's first publish (README), nothing to do here
          if [ "$release" = true ] && ! npm view "$name" name > /dev/null 2> npm-view.err; then
            if grep -q E404 npm-view.err; then
              echo "::warning::$name isn't on npm yet: its first publish is by hand (CONTRIBUTING › Releasing)"; release=false
            else
              cat npm-view.err; exit 1
            fi
          fi
          # npm shows a new version 20-60 minutes after its publish: until then any later push to main still carrying
          # that version reads "not on npm" too, and would publish it again from a commit with unreleased code. Only
          # the commit that set the version releases: its first parent has another version, and no tag v<version>
          # names another commit.
          if [ "$release" = true ] && git cat-file -e HEAD^1 2> /dev/null; then
            parent=$(git show HEAD^1:package.json | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).version')
            if [ "$parent" = "$version" ]; then
              echo "$version was set before this commit (its parent has it too): not published again"; release=false
            fi
          fi
          if [ "$release" = true ]; then
            # an annotated tag: the ^{} line is the commit it tags
            tagged=$(git ls-remote origin "refs/tags/v$version^{}" "refs/tags/v$version" | sort -k2 -r | head -n 1 | cut -f1)
            if [ -n "$tagged" ] && [ "$tagged" != "$(git rev-parse HEAD)" ]; then
              echo "v$version already tags $tagged, not this commit: not published again"; release=false
            fi
          fi
          case "$version" in *-*) echo "$version is a prerelease: not published"; release=false;; esac
          if [ "$GITHUB_EVENT_NAME" != push ]; then release=false; fi
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "$name@$version: release=$release ($GITHUB_EVENT_NAME)"

  # The gates, on both ends of the supported Node range (as ci.yml): the
  # lowest that package.json's engines allows, and the Node installs run.
  # Both block: nothing publishes that wasn't checked on either (den#84).
  # The fast checks are one job per Node; the unit suite is split in four
  # parts that run side by side (jest --shard), every test once per Node.
  checks:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Org-name gate
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
        run: node scripts/org-name-gate.mjs

  tests:
    needs: check
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
        shard: [1, 2, 3, 4, 5, 6]
    # Two jest workers per shard, as in ci.yml (issues 195-198).
    env:
      DEN_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # the browser tests (the What's new dialog) need Chromium, as in ci.yml
      # Playwright's browsers (cached by OS and Playwright's version) and their
      # system packages, each part with a time limit and one retry
      # (scripts/ci-pw-install.sh): the one-line install hung on a slow apt
      # mirror until the job's timeout.
      - id: pw
        run: bash scripts/ci-pw-install.sh version >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/den-apt
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-apt
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Playwright's browsers and system packages
        timeout-minutes: 15
        run: bash scripts/ci-pw-install.sh
      # Issue 296: the files that start Docker containers run after the
      # rest, never beside the browser tests (tests/docker-suites.mjs).
      - run: npm test -- --shard=${{ matrix.shard }}/6
        env:
          DEN_TEST_DOCKER: skip
      - run: npm test -- --shard=${{ matrix.shard }}/6 --passWithNoTests
        env:
          DEN_TEST_DOCKER: only

  # The tarball, built on the lowest supported Node (the safe direction),
  # once the gates have passed on both.
  pack:
    needs: [check, checks, tests]
    if: needs.check.outputs.release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - name: Every dependency from npm (no git or file dependency ships)
        run: |
          node -e '
            const deps = require("./package.json").dependencies ?? {};
            const bad = Object.entries(deps).filter(([, v]) => /^(github:|git[+:]|file:|https?:)/.test(v));
            if (bad.length) { console.error("::error::not from npm: " + bad.map(([k, v]) => k + "@" + v).join(", ")); process.exit(1); }
          '
      - name: Pack, and the checksums
        id: pack
        run: |
          mkdir -p release
          # Never parse npm pack's stdout: lifecycle scripts can print into it.
          npm pack --ignore-scripts --pack-destination release >/dev/null
          tarball=$(cd release && ls -1 -- *.tgz)
          [ "$(printf '%s\n' "$tarball" | wc -l)" -eq 1 ] || { echo "::error::expected one tarball, got: $tarball"; exit 1; }
          (cd release && sha256sum "$tarball" > SHA256SUMS && cat SHA256SUMS)
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error

  tag:
    needs: [check, checks, tests, pack]
    if: needs.check.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the tag (a tag pushed with GITHUB_TOKEN starts no workflow)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the history to place a tag in
          fetch-tags: true
      # Every gated candidate of this version (its tags v<version>-dev.N) is in this commit's history: a candidate
      # that passed its gate and never merged stops the release.
      - name: The gated candidates are in this release
        run: sh scripts/release-ancestry.sh "${{ needs.check.outputs.version }}" "$GITHUB_SHA"
      - name: The tag v<version>
        env:
          TAG: v${{ needs.check.outputs.version }}
        run: |
          # A tag already on this commit or one before it (a re-run, or a tag pushed by hand): keep it. A tag on a
          # commit that isn't this one's ancestor: stop. A tag is never moved.
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            if git merge-base --is-ancestor "$TAG^{commit}" "$GITHUB_SHA"; then
              echo "$TAG already tags $(git rev-parse --short "$TAG^{commit}"), an ancestor of $GITHUB_SHA: kept"
            else
              echo "::error::$TAG tags $(git rev-parse --short "$TAG^{commit}"), which isn't on main before this commit"; exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

  publish:
    needs: [check, pack, tag]
    runs-on: ubuntu-latest # trusted publishing takes GitHub-hosted runners only
    timeout-minutes: 45 # npm can take ~20 min to serve an accepted (202) upload
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusts, instead of any npm token
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: npm 11.21 (trusted publishing needs 11.5.1 or later)
        run: npm install -g npm@11.21.0 && npm --version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Check the tarball against its checksum
        run: cd release && sha256sum -c SHA256SUMS
      # "./": without it, npm reads `release/<file>` as a GitHub repository (owner/name) and tries git over ssh
      - name: Publish it on npm
        run: npm publish "./release/${{ needs.pack.outputs.tarball }}" --access public --loglevel verbose
      # npm answers 202 and processes the upload before serving it (seen: ~20 min). Until then the version is
      # "staged": another publish gets 409, and a later run's check would not see it. So this job ends only when npm
      # serves the version, and nobody reruns publish in that window.
      - name: Wait until npm serves it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for i in $(seq 1 60); do
            if [ "$(npm view "@monster-orange/den@$VERSION" version --prefer-online 2>/dev/null)" = "$VERSION" ]; then
              echo "npm serves @monster-orange/den@$VERSION (after about $(( (i - 1) * 30 ))s)"; exit 0
            fi
            sleep 30
          done
          echo "::error::npm accepted @monster-orange/den@$VERSION but has not served it after 30 minutes. Do not rerun publish (npm answers 409 for a staged version); check https://status.npmjs.org and the package page."
          exit 1

  github-release:
    needs: [check, pack, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: The GitHub release, with the tarball and SHA256SUMS
        run: gh release create "$TAG" "release/${{ needs.pack.outputs.tarball }}" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --title "@monster-orange/den $TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check.outputs.version }}

  # The UI kit, @monster-orange/den-ui (packages/den-ui), on its own version. It publishes only once the package
  # exists on npm (its first publish is by hand, from the den-ui/v<version> GitHub release's tarball) and a trusted
  # publisher for this file is set on it. Until then, and for a version already on npm or a prerelease, it skips.
  den-ui:
    # Issue 296: the kit ships only once both test halves pass, as Den does.
    needs: [checks, tests]
    runs-on: ubuntu-latest # trusted publishing takes GitHub-hosted runners only
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write # the OIDC token npm trusts, instead of any npm token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          registry-url: https://registry.npmjs.org
      - name: Is this den-ui version to publish?
        id: ui
        run: |
          V=$(node -p 'require("./packages/den-ui/package.json").version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if ! npm view @monster-orange/den-ui name > /dev/null 2>&1; then
            echo "@monster-orange/den-ui is not on npm yet: its first publish is by hand. Skipped."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif [ "$(npm view "@monster-orange/den-ui@$V" version 2>/dev/null)" = "$V" ]; then
            echo "@monster-orange/den-ui@$V is on npm already. Skipped."; echo "go=no" >> "$GITHUB_OUTPUT"
          elif case "$V" in *-*) true;; *) false;; esac; then
            echo "$V is a prerelease: never published. Skipped."; echo "go=no" >> "$GITHUB_OUTPUT"
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: npm 11.21 (trusted publishing needs 11.5.1 or later)
        if: steps.ui.outputs.go == 'yes'
        run: npm install -g npm@11.21.0 && npm --version
      - name: Publish den-ui on npm
        if: steps.ui.outputs.go == 'yes'
        run: cd packages/den-ui && npm publish --access public --loglevel verbose
