# The release's gates and its tarball, in one place (CONTRIBUTING › Releasing). Two workflows call this one, so their
# steps can't drift apart:
# - release.yml, on main: the commit's own versions, and no tests (tests: false, issue 996). The tree was tested
#   before: its pull request's CI and the bed (scripts/release-tree-check.mjs, release.yml's tested job). Its tag,
#   publish and GitHub release wait on these.
# - release-dry-run.yml, on every dev tag (v<version>-dev.N): with the versions the release will carry, which each job
#   applies to its own copy first (scripts/release-dry-run.mjs apply), as the release commit will, and with the tests:
#   it runs beside the bed, off the release's path. Nothing is committed.
# Nothing here tags, publishes or needs a token: it reads the repository only.
name: release gates

on:
  workflow_call:
    inputs:
      den-version:
        description: "Den's release version (X.Y.Z) to apply first; empty: the commit's own"
        type: string
        default: ""
      kit-version:
        description: "packages/den-ui's version the release will publish"
        type: string
        default: ""
      changelog-date:
        description: "the date the release commit gives the changelog entry (YYYY-MM-DD)"
        type: string
        default: ""
      ref:
        description: "Issue 922: the commit to build (a promoted release's); empty: the run's own"
        type: string
        default: ""
      dev-tag:
        description: "Issue 922: the dev tag it was promoted from (release.json, SHA256SUMS); empty: none"
        type: string
        default: ""
      dev-commit:
        description: "Issue 922: that dev tag's commit"
        type: string
        default: ""
      tests:
        description: "run the unit suite (the release itself doesn't: its tree was tested on its pull request)"
        type: boolean
        default: true
      box-labels:
        description: "Issue 1492: self-hosted labels (a JSON array) for checks and pack, honoured on a dev tag's push only; empty: GitHub-hosted"
        type: string
        default: ""
    secrets:
      DEN_ORG_NAMES:
        required: false
    outputs:
      tarball:
        description: "the tarball's file name, in the artifact named release"
        value: ${{ jobs.pack.outputs.tarball }}

permissions:
  contents: read

jobs:
  # The gates, on both ends of the supported Node range (as ci.yml): the
  # lowest that package.json's engines allows, and the Node installs run.
  # Both block: nothing publishes that wasn't checked on either (den#84).
  # The fast checks are one job per Node; the unit suite is split in eight
  # parts that run side by side (jest --shard), every test once per Node.
  # (Six parts reached the 30-minute limit at 0.4.88-dev.3: two were cut
  # off while still passing. Eight leave room again.)
  # Issue 1492: checks and pack may use the box the dry run names (box-labels), on a dev tag's push only; the
  # release passes none. The test shards always run GitHub-hosted.
  checks:
    runs-on: ${{ (inputs.box-labels != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.')) && fromJSON(inputs.box-labels) || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: The release's versions (dry run)
        if: inputs.den-version != ''
        run: node scripts/release-dry-run.mjs apply "$DEN_VERSION" "$KIT_VERSION" "$CHANGELOG_DATE"
        env:
          DEN_VERSION: ${{ inputs.den-version }}
          KIT_VERSION: ${{ inputs.kit-version }}
          CHANGELOG_DATE: ${{ inputs.changelog-date }}
      - run: node --version
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Org-name gate
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
        run: node scripts/org-name-gate.mjs

  tests:
    if: inputs.tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    # Two jest workers per shard, as in ci.yml (issues 195-198).
    env:
      DEN_TEST_WORKERS: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: The release's versions (dry run)
        if: inputs.den-version != ''
        run: node scripts/release-dry-run.mjs apply "$DEN_VERSION" "$KIT_VERSION" "$CHANGELOG_DATE"
        env:
          DEN_VERSION: ${{ inputs.den-version }}
          KIT_VERSION: ${{ inputs.kit-version }}
          CHANGELOG_DATE: ${{ inputs.changelog-date }}
      - run: npm ci
      # the browser tests (the What's new dialog) need Chromium, as in ci.yml
      # Playwright's browsers (cached by OS and Playwright's version) and their
      # system packages, each part with a time limit and one retry
      # (scripts/ci-pw-install.sh): the one-line install hung on a slow apt
      # mirror until the job's timeout.
      - id: pw
        run: bash scripts/ci-pw-install.sh version >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/den-apt
          key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-apt
          restore-keys: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}
      - name: Playwright's browsers and system packages
        timeout-minutes: 15
        run: bash scripts/ci-pw-install.sh
      # Issue 296: the files that start Docker containers run after the
      # rest, never beside the browser tests (tests/docker-suites.mjs).
      - run: npm test -- --shard=${{ matrix.shard }}/8 --passWithNoTests
        env:
          DEN_TEST_DOCKER: skip
          DEN_TEST_BROWSER: only
      - if: ${{ !cancelled() }}
        run: npm test -- --shard=${{ matrix.shard }}/8
        env:
          DEN_TEST_DOCKER: skip
          DEN_TEST_BROWSER: skip
      - run: npm test -- --shard=${{ matrix.shard }}/8 --passWithNoTests
        env:
          DEN_TEST_DOCKER: only

  # The tarball, built on the lowest supported Node (the safe direction),
  # once the gates have passed on both.
  pack:
    needs: [checks, tests]
    # the tests skipped (tests: false) is fine; failed or cancelled is not
    if: ${{ !cancelled() && needs.checks.result == 'success' && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ${{ (inputs.box-labels != '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-dev.')) && fromJSON(inputs.box-labels) || 'ubuntu-latest' }}
    timeout-minutes: 10
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.13.0
          cache: npm
      - name: The release's versions (dry run)
        if: inputs.den-version != ''
        run: node scripts/release-dry-run.mjs apply "$DEN_VERSION" "$KIT_VERSION" "$CHANGELOG_DATE"
        env:
          DEN_VERSION: ${{ inputs.den-version }}
          KIT_VERSION: ${{ inputs.kit-version }}
          CHANGELOG_DATE: ${{ inputs.changelog-date }}
      - run: npm ci
      - name: Every dependency from npm (no git or file dependency ships)
        run: |
          node -e '
            const deps = require("./package.json").dependencies ?? {};
            const bad = Object.entries(deps).filter(([, v]) => /^(github:|git[+:]|file:|https?:)/.test(v));
            if (bad.length) { console.error("::error::not from npm: " + bad.map(([k, v]) => k + "@" + v).join(", ")); process.exit(1); }
          '
      - name: Pack, and the checksums
        id: pack
        env:
          DEV_TAG: ${{ inputs.dev-tag }}
          DEV_COMMIT: ${{ inputs.dev-commit }}
        run: |
          mkdir -p release
          # Issue 922: a promoted release says what it was built from (release.json ships in the package).
          if [ -n "$DEV_TAG" ]; then
            node scripts/release-record.mjs json "$(node -p 'require("./package.json").version')" "$DEV_TAG" "$DEV_COMMIT" "$(git rev-parse HEAD)"
          fi
          # Never parse npm pack's stdout: lifecycle scripts can print into it.
          npm pack --ignore-scripts --pack-destination release >/dev/null
          tarball=$(cd release && ls -1 -- *.tgz)
          [ "$(printf '%s\n' "$tarball" | wc -l)" -eq 1 ] || { echo "::error::expected one tarball, got: $tarball"; exit 1; }
          if [ -n "$DEV_TAG" ]; then
            cp release.json release/release.json
            (cd release && sha256sum "$tarball" release.json > SHA256SUMS)
            node scripts/release-record.mjs sums release "$DEV_TAG" "$DEV_COMMIT"
          else
            (cd release && sha256sum "$tarball" > SHA256SUMS)
          fi
          cat release/SHA256SUMS
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release/
          if-no-files-found: error
