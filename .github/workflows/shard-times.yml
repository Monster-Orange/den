# Issue 845: the measured test times the shards are planned from
# (tests/shard-times.json), refreshed weekly from the full-suite runs of what
# lands on main (the staging pull request from next/queue), with each
# shard's p90 checked: the slowest at most 20% over the fastest. The
# refreshed file is kept as an artifact for a pull request; this workflow
# only reads.
name: shard-times
on:
  schedule:
    - cron: "41 11 * * 1"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: shard-times
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
      - name: Refresh the times and check the balance
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/shard-times-refresh.mjs --branch next/queue --runs 5 --summary "$GITHUB_STEP_SUMMARY" --check
      - name: The refreshed times file
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-times
          path: tests/shard-times.json
          retention-days: 30
