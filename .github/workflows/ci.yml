# Den's gates on every push and pull request: types, lint, unit tests, the
# packaged-install smoke (dist-smoke), and the org-name gate (no org's names, hosts or accounts in this public repo; the
# patterns live in the DEN_ORG_NAMES secret, never in the repo).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # the suite takes 13–19 min on a hosted runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The words gate diffs against a base commit (scripts/words-base.txt).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # LOGICAL-ERD.md "Words people see": no added string says workspace,
      # org, user, session… (company, install, project, person, agent).
      - run: node scripts/words-gate.mjs
      - run: npm run lint
      # The browser tests (tests/unit/server/*.browser.test.ts) need a real
      # chromium; this installs the one the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Org-name gate
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
        run: node scripts/org-name-gate.mjs

  # den#84: a Jest worker crashed (SIGSEGV in V8's mark-compact GC) about one
  # full run in six, on Node 24.13 on macOS; the gates above run 22.14. This
  # runs the unit tests on that Node and on the current LTS, to learn whether
  # it is that V8. It reports and never blocks a merge.
  tests-newer-node:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ["24.13.0", "lts/*"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # as the gates job: some tests read the history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

  # Den as an installed package: npm pack, scaffold a distribution from the
  # tarball (create acme), install the tarball into it, then run its CLI, make
  # targets and web server from node_modules. See scripts/dist-smoke.sh.
  dist-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.14.0
          cache: npm
      # npm pack runs the prepare script (husky): it needs the dev dependencies.
      - run: npm ci
      - run: bash scripts/dist-smoke.sh
