# Den's gates on every push and pull request: types, lint, unit tests, the
# packaged-install smoke (dist-smoke), and the org-name gate (no org's names, hosts or accounts in this public repo; the
# patterns live in the DEN_ORG_NAMES secret, never in the repo).
#
# Issue 398: a push to main runs everything on both Nodes (checks, tests,
# den-ui-nav, dist-smoke), and so does a nightly run of main. A pull
# request runs the tests the change affects (scripts/affected-tests.mjs)
# on both Nodes, in the pr job, and in pr-shards when that subset is
# large; its checks and dist-smoke run on Node 22 only, or on both when
# it changes the Node or the dependencies (scripts/pr-nodes.js).
# release.yml releases only from a commit whose push run passed on both.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly, main's full matrix on both Nodes (a schedule runs on the
  # default branch): what a pull request leaves to one Node still meets
  # both every day, even with no push.
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

# A newer push to the same pull request cancels the older run: only the
# newest commit's result counts, and the old run held runner slots other
# PRs were queued for. Pushes to main are never cancelled (each main
# commit gets its full run): their group is the commit's sha. With one
# group for main, GitHub kept one pending run and cancelled the one
# before it (11 of 30 push runs), and release.yml releases only from a
# commit whose push run passed.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Where each job runs. Every job uses the same runs-on guard: a
  # self-hosted runner only when the DEN_SELF_HOSTED repo variable is 'on'
  # and the code came from this repo (a push, or a pull request whose head
  # branch lives here). A fork's pull request always runs GitHub-hosted, so
  # code from outside never reaches the box. The variable is the off switch:
  # unset or anything but 'on' puts every job back on GitHub-hosted runners.
  # The self-hosted runners are ephemeral containers that take one job each
  # and are thrown away after it. pull_request_target is never used (a test
  # fails if it appears). release.yml stays GitHub-hosted: trusted publishing
  # needs a GitHub-hosted runner.
  #
  # Fail fast: the static tests (tests/static-tests.json: no server, no
  # browser, no Docker, no child process; scripts/static-tests.js has the
  # rule) in one short job on Node 22, on pull requests and on push. Every
  # job that runs tests waits for it, so a red version-sync or token check
  # fails in about a minute instead of after the 10-13 minute shards. The
  # checks and the install smoke don't wait: they run beside it, as before.
  # Each file must run in under the list's max_seconds on this runner; the
  # job summary has the slowest files and the job's wall time.
  static:
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      DEN_TEST_WORKERS: "4"
    steps:
      - run: echo "STATIC_T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.13.0"
          cache: npm
      - run: npm ci
      - name: The static tests
        run: |
          node scripts/static-tests.mjs --check
          mapfile -t files < <(node scripts/static-tests.mjs --list)
          code=0
          npx jest --forceExit --json --outputFile=static.json "${files[@]}" || code=$?
          STATIC_WALL_SECONDS=$(( $(date +%s) - STATIC_T0 )) \
            node scripts/static-tests.mjs --timing static.json --summary "$GITHUB_STEP_SUMMARY" || code=1
          echo "static job: $(( $(date +%s) - STATIC_T0 )) s from start"
          exit "$code"

  # The fast gates, once per Node at both ends of the supported range: the
  # lowest Node that package.json's engines allows, and the Node installs
  # run (24.13, the one den#84's V8 crash was seen on). Both block a merge.
  checks:
    if: github.event_name != 'pull_request'
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The words gate diffs against a base commit (scripts/words-base.txt).
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version
      - run: npm ci
      - run: npm run typecheck
      # LOGICAL-ERD.md "Words people see": no added string says workspace,
      # org, user, session… (company, install, project, person, agent).
      - run: node scripts/words-gate.mjs
      - run: npm run lint
      # Issue 95: Den keeps no copy of a UI kit component (den-ui's
      # shell, version chip, What's new, update pill, Report, working
      # pop-up); a copy passes only when DIVERGE.md names it with a reason.
      - run: npm run -s gate:den-ui
      - name: Org-name gate
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
        run: node scripts/org-name-gate.mjs
      # The same names, over the messages of the new commits (issue 189):
      # a PR's base..head, a push's before..after. Needs the full history
      # (fetch-depth above). Messages already on main are not rewritten.
      # The nightly run has no new commits.
      - name: Org-name gate, commit messages
        if: github.event_name != 'schedule'
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/org-name-commits.mjs "$RANGE_BASE..$RANGE_HEAD"

  # The whole unit suite on both Nodes, split in four parts that run side by
  # side (jest --shard): every test runs once per Node, as before; the suite
  # took 13–19 min (up to 30 with setup) in one job.
  tests:
    needs: [static]
    if: github.event_name != 'pull_request'
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    # Two jest workers per shard (the DEN_TEST_WORKERS setting): with
    # jest's cores-minus-one the shared runner starved and the heaviest
    # files ran 2-8 times slower, past their budgets (issues 195-198).
    # Issue 397: quarantined tests block here as everywhere on main (a pull
    # request runs them apart, in pr or pr-shards).
    env:
      DEN_TEST_WORKERS: "2"
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The browser tests (tests/unit/server/*.browser.test.ts) need a real
      # chromium; this installs the one the pinned Playwright expects.
      - run: npx playwright install --with-deps chromium webkit
      # Issue 296: the files that start Docker containers run after the
      # rest, never beside the browser tests (tests/docker-suites.mjs).
      - run: npm test -- --shard=${{ matrix.shard }}/4
        env:
          DEN_TEST_DOCKER: skip
      - run: npm test -- --shard=${{ matrix.shard }}/4 --passWithNoTests
        env:
          DEN_TEST_DOCKER: only

  # Issue 95: the global nav inventory (packages/den-ui/inventory) on the
  # one browser build its reference was taken on: Playwright's image, by
  # version and its linux/amd64 digest (NAV_BROWSER_IMAGE in nav-inventory.js; a test keeps
  # the two the same). Its run-server serves Chromium and WebKit; the test
  # connects with exposeNetwork "<loopback>", so the browsers reach Den's
  # server on this runner through the connection. Elsewhere (the shards,
  # no DEN_PW_WS) the suite skips: a local browser lays text out a few px
  # apart. --verbose: the red cases show by name in the log.
  #
  # On a pull request it runs when the change's tests include it (it is in
  # the subset when den-ui or the shell changed: the pr job's "nav" output).
  den-ui-nav:
    needs: [static, pr]
    if: ${{ !cancelled() && needs.static.result == 'success' && (github.event_name != 'pull_request' || needs.pr.outputs.nav == 'true') }}
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      NAV_IMAGE: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:cf0daee9b994042e011bc29f20cdff1a9f682a039b43fcd738f7d8a9d3bcd9d6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.13.0"
          cache: npm
      - run: npm ci
      - name: Start the pinned Playwright server
        run: |
          docker run -d --name pw-nav --init --platform linux/amd64 -p 127.0.0.1:3921:3921 "$NAV_IMAGE" \
            npx -y playwright@1.61.1 run-server --port 3921 --host 0.0.0.0
          # Docker's port is open at once; the server is up when it says so.
          for i in $(seq 1 150); do
            docker logs pw-nav 2>&1 | grep -q "Listening on" && exit 0
            sleep 2
          done
          docker logs pw-nav
          exit 1
      - name: Nav inventory (Chromium and WebKit, 1280 and 390)
        env:
          DEN_PW_WS: ws://localhost:3921/
        run: npx jest --forceExit --verbose --maxWorkers=1 tests/unit/den-ui/nav-inventory.browser.test.ts
      - if: failure()
        run: docker logs pw-nav | tail -50

  # Den as an installed package: npm pack, scaffold a distribution from the
  # tarball (create acme), install the tarball into it, then run its CLI, make
  # targets and web server from node_modules. See scripts/dist-smoke.sh.
  dist-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"] # as gates: the supported range's ends
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # npm pack runs the prepare script (husky): it needs the dev dependencies.
      - run: npm ci
      - run: bash scripts/dist-smoke.sh

  # Issue 398: a pull request. The tests the change affects
  # (scripts/affected-tests.mjs: jest's related tests, the browser specs
  # tests/affected-map.json maps to a changed page, a smoke set; or all of
  # them when a shared file changed), listed with the reason for each in
  # the job summary, run on both Nodes: the replay found real failures on
  # one Node only, on each side (12 on Node 22, 11 on Node 24), in the unit
  # tests and the browser specs. The checks and the install smoke run on
  # Node 22 only (check-nodes): none failed on one Node alone in the
  # audit's runs. A change to package.json (engines too), the lockfile,
  # .nvmrc or a workspace package.json runs them on both
  # (scripts/pr-nodes.js). A small subset runs here; a large one (all,
  # more than 150 files, or more than 30 browser specs) runs in pr-shards,
  # four ways. Issue 397: quarantined tests are left out of the blocking
  # steps and run in a last step that can't block. A failed test file runs
  # once more (scripts/flake-retry.js); one that passes then is listed in
  # the summary's "Flaky on retry" table, in the flaky-on-retry artifact,
  # and with a warning when tests/quarantine.json doesn't have it. A push
  # to main never retries: every failure blocks.
  pr:
    needs: [static]
    if: github.event_name == 'pull_request'
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"] # as checks: the supported range's ends
    # Both Nodes pick the same subset (a diff and file lists), so either
    # one's outputs will do.
    outputs:
      shards: ${{ steps.select.outputs.shards }}
      nav: ${{ steps.select.outputs.nav }}
    env:
      DEN_TEST_WORKERS: "2"
      DEN_TEST_QUARANTINE: exclude
      # scripts/flake-retry.js: a failed test file runs once more; a pass on
      # retry is listed as flaky (summary, artifact, a warning), never
      # silent. Pull requests only: main never retries.
      FLAKE_RETRY_SHA: ${{ github.event.pull_request.head.sha }}
      FLAKE_RETRY_JOB: ${{ github.job }} (${{ matrix.node }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The words gate and the subset diff against the base commit.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # First (seconds): the tests this change affects, and the Nodes its
      # checks run on.
      - name: Pick the tests this change affects, and the Nodes for its checks
        id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NODES: "22.13.0,24.13.0" # the matrix above
        run: |
          node scripts/pr-nodes.js "$BASE" HEAD --nodes "$NODES" >> "$GITHUB_OUTPUT"
          node scripts/affected-tests.mjs "$BASE" HEAD --out affected.txt --summary "$GITHUB_STEP_SUMMARY"
          # Large: everything, more than 150 files, or more than 30 browser
          # specs (they take most of the time: ~30 s each against ~2 s).
          n=$(grep -c . affected.txt)
          b=$(grep -c '\.browser\.test\.ts$' affected.txt || true)
          if [ "$(head -1 affected.txt)" = ALL ] || [ "$n" -gt 150 ] || [ "$b" -gt 30 ]; then
            echo 'shards=[1,2,3,4]' >> "$GITHUB_OUTPUT"
          else
            echo 'shards=[]' >> "$GITHUB_OUTPUT"
          fi
          if grep -qxE 'ALL|tests/unit/den-ui/nav-inventory\.browser\.test\.ts' affected.txt; then
            echo 'nav=true' >> "$GITHUB_OUTPUT"
          fi
      - if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        run: npm run typecheck
      - if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        run: node scripts/words-gate.mjs
      - if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        run: npm run lint
      - if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        run: npm run -s gate:den-ui
      - name: Org-name gate
        if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
        run: node scripts/org-name-gate.mjs
      - name: Org-name gate, commit messages
        if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        env:
          DEN_ORG_NAMES: ${{ secrets.DEN_ORG_NAMES }}
          RANGE_BASE: ${{ github.event.pull_request.base.sha }}
          RANGE_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/org-name-commits.mjs "$RANGE_BASE..$RANGE_HEAD"
      - if: contains(fromJSON(steps.select.outputs.check-nodes), matrix.node)
        run: bash scripts/dist-smoke.sh
      - if: steps.select.outputs.shards == '[]'
        run: npx playwright install --with-deps chromium webkit
      # Issue 296: the files that start Docker containers run after the rest.
      - if: steps.select.outputs.shards == '[]'
        env:
          DEN_TEST_DOCKER: skip
        run: mapfile -t files < affected.txt && node scripts/flake-retry.js -- --passWithNoTests "${files[@]}"
      - if: steps.select.outputs.shards == '[]'
        env:
          DEN_TEST_DOCKER: only
        run: mapfile -t files < affected.txt && node scripts/flake-retry.js -- --passWithNoTests "${files[@]}"
      - name: Quarantined tests (never blocks)
        if: ${{ !cancelled() && steps.select.outputs.shards == '[]' }}
        continue-on-error: true
        env:
          DEN_TEST_QUARANTINE: only
        run: npx jest --forceExit --passWithNoTests
      # Every file that passed only on its retry, for anyone to collect.
      - name: Flaky on retry (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-on-retry-pr-${{ matrix.node }}
          path: flaky-on-retry.json
          if-no-files-found: ignore

  # A large subset (all the tests, more than 150 files or 30 browser
  # specs), in four parts side by side on each Node. Each part picks the
  # same subset again (a diff and jest's file lists: seconds) and runs its
  # share of it.
  pr-shards:
    needs: [static, pr]
    if: needs.pr.outputs.shards != '[]'
    runs-on: ${{ (vars.DEN_SELF_HOSTED == 'on' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)) && fromJSON('["self-hosted","den-wsl"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    env:
      DEN_TEST_WORKERS: "2"
      DEN_TEST_QUARANTINE: exclude
      # scripts/flake-retry.js: a failed test file runs once more; a pass on
      # retry is listed as flaky (summary, artifact, a warning), never
      # silent. Pull requests only: main never retries.
      FLAKE_RETRY_SHA: ${{ github.event.pull_request.head.sha }}
      FLAKE_RETRY_JOB: ${{ github.job }} (${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13.0", "24.13.0"]
        shard: ${{ fromJSON(needs.pr.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Pick the tests this change affects
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/affected-tests.mjs "$BASE" HEAD --out affected.txt
          # ALL: no file list, jest runs every test.
          if [ "$(head -1 affected.txt)" = ALL ]; then : > affected.txt; fi
      - run: npx playwright install --with-deps chromium webkit
      - env:
          DEN_TEST_DOCKER: skip
        run: mapfile -t files < affected.txt && node scripts/flake-retry.js -- --shard=${{ matrix.shard }}/4 --passWithNoTests "${files[@]}"
      - env:
          DEN_TEST_DOCKER: only
        run: mapfile -t files < affected.txt && node scripts/flake-retry.js -- --shard=${{ matrix.shard }}/4 --passWithNoTests "${files[@]}"
      - name: Quarantined tests (never blocks)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          DEN_TEST_QUARANTINE: only
        run: npx jest --forceExit --shard=${{ matrix.shard }}/4 --passWithNoTests
      # Every file that passed only on its retry, for anyone to collect.
      - name: Flaky on retry (artifact)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flaky-on-retry-shards-${{ matrix.node }}-${{ matrix.shard }}
          path: flaky-on-retry.json
          if-no-files-found: ignore
